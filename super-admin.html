<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CassaCafe — لوحة المشرف العام</title>
  <link rel="stylesheet" href="./core/styles.css" />
</head>
<body>
  <div id="app" v-cloak>
    <!-- شاشة التحميل الأولي -->
    <div v-if="booting" class="container" style="text-align:center; padding-top:80px;">
      <p class="muted">جارٍ التحقق من الجلسة...</p>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div v-else-if="!member" class="container">
      <div class="card login-box">
        <h2 style="margin:0 0 6px;">CassaCafe — المشرف العام</h2>
        <p class="muted" style="margin:0 0 18px;">دخول مخصّص لإدارة المقاهي والاشتراكات</p>

        <form @submit.prevent="login">
          <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" v-model.trim="loginForm.email" required autocomplete="username" class="ltr" />
          </div>
          <div class="field">
            <label>كلمة السر</label>
            <input type="password" v-model="loginForm.password" required autocomplete="current-password" class="ltr" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" :disabled="busy">
            {{ busy ? "جارٍ الدخول..." : "تسجيل الدخول" }}
          </button>
        </form>
      </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <template v-else>
      <header class="topbar">
        <div>
          <h1>CassaCafe — المشرف العام</h1>
          <div style="font-size:0.75rem; opacity:0.85;">{{ serverToday || "توقيت تونس" }}</div>
        </div>
        <div class="row">
          <button class="btn btn-sm btn-outline" @click="refreshAll" :disabled="busy">تحديث</button>
          <button class="btn btn-sm btn-danger" @click="logout">خروج</button>
        </div>
      </header>

      <main class="container">
        <!-- إحصائيات سريعة -->
        <div class="grid-3" style="margin-bottom:14px;">
          <div class="stat">
            <div class="stat-val">{{ cafes.length }}</div>
            <div class="stat-lbl">إجمالي المقاهي</div>
          </div>
          <div class="stat">
            <div class="stat-val" style="color:var(--ok);">{{ activeCafesCount }}</div>
            <div class="stat-lbl">نشطة ومشتركة</div>
          </div>
          <div class="stat">
            <div class="stat-val" style="color:var(--warn);">{{ openFeedbackCount }}</div>
            <div class="stat-lbl">ملاحظات مفتوحة</div>
          </div>
        </div>

        <!-- التبويبات -->
        <div class="tabs">
          <button class="tab" :class="{ active: tab === 'cafes' }" @click="tab = 'cafes'">
            المقاهي ({{ cafes.length }})
          </button>
          <button class="tab" :class="{ active: tab === 'feedback' }" @click="tab = 'feedback'">
            ملاحظات التجربة ({{ feedback.length }})
          </button>
          <button class="tab" :class="{ active: tab === 'errors' }" @click="tab = 'errors'">
            سجل الأعطال ({{ errors.length }})
          </button>
        </div>

        <!-- تبويب المقاهي -->
        <section v-if="tab === 'cafes'">
          <div class="row" style="margin-bottom:12px;">
            <input
              type="text"
              v-model.trim="search"
              placeholder="ابحث بالاسم أو الرمز أو الهاتف..."
              style="flex:1; min-width:200px;"
            />
            <button class="btn btn-primary" @click="openCreateModal">+ مقهى جديد</button>
          </div>

          <div v-if="!filteredCafes.length" class="card" style="text-align:center;">
            <p class="muted">لا توجد مقاهٍ مطابقة بعد. اضغط «+ مقهى جديد» لإضافة أول مقهى.</p>
          </div>

          <div v-for="cafe in filteredCafes" :key="cafe.id" class="card">
            <div class="row" style="margin-bottom:8px;">
              <div>
                <strong style="font-size:1.05rem;">{{ cafe.name }}</strong>
                <span class="badge badge-info ltr" style="margin-right:6px;">{{ cafe.code }}</span>
              </div>
              <span class="badge" :class="statusBadge(cafe).cls">{{ statusBadge(cafe).label }}</span>
            </div>

            <div class="muted" style="margin-bottom:8px;">
              المالك: <strong>{{ cafe.owner_name || "—" }}</strong>
              <span v-if="cafe.phone"> • هاتف: <span class="ltr">{{ cafe.phone }}</span></span>
              <br />
              النمط: <strong>{{ WORK_PATTERNS[cafe.work_pattern] || cafe.work_pattern }}</strong>
              • نهاية الاشتراك: <strong>{{ formatDate(cafe.subscription_until) }}</strong>
              ({{ daysLabel(cafe.subscription_until) }})
            </div>

            <!-- شارات الميزات المفعّلة -->
            <div class="chip-grid" style="margin-bottom:10px;">
              <span
                v-for="(lbl, key) in FEATURE_LABELS"
                :key="key"
                class="badge"
                :class="cafe.features?.[key] ? 'badge-ok' : ''"
                :style="cafe.features?.[key] ? '' : 'background:#f3f4f6;color:#9ca3af;'"
              >
                {{ lbl }}
              </span>
            </div>

            <!-- أزرار الإجراءات -->
            <div class="row">
              <div class="row">
                <button class="btn btn-sm btn-primary" @click="openManageModal(cafe)">إدارة وتعديل</button>
                <a class="btn btn-sm btn-outline" :href="`./owner.html?cafe_id=${cafe.id}`">
                  دخول لتسيير المقهى
                </a>
              </div>
              <div class="row">
                <button class="btn btn-sm btn-outline" @click="quickExtend(cafe, 30)" :disabled="busy">+30 يوم</button>
                <button
                  class="btn btn-sm"
                  :class="cafe.active ? 'btn-warn' : 'btn-primary'"
                  @click="toggleActive(cafe)"
                  :disabled="busy"
                >
                  {{ cafe.active ? "إيقاف" : "تفعيل" }}
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- تبويب ملاحظات التجربة -->
        <section v-if="tab === 'feedback'">
          <div v-if="!feedback.length" class="card" style="text-align:center;">
            <p class="muted">لا توجد ملاحظات مسجّلة حتى الآن.</p>
          </div>
          <div v-for="fb in feedback" :key="fb.id" class="card">
            <div class="row" style="margin-bottom:6px;">
              <strong>{{ cafeNameById(fb.cafe_id) }}</strong>
              <span class="badge" :class="fb.status === 'done' ? 'badge-ok' : fb.status === 'reviewed' ? 'badge-info' : 'badge-warn'">
                {{ fb.status === 'done' ? 'مُنجز' : fb.status === 'reviewed' ? 'قيد المراجعة' : 'جديد' }}
              </span>
            </div>
            <p style="margin:6px 0;">{{ fb.note }}</p>
            <div class="row">
              <span class="muted">الشاشة: {{ fb.screen || "—" }} • {{ formatDate(fb.created_at) }}</span>
              <div class="row">
                <button v-if="fb.status !== 'reviewed'" class="btn btn-sm btn-outline" @click="setFeedbackStatus(fb, 'reviewed')">مراجعة</button>
                <button v-if="fb.status !== 'done'" class="btn btn-sm btn-primary" @click="setFeedbackStatus(fb, 'done')">تم التنفيذ</button>
              </div>
            </div>
          </div>
        </section>

        <!-- تبويب الأعطال -->
        <section v-if="tab === 'errors'">
          <div v-if="!errors.length" class="card" style="text-align:center;">
            <p class="muted">لا توجد أعطال مسجّلة.</p>
          </div>
          <div v-for="er in errors" :key="er.id" class="card">
            <div class="row" style="margin-bottom:4px;">
              <strong>{{ cafeNameById(er.cafe_id) }} ({{ er.app_role || "—" }})</strong>
              <span class="muted">{{ formatDate(er.created_at) }}</span>
            </div>
            <div class="ltr" style="font-family:monospace; font-size:0.84rem; color:var(--danger); word-break:break-word;">
              {{ er.message }}
            </div>
            <div class="muted" style="margin-top:4px;">الشاشة: {{ er.screen || "—" }} • الإصدار: {{ er.app_version || "—" }}</div>
          </div>
        </section>
      </main>
    </template>

    <!-- نافذة إنشاء مقهى جديد -->
    <div v-if="showCreate" class="modal-backdrop" @click.self="showCreate = false">
      <div class="modal">
        <div class="row" style="margin-bottom:10px;">
          <h3 style="margin:0;">إنشاء مقهى جديد</h3>
          <button class="btn btn-sm btn-outline" @click="showCreate = false">إغلاق</button>
        </div>

        <form @submit.prevent="createCafe">
          <div class="grid-2">
            <div class="field">
              <label>اسم المقهى *</label>
              <input type="text" v-model.trim="createForm.name" required placeholder="مثال: مقهى الكروان" />
            </div>
            <div class="field">
              <label>رمز المقهى (حروف إنجليزية صغيرة) *</label>
              <input type="text" v-model.trim="createForm.code" required pattern="[a-z0-9]{3,12}" placeholder="karawan" class="ltr" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>اسم المالك</label>
              <input type="text" v-model.trim="createForm.owner_name" placeholder="الاسم الكامل" />
            </div>
            <div class="field">
              <label>رقم الهاتف</label>
              <input type="tel" v-model.trim="createForm.phone" placeholder="22123456" class="ltr" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>بريد دخول المالك *</label>
              <input type="email" v-model.trim="createForm.owner_email" required class="ltr" placeholder="owner@example.com" />
            </div>
            <div class="field">
              <label>كلمة سر المالك (6+ أحرف) *</label>
              <input type="text" v-model="createForm.owner_password" required minlength="6" class="ltr" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>نمط العمل</label>
              <select v-model="createForm.work_pattern">
                <option v-for="(lbl, key) in WORK_PATTERNS" :key="key" :value="key">{{ lbl }}</option>
              </select>
            </div>
            <div class="field">
              <label>مدة الاشتراك بالأيام</label>
              <input type="number" v-model.number="createForm.days" min="1" max="3650" />
            </div>
          </div>

          <!-- إعداد العامل الأول عند الحاجة -->
          <div v-if="createForm.work_pattern !== 'owner_only'" class="card" style="background:#f9fafb;">
            <strong style="display:block; margin-bottom:8px;">العامل 1 (w1)</strong>
            <div class="grid-3">
              <div class="field">
                <label>الاسم</label>
                <input type="text" v-model.trim="createForm.w1_name" placeholder="اختياري" />
              </div>
              <div class="field">
                <label>الأجر اليومي (د.ت)</label>
                <input type="number" step="0.5" min="0" v-model.number="createForm.w1_wage_tnd" class="ltr" />
              </div>
              <div class="field" v-if="patternNeedsW1Pin(createForm.work_pattern)">
                <label>رمز PIN (4-8 أرقام)</label>
                <input type="text" v-model.trim="createForm.w1_pin" pattern="\d{4,8}" class="ltr" />
              </div>
            </div>
          </div>

          <!-- إعداد العامل الثاني -->
          <div v-if="createForm.work_pattern === 'two_workers'" class="card" style="background:#f9fafb;">
            <strong style="display:block; margin-bottom:8px;">العامل 2 (w2)</strong>
            <div class="grid-3">
              <div class="field">
                <label>الاسم</label>
                <input type="text" v-model.trim="createForm.w2_name" placeholder="اختياري" />
              </div>
              <div class="field">
                <label>الأجر اليومي (د.ت)</label>
                <input type="number" step="0.5" min="0" v-model.number="createForm.w2_wage_tnd" class="ltr" />
              </div>
              <div class="field">
                <label>رمز PIN (4-8 أرقام)</label>
                <input type="text" v-model.trim="createForm.w2_pin" pattern="\d{4,8}" class="ltr" />
              </div>
            </div>
          </div>

          <!-- الميزات المفعّلة -->
          <div class="field">
            <label>الميزات المفعّلة لهذا المقهى</label>
            <div class="chip-grid">
              <label
                v-for="(lbl, key) in FEATURE_LABELS"
                :key="key"
                class="toggle-chip"
                :class="{ on: createForm.features[key] }"
              >
                <input type="checkbox" v-model="createForm.features[key]" />
                {{ lbl }}
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" :disabled="busy">
            {{ busy ? "جارٍ الإنشاء..." : "حفظ وإنشاء الحسابات" }}
          </button>
        </form>
      </div>
    </div>

    <!-- نافذة إدارة مقهى موجود -->
    <div v-if="selectedCafe" class="modal-backdrop" @click.self="selectedCafe = null">
      <div class="modal">
        <div class="row" style="margin-bottom:10px;">
          <h3 style="margin:0;">إدارة: {{ selectedCafe.name }}</h3>
          <button class="btn btn-sm btn-outline" @click="selectedCafe = null">إغلاق</button>
        </div>

        <div class="grid-2">
          <div class="field">
            <label>اسم المقهى</label>
            <input type="text" v-model.trim="editForm.name" />
          </div>
          <div class="field">
            <label>اسم المالك</label>
            <input type="text" v-model.trim="editForm.owner_name" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label>الهاتف</label>
            <input type="tel" v-model.trim="editForm.phone" class="ltr" />
          </div>
          <div class="field">
            <label>نمط العمل</label>
            <select v-model="editForm.work_pattern">
              <option v-for="(lbl, key) in WORK_PATTERNS" :key="key" :value="key">{{ lbl }}</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>الميزات المعزولة</label>
          <div class="chip-grid">
            <label
              v-for="(lbl, key) in FEATURE_LABELS"
              :key="key"
              class="toggle-chip"
              :class="{ on: editForm.features[key] }"
            >
              <input type="checkbox" v-model="editForm.features[key]" />
              {{ lbl }}
            </label>
          </div>
        </div>

        <button class="btn btn-primary btn-block" @click="saveCafeChanges" :disabled="busy">
          حفظ التعديلات
        </button>

        <hr class="divider" />

        <!-- إدارة الاشتراك -->
        <div class="field">
          <label>تعديل الاشتراك (ينتهي: {{ formatDate(selectedCafe.subscription_until) }})</label>
          <div class="row">
            <button class="btn btn-sm btn-outline" @click="quickExtend(selectedCafe, 30)" :disabled="busy">+30 يوم</button>
            <button class="btn btn-sm btn-outline" @click="quickExtend(selectedCafe, 90)" :disabled="busy">+90 يوم</button>
            <button class="btn btn-sm btn-outline" @click="quickExtend(selectedCafe, 365)" :disabled="busy">+سنة</button>
          </div>
        </div>

        <hr class="divider" />

        <!-- تغيير كلمة سر المالك -->
        <div class="field">
          <label>تغيير كلمة سر المالك ({{ selectedCafe.owner_email }})</label>
          <div class="row">
            <input type="text" v-model="ownerNewPass" placeholder="كلمة سر جديدة (6+ أحرف)" class="ltr" style="flex:1;" />
            <button class="btn btn-sm btn-primary" @click="changeOwnerPassword" :disabled="busy || ownerNewPass.length < 6">
              تغيير
            </button>
          </div>
        </div>

        <!-- إدارة العمال -->
        <div v-if="cafeWorkers.length">
          <hr class="divider" />
          <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:8px;">العمال المرتبطون بالمقهى</label>
          <div v-for="w in cafeWorkers" :key="w.id" class="card" style="background:#f9fafb; padding:10px;">
            <div class="row" style="margin-bottom:6px;">
              <strong>{{ w.display_name }} ({{ w.slot }})</strong>
              <span class="muted">الأجر: {{ miToTnd(w.default_wage_mi) }} د.ت • جلسة #{{ w.session_version }}</span>
            </div>
            <div class="row">
              <button v-if="w.user_id" class="btn btn-sm btn-outline" @click="promptWorkerPin(w)" :disabled="busy">
                تغيير PIN
              </button>
              <button class="btn btn-sm btn-warn" @click="promptResetWorker(w)" :disabled="busy">
                تصفير لعامل جديد
              </button>
            </div>
          </div>
        </div>

        <hr class="divider" />

        <!-- حذف نهائي -->
        <button class="btn btn-danger-soft btn-block" @click="deleteCafe(selectedCafe)" :disabled="busy">
          حذف المقهى وحساباته نهائياً
        </button>
      </div>
    </div>

    <!-- إشعار Toast -->
    <div v-if="toast.text" class="toast" :class="toast.type">{{ toast.text }}</div>
  </div>

  <script type="module">
    import { createApp, ref, reactive, computed, onMounted } from "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js";
    import {
      supabase,
      callManageAccounts,
      getServerTime,
      miToTnd,
      tndToMi,
      daysRemaining,
      formatDate,
      translateError,
      logAppError,
      WORK_PATTERNS,
      FEATURE_LABELS,
    } from "./core/supabase.js";

    createApp({
      setup() {
        const booting = ref(true);
        const busy = ref(false);
        const member = ref(null);
        const serverToday = ref("");
        const tab = ref("cafes");
        const search = ref("");

        const cafes = ref([]);
        const members = ref([]);
        const feedback = ref([]);
        const errors = ref([]);

        const loginForm = reactive({ email: "", password: "" });
        const toast = reactive({ text: "", type: "" });
        let toastTimer = null;

        const notify = (text, type = "ok") => {
          toast.text = text;
          toast.type = type;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { toast.text = ""; }, 3500);
        };

        const showCreate = ref(false);
        const defaultCreateForm = () => ({
          name: "",
          code: "",
          owner_name: "",
          phone: "",
          owner_email: "",
          owner_password: "",
          work_pattern: "worker_only",
          days: 30,
          w1_name: "",
          w1_wage_tnd: 25,
          w1_pin: "1234",
          w2_name: "",
          w2_wage_tnd: 25,
          w2_pin: "5678",
          features: {
            stock: true,
            credit: false,
            waste: false,
            partners: false,
            tables: false,
            maintenance: false,
            trial_feedback: true,
          },
        });
        const createForm = reactive(defaultCreateForm());

        const selectedCafe = ref(null);
        const ownerNewPass = ref("");
        const editForm = reactive({
          name: "",
          owner_name: "",
          phone: "",
          work_pattern: "owner_only",
          features: {},
        });

        const filteredCafes = computed(() => {
          const q = search.value.toLowerCase();
          if (!q) return cafes.value;
          return cafes.value.filter((c) =>
            [c.name, c.code, c.owner_name, c.phone, c.owner_email]
              .some((v) => String(v || "").toLowerCase().includes(q))
          );
        });

        const activeCafesCount = computed(() =>
          cafes.value.filter((c) => c.active && daysRemaining(c.subscription_until) > 0).length
        );

        const openFeedbackCount = computed(() =>
          feedback.value.filter((f) => f.status === "open").length
        );

        const cafeWorkers = computed(() => {
          if (!selectedCafe.value) return [];
          return members.value.filter(
            (m) => m.cafe_id === selectedCafe.value.id && m.role === "worker" && m.active
          );
        });

        const cafeNameById = (id) => {
          if (!id) return "النظام";
          return cafes.value.find((c) => c.id === id)?.name || "مقهى محذوف";
        };

        const patternNeedsW1Pin = (p) => ["worker_only", "worker_owner", "two_workers"].includes(p);

        const statusBadge = (cafe) => {
          if (!cafe.active) return { label: "موقوف", cls: "badge-danger" };
          const d = daysRemaining(cafe.subscription_until);
          if (d <= 0) return { label: "منتهي", cls: "badge-danger" };
          if (d <= 5) return { label: `ينتهي خلال ${d} أيام`, cls: "badge-warn" };
          return { label: "نشط", cls: "badge-ok" };
        };

        const daysLabel = (iso) => {
          const d = daysRemaining(iso);
          if (d <= 0) return "منتهي";
          return `متبقي ${d} يوم`;
        };

        const checkSession = async () => {
          booting.value = true;
          try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session?.user) {
              member.value = null;
              return;
            }
            const { data, error } = await supabase
              .from("cafe_members")
              .select("*")
              .eq("user_id", session.user.id)
              .eq("role", "super_admin")
              .eq("active", true)
              .maybeSingle();

            if (error || !data) {
              await supabase.auth.signOut();
              member.value = null;
              notify("هذا الحساب لا يملك صلاحية المشرف العام.", "err");
              return;
            }
            member.value = data;
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            booting.value = false;
          }
        };

        const refreshAll = async () => {
          busy.value = true;
          try {
            const [t, cRes, mRes, fRes, eRes] = await Promise.all([
              getServerTime().catch(() => null),
              supabase.from("cafes").select("*").order("created_at", { ascending: false }),
              supabase.from("cafe_members").select("*").order("slot", { ascending: true }),
              supabase.from("trial_feedback").select("*").order("created_at", { ascending: false }).limit(50),
              supabase.from("app_errors").select("*").order("created_at", { ascending: false }).limit(50),
            ]);
            if (t?.today) serverToday.value = `${t.today} • ${t.time_hhmm}`;
            if (cRes.error) throw cRes.error;
            cafes.value = cRes.data || [];
            members.value = mRes.data || [];
            feedback.value = fRes.data || [];
            errors.value = eRes.data || [];

            if (selectedCafe.value) {
              const fresh = cafes.value.find((c) => c.id === selectedCafe.value.id);
              selectedCafe.value = fresh || null;
            }
          } catch (e) {
            notify(translateError(e), "err");
            logAppError({ role: "super_admin", screen: "refreshAll", message: e?.message || e });
          } finally {
            busy.value = false;
          }
        };

        const login = async () => {
          busy.value = true;
          try {
            const { error } = await supabase.auth.signInWithPassword({
              email: loginForm.email,
              password: loginForm.password,
            });
            if (error) throw error;
            await checkSession();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const logout = async () => {
          await supabase.auth.signOut();
          member.value = null;
          cafes.value = [];
        };

        const openCreateModal = () => {
          Object.assign(createForm, defaultCreateForm());
          showCreate.value = true;
        };

        const createCafe = async () => {
          busy.value = true;
          try {
            await callManageAccounts({
              action: "create_cafe",
              code: createForm.code.toLowerCase(),
              name: createForm.name,
              owner_name: createForm.owner_name,
              phone: createForm.phone,
              owner_email: createForm.owner_email,
              owner_password: createForm.owner_password,
              work_pattern: createForm.work_pattern,
              days: Number(createForm.days || 30),
              features: { ...createForm.features },
              w1_name: createForm.w1_name,
              w1_wage_mi: tndToMi(createForm.w1_wage_tnd),
              w1_pin: createForm.w1_pin,
              w2_name: createForm.w2_name,
              w2_wage_mi: tndToMi(createForm.w2_wage_tnd),
              w2_pin: createForm.w2_pin,
            });
            showCreate.value = false;
            notify("تم إنشاء المقهى وحساباته بنجاح.");
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const openManageModal = (cafe) => {
          selectedCafe.value = cafe;
          ownerNewPass.value = "";
          editForm.name = cafe.name;
          editForm.owner_name = cafe.owner_name || "";
          editForm.phone = cafe.phone || "";
          editForm.work_pattern = cafe.work_pattern;
          editForm.features = {
            stock: false,
            credit: false,
            waste: false,
            partners: false,
            tables: false,
            maintenance: false,
            trial_feedback: false,
            ...(cafe.features || {}),
          };
        };

        const saveCafeChanges = async () => {
          if (!selectedCafe.value) return;
          busy.value = true;
          try {
            await callManageAccounts({
              action: "update_cafe_admin",
              cafe_id: selectedCafe.value.id,
              name: editForm.name,
              owner_name: editForm.owner_name,
              phone: editForm.phone,
              work_pattern: editForm.work_pattern,
              features: { ...editForm.features },
            });
            notify("تم حفظ التعديلات.");
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const quickExtend = async (cafe, days) => {
          busy.value = true;
          try {
            await callManageAccounts({
              action: "update_cafe_admin",
              cafe_id: cafe.id,
              extend_days: days,
            });
            notify(`تم تمديد الاشتراك +${days} يوم.`);
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const toggleActive = async (cafe) => {
          busy.value = true;
          try {
            await callManageAccounts({
              action: "update_cafe_admin",
              cafe_id: cafe.id,
              active: !cafe.active,
            });
            notify(cafe.active ? "تم إيقاف المقهى." : "تم تفعيل المقهى.");
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const changeOwnerPassword = async () => {
          if (!selectedCafe.value) return;
          busy.value = true;
          try {
            await callManageAccounts({
              action: "set_owner_password",
              cafe_id: selectedCafe.value.id,
              new_password: ownerNewPass.value,
            });
            ownerNewPass.value = "";
            notify("تم تغيير كلمة سر المالك.");
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const promptWorkerPin = async (w) => {
          const pin = window.prompt(`أدخل رمز PIN الجديد للعامل (${w.display_name}) من 4 إلى 8 أرقام:`);
          if (!pin) return;
          busy.value = true;
          try {
            await callManageAccounts({
              action: "set_worker_pin",
              cafe_id: w.cafe_id,
              slot: w.slot,
              pin: pin.trim(),
            });
            notify("تم تحديث رمز PIN للعامل.");
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const promptResetWorker = async (w) => {
          const newName = window.prompt(`تصفير المقعد (${w.slot}) لعامل جديد.\nأدخل اسم العامل الجديد (أو اتركه فارغاً ليكتبه عند الدخول):`, "");
          if (newName === null) return;
          let newPin = "";
          if (w.user_id) {
            const p = window.prompt("أدخل رمز PIN الجديد (4-8 أرقام) أو اتركه فارغاً للإبقاء على الحالي:", "");
            if (p === null) return;
            newPin = p.trim();
          }
          busy.value = true;
          try {
            await callManageAccounts({
              action: "reset_worker_slot",
              cafe_id: w.cafe_id,
              slot: w.slot,
              new_name: newName.trim(),
              new_pin: newPin || undefined,
            });
            notify("تم تصفير المقعد وطرد الجلسة القديمة.");
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const deleteCafe = async (cafe) => {
          const typed = window.prompt(`تحذير: سيُحذف "${cafe.name}" وكل بياناته وحساباته نهائياً.\nللتأكيد اكتب رمز المقهى (${cafe.code}):`);
          if (typed !== cafe.code) {
            if (typed !== null) notify("الرمز غير مطابق، تم إلغاء الحذف.", "err");
            return;
          }
          busy.value = true;
          try {
            await callManageAccounts({ action: "delete_cafe", cafe_id: cafe.id });
            selectedCafe.value = null;
            notify("تم حذف المقهى نهائياً.");
            await refreshAll();
          } catch (e) {
            notify(translateError(e), "err");
          } finally {
            busy.value = false;
          }
        };

        const setFeedbackStatus = async (fb, status) => {
          const { error } = await supabase
            .from("trial_feedback")
            .update({ status })
            .eq("id", fb.id);
          if (error) return notify(translateError(error), "err");
          fb.status = status;
          notify("تم تحديث حالة الملاحظة.");
        };

        onMounted(checkSession);

        return {
          booting, busy, member, serverToday, tab, search,
          cafes, filteredCafes, feedback, errors,
          activeCafesCount, openFeedbackCount, cafeWorkers,
          loginForm, toast, showCreate, createForm, selectedCafe, editForm, ownerNewPass,
          WORK_PATTERNS, FEATURE_LABELS,
          miToTnd, formatDate, statusBadge, daysLabel, cafeNameById, patternNeedsW1Pin,
          login, logout, refreshAll, openCreateModal, createCafe,
          openManageModal, saveCafeChanges, quickExtend, toggleActive,
          changeOwnerPassword, promptWorkerPin, promptResetWorker, deleteCafe, setFeedbackStatus,
        };
      },
    }).mount("#app");
  </script>
</body>
</html>
