<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="theme-color" content="#140e09" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CassaCafe" />
  <title>CassaCafe — إدارة المقهى</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #140e09;
      color: #f5ebd6;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    input, textarea, button { font-family: Tahoma, Arial, sans-serif; min-width: 0; }
    input, textarea { font-size: 16px; }
    button { cursor: pointer; border: none; background: transparent; color: inherit; }
    button:active { opacity: 0.86; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .hidden { display: none !important; }

    /* قفل اتجاه الأرقام من اليسار لليمين مع بقاء مي يسار الرقم */
    .num-ltr {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      display: inline-block !important;
      white-space: nowrap !important;
    }
    input.num-input-ltr {
      direction: ltr !important;
      text-align: center !important;
      font-family: monospace, Tahoma, sans-serif;
      font-weight: 800;
    }
    input.num-input-ltr::placeholder { direction: rtl; unicode-bidi: plaintext; }

    /* التخطيط العام */
    .shell { min-height: 100vh; padding-bottom: 54px; }
    .container { max-width: 640px; margin: 0 auto; padding: 12px; }
    .stack-2 > * + * { margin-top: 8px; }
    .stack-3 > * + * { margin-top: 12px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .col-span-2 { grid-column: span 2; }
    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }
    .min-w-0 { min-width: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-right { text-align: right; }

    /* شاشة الدخول */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at top, #2b1f17 0%, #140e09 70%);
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: #231912;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 24px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    /* الشريط العلوي والتبويبات */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(20, 14, 9, 0.96);
      border-bottom: 1.5px solid rgba(212, 175, 55, 0.35);
      padding: 10px 12px;
    }
    .header-inner { max-width: 640px; margin: 0 auto; }
    .logo-badge {
      width: 40px; height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #f2d374, #d4af37, #8a6a1c);
      color: #140e09;
      font-size: 20px;
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .nav-btn {
      padding: 9px 4px;
      border-radius: 12px;
      border: 1.5px solid #3d2d22;
      background: #231912;
      color: #e8dcc8;
      font-size: 12px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      width: 100%;
    }
    .nav-btn.active {
      background: #d4af37;
      color: #140e09;
      border-color: #f3d474;
    }
    .nav-badge {
      background: #dc2626;
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 1.3;
    }

    /* التبويبات الفرعية */
    .sub-nav {
      background: #0f0a06;
      border: 1.5px solid #3d2d22;
      border-radius: 14px;
      padding: 4px;
    }
    .sub-btn {
      padding: 8px 4px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      color: #cbb89d;
      font-size: 12px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      width: 100%;
    }
    .sub-btn.active {
      background: rgba(212, 175, 55, 0.22);
      border-color: #d4af37;
      color: #f3d474;
    }

    /* البطاقات والصناديق */
    .card {
      background: #2b1f17;
      border: 1.5px solid #4a3728;
      border-radius: 16px;
      padding: 13px;
    }
    .card-dark {
      background: #231912;
      border: 1.5px solid #3d2d22;
      border-radius: 16px;
      padding: 13px;
    }
    .inner-box {
      background: #140e09;
      border: 1px solid #35261c;
      border-radius: 12px;
      padding: 10px 12px;
    }

    /* ألوان النصوص والشارات */
    .c-gold { color: #f0cf6b; }
    .c-muted { color: #cbb89d; }
    .c-dim { color: #a89276; }
    .c-green { color: #34d399; }
    .c-amber { color: #fbbf24; }
    .c-red { color: #fb7185; }
    .c-sky { color: #38bdf8; }
    .c-purple { color: #d8b4fe; }
    .c-white { color: #ffffff; }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .pill-gold { background: rgba(212, 175, 55, 0.22); color: #f3d474; border: 1px solid rgba(212, 175, 55, 0.55); }
    .pill-green { background: #063b27; color: #7bf1a8; border: 1px solid #06d6a0; }
    .pill-amber { background: #3b2308; color: #fde68a; border: 1px solid #f59e0b; }
    .pill-red { background: #470d1b; color: #fecdd3; border: 1px solid #ef4444; }
    .pill-sky { background: #092c47; color: #bae6fd; border: 1px solid #38bdf8; }
    .pill-purple { background: #2e1065; color: #e9d5ff; border: 1px solid #a855f7; }
    .pill-dim { background: #18110c; color: #a89276; border: 1px solid #3d2d22; }

    /* الأزرار */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      min-height: 42px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }
    .btn-sm { padding: 6px 10px; min-height: 32px; font-size: 11.5px; border-radius: 10px; }
    .btn-full { width: 100%; }
    .btn-gold { background: linear-gradient(to left, #e5c158, #b89225); color: #140e09; }
    .btn-green { background: #059669; color: #ffffff; }
    .btn-red { background: #dc2626; color: #ffffff; }
    .btn-red-soft { background: #470d1b; color: #fecdd3; border: 1.5px solid #dc2626; }
    .btn-dark { background: #18110c; color: #e8dcc8; border: 1.5px solid #4a3728; }
    .btn-purple { background: #3b0764; color: #f3e8ff; border: 1.5px solid #a855f7; }

    /* أزرار الاختيار الداكنة (بديل select) */
    .opt-btn {
      width: 100%;
      padding: 9px 7px;
      min-height: 40px;
      border-radius: 11px;
      border: 1.5px solid #4a3728;
      background: #140e09;
      color: #e8dcc8;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }
    .opt-btn.active {
      background: #d4af37;
      border-color: #f3d474;
      color: #140e09;
    }
    .opt-btn.active-green {
      background: #059669;
      border-color: #34d399;
      color: #ffffff;
    }
    .opt-btn.active-purple {
      background: #7c3aed;
      border-color: #c4b5fd;
      color: #ffffff;
    }
    .opt-btn.active-red {
      background: #b91c1c;
      border-color: #f87171;
      color: #ffffff;
    }

    /* المدخلات */
    .field-label { display: block; font-size: 12px; font-weight: 800; color: #e5c158; margin-bottom: 5px; }
    .input {
      width: 100%;
      background: #140e09;
      color: #ffffff;
      border: 1.5px solid #4a3728;
      border-radius: 11px;
      padding: 10px 12px;
      outline: none;
    }
    .input:focus { border-color: #d4af37; }
    .input-big { font-size: 21px !important; border: 2px solid #d4af37; color: #fde68a; }

    /* تنبيهات وبانرات أعلى الشاشة */
    .banner {
      border-radius: 15px;
      padding: 12px 13px;
      border: 2px solid;
    }
    .banner-red { background: #3b0d14; border-color: #ef4444; }
    .banner-amber { background: #331e07; border-color: #f59e0b; }
    .banner-green { background: #062e20; border-color: #10b981; }
    .banner-purple { background: #26103d; border-color: #a855f7; }

    /* بطاقات اليوميات */
    .day-card {
      width: 100%;
      text-align: right;
      border-radius: 15px;
      padding: 12px;
      border: 1.5px solid #3d2d22;
      background: #231912;
      display: block;
    }
    .day-card.pending { border: 2px solid #f59e0b; background: #2d1e10; }
    .day-card.unsettled { border: 1.5px solid rgba(212, 175, 55, 0.65); background: #291d14; }
    .day-card.settled { opacity: 0.85; }

    /* بطاقات مصاريف الكروان الأربع */
    .exp-tile {
      min-height: 78px;
      border-radius: 15px;
      padding: 11px 8px;
      border: 1.5px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }
    .exp-tile.amber { background: linear-gradient(135deg, #3b2308, #140e09); border-color: #f59e0b; }
    .exp-tile.purple { background: linear-gradient(135deg, #2e1065, #140e09); border-color: #a855f7; }
    .exp-tile.sky { background: linear-gradient(135deg, #082f49, #140e09); border-color: #38bdf8; }
    .exp-tile.gold { background: linear-gradient(135deg, #3a2a12, #140e09); border-color: #d4af37; }

    /* بطاقات الكاسة (نفس ألوان مقهى الكروان) */
    .pos-sum-box {
      padding: 8px 5px;
      border-radius: 13px;
      border: 2px solid;
      background: #231912;
      text-align: center;
    }
    .prod-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      min-height: 100px;
      padding: 9px 7px;
      border-radius: 15px;
      border: 2px solid;
      width: 100%;
      color: #ffffff;
    }
    .prod-title { font-size: 14.5px; font-weight: 800; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prod-price { font-size: 12.5px; font-weight: 800; color: #ffd166; margin: 2px 0; }
    .prod-sold-badge {
      width: 100%; padding: 3px 5px; border-radius: 8px;
      background: #042f24; border: 1px solid #06d6a0; color: #9ef8d8;
      font-size: 11.5px; font-weight: 800;
    }
    .prod-footer {
      width: 100%; padding: 3px 5px; border-radius: 9px;
      font-size: 11.5px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .stock-pill-ok { background: #2b2110; border: 1px solid #ffb703; color: #ffea9f; padding: 0 6px; border-radius: 6px; }
    .stock-pill-low { background: #4a2805; border: 1px solid #ffd166; color: #ffffff; padding: 0 6px; border-radius: 6px; }
    .stock-pill-zero { background: #5c0f1f; border: 1px solid #ff8fa3; color: #ffffff; padding: 0 6px; border-radius: 6px; }

    .cat-hot { background: #380e1a; border-color: #ff4d6d; }
    .cat-cold { background: #092c47; border-color: #00b4d8; }
    .cat-food { background: #3d1d05; border-color: #fb8500; }
    .cat-fun { background: #2e0d42; border-color: #c77dff; }
    .prod-registered { background: #053b2c !important; border-color: #06d6a0 !important; }

    /* الجداول داخل النوافذ */
    table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.tbl th { color: #a89276; font-size: 11px; padding-bottom: 6px; border-bottom: 1px solid #3d2d22; }
    table.tbl td { padding: 7px 2px; border-bottom: 1px solid #261b13; }
    table.tbl tr:last-child td { border-bottom: none; }

    /* النوافذ المنبثقة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 6, 4, 0.9);
      z-index: 9000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px;
      overflow-y: auto;
    }
    .modal-box {
      width: 100%;
      max-width: 440px;
      margin: 8px auto 24px;
      background: #2b1f17;
      border: 2px solid #d4af37;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .modal-close {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: #470d1b;
      border: 1.5px solid #ef4444;
      color: #fecdd3;
      font-size: 15px;
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* التوست */
    .toast-box {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10050;
      max-width: 92vw;
      padding: 10px 16px;
      border-radius: 14px;
      border: 2px solid #d4af37;
      background: #231912;
      color: #f5ebd6;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
    }
    .toast-ok { border-color: #10b981; background: #062e20; color: #a7f3d0; }
    .toast-err { border-color: #ef4444; background: #3b0d14; color: #fecdd3; }
    .toast-warn { border-color: #f59e0b; background: #331e07; color: #fde68a; }
  </style>
</head>
<body>

  <!-- 1. شاشة تسجيل دخول المالك -->
  <section id="login-view" class="auth-wrap">
    <div class="auth-card stack-3">
      <div class="text-center stack-2">
        <div style="font-size:32px;">☕</div>
        <h1 class="c-gold" style="font-size:20px;font-weight:900;">CassaCafe — إدارة المقهى</h1>
        <p class="c-muted" style="font-size:12.5px;">دخول صاحب المقهى</p>
      </div>
      <div id="loginErr" class="hidden banner banner-red text-center" style="font-size:12.5px;font-weight:800;color:#fecdd3;"></div>
      <form id="loginForm" class="stack-3" novalidate>
        <div>
          <label for="ownerEmailInput" class="field-label">البريد الإلكتروني</label>
          <input id="ownerEmailInput" type="email" dir="ltr" autocomplete="username" placeholder="owner@gmail.com" class="input" />
        </div>
        <div>
          <label for="ownerPassInput" class="field-label">كلمة السر</label>
          <input id="ownerPassInput" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••" class="input" />
        </div>
        <button id="loginSubmitBtn" type="submit" class="btn btn-gold btn-full">دخول للإدارة</button>
      </form>
      <button type="button" onclick="handleForgotPassword()" class="btn btn-dark btn-sm btn-full">🔑 نسيت كلمة السر؟ إرسال رابط التغيير</button>
    </div>
  </section>

  <!-- 2. شاشة الإيقاف / عدم الصلاحية -->
  <section id="blocked-view" class="auth-wrap hidden">
    <div class="auth-card text-center stack-3">
      <div style="font-size:32px;">⛔</div>
      <h2 class="c-red" style="font-size:17px;font-weight:900;">تعذّر فتح الحساب</h2>
      <p id="blockedMsg" class="c-muted" style="font-size:13px;line-height:1.6;"></p>
      <button type="button" onclick="logoutOwner()" class="btn btn-dark btn-full">تسجيل الخروج</button>
    </div>
  </section>

  <!-- 3. التطبيق الرئيسي + النوافذ -->
  <div id="app-root" class="shell hidden"></div>
  <div id="modals-root"></div>
  <div id="toast-root" class="toast-box hidden"></div>

  <!-- Firebase Compat SDK v10.12.2 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    if (!Array.prototype.find) {
      Array.prototype.find = function(pred) {
        for (var i = 0; i < this.length; i++) { if (pred(this[i], i, this)) return this[i]; }
        return undefined;
      };
    }

    var firebaseConfig = {
      apiKey: "AIzaSyC49QHKlszAR2objtwOGo9g5vEz8AY2AJQ",
      authDomain: "cassacafe-12a0a.firebaseapp.com",

      projectId: "cassacafe-12a0a",
      storageBucket: "cassacafe-12a0a.firebasestorage.app",
      messagingSenderId: "986243350617",
      appId: "1:986243350617:web:b8a31aa0c0095aba953148"
    };

    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.database();

    var PATTERN_INFO = {
      owner_only:        { label: '👤 مالك وحده',                  hasPos: true,  hasTeam: false, isAssisted: false, twoWorkers: false },
      owner_with_worker: { label: '🤝 مالك + عامل معاً',           hasPos: true,  hasTeam: false, isAssisted: true,  twoWorkers: false },
      worker_only:       { label: '👷 عامل وحده',                  hasPos: true,  hasTeam: true,  isAssisted: false, twoWorkers: false },
      worker_owner:      { label: '☀️🌙 عامل صباحاً + مالك مساءً', hasPos: true,  hasTeam: true,  isAssisted: false, twoWorkers: false },
      two_workers:       { label: '👷👷 عامل صباحاً + عامل مساءً', hasPos: true,  hasTeam: true,  isAssisted: false, twoWorkers: true }
    };

    var DEFAULT_CONSUMABLES = ['ماء إمصفي', 'مواد تنظيف', 'سكر', 'حليب', 'شكولين', 'زهر', 'كؤوس بلورية'];
    var AR_MONTHS = ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان', 'جويلية', 'أوت', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

    // ===== أدوات التاريخ والأرقام =====
    function pad2(n) { var s = String(n); return s.length < 2 ? '0' + s : s; }
    function getTodayDateStr(ts) {
      var d = ts ? new Date(ts) : new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function getCurrentTimeHHMM(ts) {
      var d = ts ? new Date(ts) : new Date();
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function getCurrentMonthKey() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    }
    function shiftMonthKey(mk, delta) {
      var p = String(mk || getCurrentMonthKey()).split('-').map(Number);
      var d = new Date(Date.UTC(p[0], (p[1] - 1) + delta, 1));
      return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1);
    }
    function formatArabicMonth(mk) {
      var p = String(mk || '').split('-').map(Number);
      if (p.length !== 2 || isNaN(p[0]) || isNaN(p[1])) return String(mk || '');
      return (AR_MONTHS[p[1] - 1] || p[1]) + ' ' + p[0];
    }
    function addMonthsToIsoDate(isoStr, months) {
      var p = String(isoStr || '').trim().split('-').map(Number);
      if (p.length !== 3 || isNaN(p[0]) || isNaN(p[1]) || isNaN(p[2])) return isoStr;
      var mCount = parseInt(months, 10) || 3;
      var totalM = (p[1] - 1) + mCount;
      var targetY = p[0] + Math.floor(totalM / 12);
      var targetM = ((totalM % 12) + 12) % 12;
      var maxDay = new Date(Date.UTC(targetY, targetM + 1, 0)).getUTCDate();
      var finalD = Math.min(p[2], maxDay);
      return targetY + '-' + pad2(targetM + 1) + '-' + pad2(finalD);
    }
    function diffDaysIsoDates(fromIso, toIso) {
      var a = String(fromIso || '').trim().split('-').map(Number);
      var b = String(toIso || '').trim().split('-').map(Number);
      if (a.length !== 3 || b.length !== 3) return null;
      var tA = Date.UTC(a[0], a[1] - 1, a[2]);
      var tB = Date.UTC(b[0], b[1] - 1, b[2]);
      if (isNaN(tA) || isNaN(tB)) return null;
      return Math.round((tB - tA) / 86400000);
    }
    function parseSignedNum(v) {
      if (v === null || v === undefined || v === '') return 0;
      if (typeof v === 'number') return isFinite(v) ? Math.round(v) : 0;
      var clean = String(v)
        .replace(/[\u200E\u200F\u00A0]/g, '')
        .replace(/[٠-٩]/g, function(d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
        .replace(/[\u2212\u2013\u2014]/g, '-')
        .split('.')[0].replace(/[^\d-]/g, '');
      var isNeg = clean.indexOf('-') !== -1;
      var digits = clean.replace(/[^\d]/g, '');
      var n = parseInt(digits, 10) || 0;
      return n === 0 ? 0 : (isNeg ? -n : n);
    }
    function parseNum(v) { var n = parseSignedNum(v); return n > 0 ? n : 0; }
    function fmtPlain(v) {
      var n = parseSignedNum(v);
      return (n < 0 ? '-' : '') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
    }
    function fmt(v) { return '<span class="num-ltr" dir="ltr">' + fmtPlain(v) + '</span>'; }
    function fmtMi(v) { return fmt(v) + ' مي'; }
    function fmtInputVal(v, allowNeg) {
      var n = allowNeg ? parseSignedNum(v) : parseNum(v);
      if (n === 0) return '0';
      return (n < 0 ? '-' : '') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }
    function formatInputWithSpaces(el, allowNeg) {
      if (!el) return;
      var str = String(el.value || '').replace(/[٠-٩]/g, function(d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
      var isNeg = allowNeg && str.trim().indexOf('-') === 0;
      var raw = str.replace(/[^\d]/g, '');
      if (!raw) { el.value = isNeg ? '-' : ''; return; }
      raw = raw.replace(/^0+(?=\d)/, '');
      if (raw.length > 9) raw = raw.slice(0, 9);
      el.value = (isNeg ? '-' : '') + raw.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }
    function toggleSignInput(inputId, previewFinalNet) {
      var el = document.getElementById(inputId);
      if (!el) return;

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(s) {
      return String(s == null ? '' : s)
        .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/[\r\n<>]/g, '');
    }
    function formatMixed(str) {
      var s = String(str == null ? '' : str);
      if (!/[A-Za-z0-9]/.test(s)) return escapeHtml(s);
      var re = /\d{4}-\d{2}-\d{2}|[+\-]?\d+(?:[.,:/\-]\d+)*|[A-Za-z]+/g;
      var out = '', last = 0, m;
      while ((m = re.exec(s)) !== null) {
        if (m.index > last) out += escapeHtml(s.slice(last, m.index));
        out += '<span class="num-ltr" dir="ltr">' + escapeHtml(m[0]) + '</span>';
        last = m.index + m[0].length;
      }
      if (last < s.length) out += escapeHtml(s.slice(last));
      return out;
    }
    function safeLtr(s) { return '<span class="num-ltr" dir="ltr">' + escapeHtml(s) + '</span>'; }

        'auth/network-request-failed': 'تحقّق من الاتصال بالإنترنت.'
      };
      return (err && map[err.code]) || (err && err.message) || 'حدث خطأ غير متوقع.';

    // ===== تحديث المخزون الذري (Transaction) =====
    function applyStockDeltasAtomic(deltas) {
      var keys = Object.keys(deltas || {});
      var promises = [];
      for (var i = 0; i < keys.length; i++) {
        (function(itemId) {
          var delta = Number(deltas[itemId]) || 0;
          if (!itemId || delta === 0 || !state.stockObj[itemId]) return;
          var ref = db.ref('tenants/' + state.cafeId + '/live/stock_state/stock/' + itemId + '/qty');
          promises.push(ref.transaction(function(curr) {
            return Math.round((Number(curr) || 0) + delta);
          }));
        })(keys[i]);
      }
      if (!promises.length) return Promise.resolve();
      return Promise.all(promises).then(function() {
        return db.ref('tenants/' + state.cafeId + '/live/stock_state/updatedAt').set(Date.now()).catch(function() {});
      });
    }

    function isBeinExpenseName(name) {

    }
    function _beinRank(st) { return st === 'd10' ? 1 : (st === 'd5' ? 2 : (st === 'd1' ? 3 : (st === 'expired' ? 4 : 0))); }
    function formatBeinDuration(m) {
      var n = parseInt(m, 10) || 3;
      return n === 1 ? 'شهر' : (n === 3 ? '3 أشهر' : (n === 6 ? '6 أشهر' : (n === 12 ? 'سنة' : (n + ' أشهر'))));
    }
    function formatBeinDaysLeft(d) {
      if (d < 0) {
        var a = Math.abs(d);
        return a === 1 ? 'منتهٍ منذ يوم' : (a === 2 ? 'منتهٍ منذ يومين' : ('منتهٍ منذ ' + a + ' يوم'));
      }
      if (d === 0) return 'ينتهي اليوم!';
      if (d === 1) return 'ينتهي غداً (باقي يوم)';
      if (d === 2) return 'متبقي يومان';
      if (d <= 10) return 'متبقي ' + d + ' أيام';
      return 'متبقي ' + d + ' يوماً';
    }
    function getBeinStatus() {
      var rem = state.beinReminder;
      if (!rem || !rem.expiryDate) return { hasRecord: false, shouldShow: false, stage: 'none', daysLeft: null, rem: null };
      var daysLeft = diffDaysIsoDates(getTodayDateStr(), rem.expiryDate);
      if (daysLeft === null) return { hasRecord: false, shouldShow: false, stage: 'none', daysLeft: null, rem: rem };

      var stage = 'none';
      if (daysLeft <= 0) stage = 'expired';
      else if (daysLeft === 1) stage = 'd1';
      else if (daysLeft <= 5) stage = 'd5';
      else if (daysLeft <= 10) stage = 'd10';

      var canDismiss = (stage === 'd10' || stage === 'd5' || stage === 'd1');
      var shouldShow = (stage === 'expired') || (_beinRank(stage) > 0 && _beinRank(rem.dismissedStage || '') < _beinRank(stage));
      var disLbl = stage === 'd10' ? 'تجاهل (ذكّرني قبل 5 أيام)' : (stage === 'd5' ? 'تجاهل (ذكّرني قبل يوم)' : 'تجاهل اليوم');

      return {
        hasRecord: true, shouldShow: shouldShow, stage: stage, daysLeft: daysLeft,
        daysText: formatBeinDaysLeft(daysLeft), canDismiss: canDismiss, dismissLabel: disLbl, rem: rem
      };
    }

    function saveBeinReminder(paidDate, months, amount, showMsg) {
      if (isReadOnly()) return showToast('الاشتراك منتهٍ حالياً.', 'err');
      var pDate = paidDate || getTodayDateStr();
      var m = parseInt(months, 10) || 3;
      var exp = addMonthsToIsoDate(pDate, m);
      var rec = { paidDate: pDate, durationMonths: m, expiryDate: exp, amount: parseNum(amount), dismissedStage: '', updatedAt: Date.now() };
      return db.ref('tenants/' + state.cafeId + '/live/reminders/bein').set(rec).then(function() {
        if (showMsg) showToast('✅ تم ضبط تذكير بين سبورت حتى ' + exp, 'ok');
      }).catch(function(err) { showToast('تعذّر حفظ التذكير: ' + err.message, 'err'); });
    }
    function dismissBeinStage() {
      var st = getBeinStatus();
      if (!st.hasRecord || !st.canDismiss || isReadOnly()) return;
      db.ref('tenants/' + state.cafeId + '/live/reminders/bein').update({
        dismissedStage: st.stage, updatedAt: Date.now()
      }).then(function() {
        var msg = st.stage === 'd10' ? '🔕 سأذكّرك مجدداً قبل 5 أيام.' : (st.stage === 'd5' ? '🔕 سأذكّرك مجدداً قبل يوم واحد.' : '🔕 سأذكّرك يوم الانتهاء.');
        showToast(msg, 'ok');
      });
    }
    function confirmClearBein() {
      closeModalById('cc-fixed-modal');
      showConfirm('🗑️ مسح تذكير بين سبورت', 'هل تريد إلغاء تذكير اشتراك بين سبورت؟ (لن تتأثر المصاريف المسجّلة).', 'نعم، مسح التذكير', function() {
        db.ref('tenants/' + state.cafeId + '/live/reminders/bein').set(null).then(function() {
          showToast('✅ تم مسح تذكير بين سبورت.', 'ok');
        });
      });
    }

    // ===== الحسابات المالية والتسويات الشهرية الموحدة =====
    function computeMonthData() {
      var wi = getWorkersConfig();
      var days = Object.keys(state.subDays || {}).map(function(id) {
        var raw = state.subDays[id] || {};
        var dec = state.dayDecs[id] || null;
        var status = dec ? dec.status : (raw.ownerShift ? 'approved' : 'pending');
        var slot = raw.ownerShift ? 'owner' : (raw.workerSlot === 'w2' ? 'w2' : 'w1');
        var defWage = slot === 'owner' ? 0 : (slot === 'w2' ? wi.w2.defaultWage : wi.w1.defaultWage);
        var wage = 0;
        if (raw.ownerShift) {
          // في نمط مالك + عامل، نحسب أجور العمال الحاضرين (المدفوعة أو المرحّلة)
          var wsObj = raw.workerWages || {};
          Object.keys(wsObj).forEach(function(wk) {
            var item = wsObj[wk];
            if (item && (item.status === 'paid_cash' || item.status === 'deferred')) {
              wage += parseNum(item.amount);
            }
          });
        } else {
          wage = (dec && dec.dailyWage != null) ? parseNum(dec.dailyWage) : (raw.expectedWage != null ? parseNum(raw.expectedWage) : defWage);
        }
        return {
          id: id, raw: raw, dec: dec, status: status,
          date: raw.date || '', shift: raw.shift || (raw.ownerShift ? 'evening' : 'full'),
          ownerShift: Boolean(raw.ownerShift),
          workerSlot: slot,
          workerName: raw.ownerShift ? getOwnerName() : (raw.workerName || (slot === 'w2' ? wi.w2.name : wi.w1.name)),
          sales: parseNum(raw.sales),
          expensesTotal: parseNum(raw.expensesTotal),
          wage: wage,
          settled: Boolean(raw.ownerShift || (dec && dec.settled)),
          createdAt: parseNum(raw.createdAt)
        };
      }).sort(function(a, b) { return String(b.date).localeCompare(String(a.date)) || (b.createdAt - a.createdAt); });

      var invoices = Object.keys(state.subInvoices || {}).map(function(id) {
        var raw = state.subInvoices[id] || {};
        var dec = state.invDecs[id] || null;
        var slot = raw.workerSlot === 'w2' ? 'w2' : 'w1';
        return {
          id: id, raw: raw, dec: dec,
          status: dec ? dec.status : 'pending',
          invoiceNumber: raw.invoiceNumber || '—',
          date: raw.date || '',
          paymentSource: raw.paymentSource || 'worker_cash',
          workerSlot: slot,
          workerName: raw.workerName || (slot === 'w2' ? wi.w2.name : wi.w1.name),
          totalAmount: parseNum(raw.totalAmount),
          items: Array.isArray(raw.items) ? raw.items : [],
          settled: Boolean(dec && dec.settled),
          createdAt: parseNum(raw.createdAt)
        };
      }).sort(function(a, b) { return b.createdAt - a.createdAt; });

      var purchases = Object.keys(state.purchases || {}).map(function(id) {
        var p = state.purchases[id];
        return (p && !p.deleted) ? Object.assign({ id: id }, p) : null;
      }).filter(Boolean).sort(function(a, b) { return parseNum(b.ts) - parseNum(a.ts); });

      var settlements = Object.keys(state.settlements || {}).map(function(id) {
        var s = state.settlements[id];
        return (s && !s.undone) ? Object.assign({ id: id }, s) : null;
      }).filter(Boolean).sort(function(a, b) { return parseNum(b.timestamp) - parseNum(a.timestamp); });

      var payouts = Object.keys(state.wagePayouts || {}).map(function(id) {
        var p = state.wagePayouts[id];
        return (p && !p.undone) ? Object.assign({ id: id }, p) : null;
      }).filter(Boolean).sort(function(a, b) { return parseNum(b.timestamp) - parseNum(a.timestamp); });

      // إجماليات الشهر
      var totalRev = 0, totalCaisseExp = 0, totalWages = 0, approvedDaysCnt = 0, pendingDaysCnt = 0;
      days.forEach(function(d) {
        if (d.status === 'pending') pendingDaysCnt++;
        if (d.status === 'approved') {
          approvedDaysCnt++;
          totalRev += d.sales;
          totalCaisseExp += d.expensesTotal;
          totalWages += d.wage;
        }
      });

      var approvedInvSum = 0, pendingInvCnt = 0;
      invoices.forEach(function(inv) {
        if (inv.status === 'pending') pendingInvCnt++;
        if (inv.status === 'approved') approvedInvSum += inv.totalAmount;
      });

      var consSum = 0, fixedSum = 0, maintSum = 0, stockPurSum = 0;
      purchases.forEach(function(p) {
        var a = parseNum(p.amount);
        if (p.type === 'consumable') consSum += a;
        else if (p.type === 'fixed') fixedSum += a;
        else if (p.type === 'maint') maintSum += a;
        else stockPurSum += a;
      });
      var waterBill = parseNum(state.bills && state.bills.waterBill);
      var elecBill = parseNum(state.bills && state.bills.elecBill);
      var adminExpTotal = consSum + fixedSum + maintSum + stockPurSum + waterBill + elecBill;
      var totalOut = totalCaisseExp + totalWages + approvedInvSum + adminExpTotal;
      var netProfit = totalRev - totalOut;

      // حساب التسوية لكل عامل (w1 و w2)
      function calcWorkerSettlement(slot) {
        var uDays = days.filter(function(d) { return !d.ownerShift && d.workerSlot === slot && d.status === 'approved' && !d.settled; });
        var pRev = 0, pExp = 0, pWage = 0;
        uDays.forEach(function(d) { pRev += d.sales; pExp += d.expensesTotal; pWage += d.wage; });
        var pNet = pRev - (pExp + pWage);

        var uInvs = invoices.filter(function(inv) {
          return inv.workerSlot === slot && inv.status === 'approved' && !inv.settled && inv.paymentSource === 'worker_cash';
        });
        var invPaid = 0;
        uInvs.forEach(function(inv) { invPaid += inv.totalAmount; });

        var uPurs = purchases.filter(function(p) {
          var isSlot = (p.payer === slot) || (slot === 'w1' && p.payer === 'worker');
          return isSlot && !p.settled;
        });
        var purPaid = 0;
        uPurs.forEach(function(p) { purPaid += parseNum(p.amount); });

        var slotStls = settlements.filter(function(s) { return (s.workerSlot || 'w1') === slot; });
        var prevCarry = (slotStls.length > 0 && !slotStls[0].carryoverSettled) ? parseSignedNum(slotStls[0].leftWithWorker) : 0;
        var finalNet = Math.round(pNet + prevCarry - invPaid - purPaid);

        return {
          slot: slot, unsettledDays: uDays, unsettledInvs: uInvs, unsettledPurs: uPurs,
          daysCount: uDays.length, periodRev: pRev, periodExp: pExp, periodWages: pWage,
          periodNet: pNet, workerPaidTotal: invPaid + purPaid, prevCarryover: prevCarry,
          finalNet: finalNet, history: slotStls
        };
      }

      // حساب الأجور المرحّلة في نمط (مالك + عامل معاً)
      function calcAssistedWages(slot) {
        var paidCashSum = 0, deferredSum = 0, workDays = 0, absentDays = 0;
        days.forEach(function(d) {
          if (d.status !== 'approved' || !d.ownerShift || !d.raw.workerWages) return;
          var info = d.raw.workerWages[slot];
          if (!info) return;
          if (info.status === 'paid_cash') { paidCashSum += parseNum(info.amount); workDays++; }
          else if (info.status === 'deferred') { deferredSum += parseNum(info.amount); workDays++; }
          else if (info.status === 'absent') { absentDays++; }
        });
        var slotPayouts = payouts.filter(function(p) { return (p.workerSlot || 'w1') === slot; });
        var paidOut = 0;
        slotPayouts.forEach(function(p) { paidOut += parseNum(p.amount); });
        return {
          slot: slot, workDays: workDays, absentDays: absentDays,
          paidCashSum: paidCashSum, deferredSum: deferredSum,
          paidOut: paidOut, owed: Math.round(deferredSum - paidOut),
          payouts: slotPayouts
        };
      }

      return {
        days: days, invoices: invoices, purchases: purchases, settlements: settlements, payouts: payouts,
        approvedDaysCnt: approvedDaysCnt, pendingDaysCnt: pendingDaysCnt, pendingInvCnt: pendingInvCnt,
        totalRev: totalRev, totalCaisseExp: totalCaisseExp, totalWages: totalWages,
        approvedInvSum: approvedInvSum, consSum: consSum, fixedSum: fixedSum, maintSum: maintSum,
        stockPurSum: stockPurSum, waterBill: waterBill, elecBill: elecBill,
        adminExpTotal: adminExpTotal, totalOut: totalOut, netProfit: netProfit,
        settleBySlot: { w1: calcWorkerSettlement('w1'), w2: calcWorkerSettlement('w2') },
        assistedBySlot: { w1: calcAssistedWages('w1'), w2: calcAssistedWages('w2') }
      };
    }

    function openProfitDetailModal() {

        '<div class="modal-box stack-3 text-right">' +

            '<h3 class="c-gold" style="font-size:15px;font-weight:900;">✨ تفصيل حساب شهر ' + formatMixed(formatArabicMonth(state.activeMonth)) + '</h3>' +
            '<button type="button" onclick="closeModalById(\'cc-profit-modal\')" class="modal-close">✕</button>' +
          '</div>' +
          '<div class="inner-box stack-2" style="font-size:12.5px;">' +
            '<div class="row-between"><span class="c-muted">إجمالي المبيعات المعتمدة:</span><strong class="c-green">' + fmtMi(data.totalRev) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">مصاريف الكاسة اليومية:</span><strong class="c-amber">' + fmtMi(-data.totalCaisseExp) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">أجور العمال:</span><strong class="c-amber">' + fmtMi(-data.totalWages) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">فواتير المخزن المعتمدة:</span><strong class="c-red">' + fmtMi(-data.approvedInvSum) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">استهلاكية ومشتريات الإدارة:</span><strong class="c-red">' + fmtMi(-(data.consSum + data.stockPurSum)) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">الكراء والاشتراكات والماء/كهرباء:</span><strong class="c-red">' + fmtMi(-(data.fixedSum + data.waterBill + data.elecBill)) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">الصيانة والمعدات:</span><strong class="c-red">' + fmtMi(-data.maintSum) + '</strong></div>' +
            '<div class="row-between" style="border-top:1px dashed #d4af37;padding-top:8px;font-size:14.5px;">' +
              '<strong class="c-gold">الصافي النهائي للشهر:</strong>' +

          '<button type="button" onclick="closeModalById(\'cc-profit-modal\')" class="btn btn-dark btn-full">إغلاق</button>' +

    // ===== تبويب اليوميات =====
    function renderDaysTab(data) {
      var openDays = data.days.filter(function(d) { return d.status === 'pending' || (d.status === 'approved' && !d.settled); });
      var list = state.daysFilter === 'all' ? data.days : openDays;

      var filterBar =
        '<div class="grid-2">' +
          '<button type="button" onclick="setDaysFilter(\'open\')" class="opt-btn' + (state.daysFilter === 'open' ? ' active' : '') + '">⏳ معلّقة / غير محاسبة (' + fmt(openDays.length) + ')</button>' +
          '<button type="button" onclick="setDaysFilter(\'all\')" class="opt-btn' + (state.daysFilter === 'all' ? ' active' : '') + '">📅 كل يوميات الشهر (' + fmt(data.days.length) + ')</button>' +
        '</div>';

      if (!list.length) {
        return '<div class="stack-2">' + filterBar +
          '<div class="card-dark text-center stack-2" style="padding:24px;">' +
            '<div style="font-size:28px;">' + (data.days.length ? '✅' : '📭') + '</div>' +
            '<div class="c-gold" style="font-size:13.5px;font-weight:800;">' + (data.days.length ? 'كل اليوميات معتمدة ومحاسبة حتى الآن.' : 'لا توجد يوميات مسجلة في هذا الشهر بعد.') + '</div>' +
            (data.days.length ? '<button type="button" onclick="setDaysFilter(\'all\')" class="btn btn-dark btn-sm">عرض كل اليوميات (' + fmt(data.days.length) + ')</button>' : '') +
          '</div>' +
        '</div>';
      }

      var cards = list.map(function(d) {
        var net = d.sales - d.expensesTotal - d.wage;
        var cls = d.status === 'pending' ? 'pending' : (!d.settled && d.status === 'approved' ? 'unsettled' : 'settled');
        var stPill = d.status === 'pending'
          ? '<span class="pill pill-amber">⏳ بانتظار الاعتماد</span>'
          : (d.status === 'rejected'
              ? '<span class="pill pill-red">❌ مرفوضة</span>'
              : (d.settled ? '<span class="pill pill-dim">✓ محاسبة</span>' : '<span class="pill pill-green">✓ معتمدة</span>'));
        var whoPill = d.ownerShift
          ? '<span class="pill pill-sky">👑 ' + escapeHtml(d.workerName) + '</span>'
          : '<span class="pill pill-purple">👷 ' + escapeHtml(d.workerName) + '</span>';

        return '<button type="button" onclick="openDayModal(\'' + escapeAttr(d.id) + '\')" class="day-card ' + cls + '">' +
          '<div class="row-between" style="margin-bottom:8px;">' +
            '<div class="row-wrap">' +
              '<strong class="c-gold" style="font-size:14.5px;">' + safeLtr(d.date) + '</strong>' +
              '<span class="pill pill-dim">' + getShiftLabel(d.shift) + '</span>' +
              whoPill + stPill +
            '</div>' +
            '<strong class="' + (net >= 0 ? 'c-green' : 'c-red') + '" style="font-size:14.5px;">' + fmtMi(net) + '</strong>' +
          '</div>' +
          '<div class="grid-3 inner-box text-center" style="font-size:11.5px;padding:7px 4px;">' +
            '<div><span class="c-dim">البيع: </span><strong class="c-green">' + fmt(d.sales) + '</strong></div>' +
            '<div><span class="c-dim">الكاسة: </span><strong class="c-amber">' + fmt(d.expensesTotal) + '</strong></div>' +
            '<div><span class="c-dim">الأجر: </span><strong class="c-white">' + fmt(d.wage) + '</strong></div>' +
          '</div>' +
        '</button>';
      }).join('');

      return '<div class="stack-2">' + filterBar + cards + '</div>';
    }

    function openDayModal(dayId) {
      var data = computeMonthData();
      var d = data.days.find(function(x) { return x.id === dayId; });
      if (!d) return;

      var itemsSold = Array.isArray(d.raw.itemsSold) ? d.raw.itemsSold : [];
      var salesRows = itemsSold.length
        ? itemsSold.map(function(s) {
            return '<tr><td><strong>' + formatMixed(s.name) + '</strong></td><td class="text-center c-amber"><strong>' + fmt(s.qty) + ' ' + escapeHtml(s.unit || '') + '</strong></td><td class="text-left c-green"><strong>' + fmt(s.lineTotal) + '</strong></td></tr>';
          }).join('')
        : '<tr><td colspan="3" class="text-center c-dim">لا توجد تفاصيل مبيعات</td></tr>';

      var exps = Array.isArray(d.raw.expenses) ? d.raw.expenses : [];
      var expHtml = exps.length
        ? exps.map(function(e) {
            return '<div class="row-between inner-box" style="font-size:12px;"><span>' + formatMixed(e.label || 'مصروف') + '</span><strong class="c-amber">' + fmtMi(e.amount) + '</strong></div>';
          }).join('')
        : '<div class="text-center c-dim" style="font-size:12px;">لا توجد مصاريف كاسة مسجلة</div>';

      var usage = Array.isArray(d.raw.stockUsage) ? d.raw.stockUsage : [];
      var usageHtml = usage.length
        ? '<div class="inner-box stack-2"><div class="c-gold" style="font-size:12px;font-weight:800;">📦 استهلاك المخزون:</div>' +
            usage.map(function(u) {
              return '<div class="row-between" style="font-size:12px;"><span>' + formatMixed(u.name) + '</span><strong class="c-sky">-' + formatStockQty(u.qty, u.unit) + '</strong></div>';
            }).join('') +
          '</div>'
        : '';

      // تفاصيل أجور العمال في نمط مالك + عامل
      var assistedHtml = '';
      if (d.ownerShift && d.raw.workerWages) {
        var wKeys = Object.keys(d.raw.workerWages);
        if (wKeys.length) {
          assistedHtml = '<div class="inner-box stack-2"><div class="c-gold" style="font-size:12px;font-weight:800;">👷 أجور العمال في هذه الوردية:</div>' +
            wKeys.map(function(k) {
              var info = d.raw.workerWages[k];
              var stTxt = info.status === 'paid_cash' ? 'دُفع من الكاسة' : (info.status === 'deferred' ? 'مُرحّل لحسابه' : 'غائب');
              return '<div class="row-between" style="font-size:12px;"><span>' + escapeHtml(info.name || k) + ' (' + stTxt + ')</span><strong class="c-amber">' + fmtMi(info.amount) + '</strong></div>';
            }).join('') +
          '</div>';
        }
      }

      var actionArea = '';
      if (d.status === 'pending' && !isReadOnly()) {
        actionArea =
          '<div class="inner-box stack-2" style="border-color:#d4af37;">' +
            '<label for="approveDayWage" class="field-label">أجر العامل لهذه الوردية بالمليم (قابل للتعديل لنصف يوم):</label>' +
            '<input id="approveDayWage" type="tel" inputmode="numeric" value="' + escapeAttr(fmtInputVal(d.wage)) + '" oninput="formatInputWithSpaces(this)" class="input num-input-ltr" />' +
            '<div class="grid-2">' +
              '<button type="button" onclick="approveWorkerDay(\'' + escapeAttr(d.id) + '\')" class="btn btn-green btn-full">✅ اعتماد وخصم المخزون</button>' +
              '<button type="button" onclick="rejectWorkerDay(\'' + escapeAttr(d.id) + '\')" class="btn btn-red-soft btn-full">❌ رفض</button>' +
            '</div>' +
          '</div>';
      } else if (d.status === 'approved' && !d.settled && !d.ownerShift && !isReadOnly()) {
        actionArea = '<button type="button" onclick="cancelApprovedDay(\'' + escapeAttr(d.id) + '\')" class="btn btn-red-soft btn-full">↩️ إلغاء الاعتماد وإرجاع المخزون</button>';
      }

      var net = d.sales - d.expensesTotal - d.wage;
      var html =
        '<div class="modal-box stack-3 text-right">' +
          '<div class="row-between">' +
            '<div><h3 class="c-gold" style="font-size:15px;font-weight:900;">📅 يومية ' + safeLtr(d.date) + ' — ' + getShiftLabel(d.shift) + '</h3>' +
            '<div class="c-muted" style="font-size:11.5px;">' + escapeHtml(d.workerName) + '</div></div>' +
            '<button type="button" onclick="closeModalById(\'cc-day-modal\')" class="modal-close">✕</button>' +
          '</div>' +
          '<div class="grid-2 text-center" style="font-size:12px;">' +
            '<div class="inner-box"><div class="c-dim">المبيعات</div><strong class="c-green" style="font-size:15px;">' + fmtMi(d.sales) + '</strong></div>' +
            '<div class="inner-box"><div class="c-dim">الصافي</div><strong class="' + (net >= 0 ? 'c-green' : 'c-red') + '" style="font-size:15px;">' + fmtMi(net) + '</strong></div>' +
            '<div class="inner-box"><div class="c-dim">مصاريف الكاسة</div><strong class="c-amber">' + fmtMi(d.expensesTotal) + '</strong></div>' +
            '<div class="inner-box"><div class="c-dim">الأجر</div><strong class="c-white">' + fmtMi(d.wage) + '</strong></div>' +
          '</div>' +
          '<div class="inner-box">' +
            '<div class="c-gold" style="font-size:12px;font-weight:800;margin-bottom:6px;">☕ تفصيل المبيعات (' + fmt(itemsSold.length) + ')</div>' +
            '<table class="tbl"><thead><tr><th class="text-right">السلعة</th><th class="text-center">الكمية</th><th class="text-left">المجموع</th></tr></thead><tbody>' + salesRows + '</tbody></table>' +
          '</div>' +
          '<div class="stack-2"><div class="c-gold" style="font-size:12px;font-weight:800;">💸 مصاريف الكاسة</div>' + expHtml + '</div>' +
          usageHtml + assistedHtml + actionArea +
          '<button type="button" onclick="closeModalById(\'cc-day-modal\')" class="btn btn-dark btn-full">إغلاق</button>' +
        '</div>';

      openModalHtml('cc-day-modal', html);
    }

    function approveWorkerDay(dayId) {
      if (state.busy || isReadOnly()) return;
      var raw = state.subDays[dayId];
      if (!raw) return;
      var wageVal = parseNum((document.getElementById('approveDayWage') || {}).value);
      state.busy = true;

      var deltas = {};
      (Array.isArray(raw.stockUsage) ? raw.stockUsage : []).forEach(function(u) {
        if (u && u.itemId && Number(u.qty) > 0) deltas[u.itemId] = (deltas[u.itemId] || 0) - Number(u.qty);
      });

      applyStockDeltasAtomic(deltas).then(function() {
        return db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/day_decisions/' + dayId).set({
          status: 'approved',
          dailyWage: wageVal,
          settled: false,
          stockApplied: true,
          approvedAt: Date.now(),
          approvedBy: state.user.uid
        });
      }).then(function() {
        state.busy = false;
        closeModalById('cc-day-modal');
        showToast('✅ تم اعتماد اليومية وخصم المخزون بنجاح.', 'ok');
      }).catch(function(err) {
        state.busy = false;
        showToast('فشل الاعتماد: ' + err.message, 'err');
      });
    }

    function rejectWorkerDay(dayId) {
      if (state.busy || isReadOnly()) return;
      showConfirm('❌ رفض اليومية', 'سيتم رفض هذه اليومية دون خصم أي مخزون ودون إدخالها في الحسابات.', 'تأكيد الرفض', function() {
        db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/day_decisions/' + dayId).set({
          status: 'rejected', settled: false, stockApplied: false, rejectedAt: Date.now()
        }).then(function() {
          closeModalById('cc-day-modal');
          showToast('تم رفض اليومية.', 'warn');
        });
      });
    }

    function cancelApprovedDay(dayId) {
      if (state.busy || isReadOnly()) return;
      var raw = state.subDays[dayId];
      var dec = state.dayDecs[dayId];
      if (!raw || !dec || dec.settled) return;
      showConfirm('↩️ إلغاء اعتماد اليومية', 'سيتم إلغاء اليومية وإرجاع الكميات المخصومة إلى المخزون تلقائياً.', 'نعم، إلغاء وإرجاع', function() {
        state.busy = true;
        var deltas = {};
        if (dec.stockApplied) {
          (Array.isArray(raw.stockUsage) ? raw.stockUsage : []).forEach(function(u) {
            if (u && u.itemId && Number(u.qty) > 0) deltas[u.itemId] = (deltas[u.itemId] || 0) + Number(u.qty);
          });
        }
        applyStockDeltasAtomic(deltas).then(function() {
          return db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/day_decisions/' + dayId).set({
            status: 'rejected', settled: false, stockApplied: false, cancelledAt: Date.now()
          });
        }).then(function() {
          state.busy = false;
          closeModalById('cc-day-modal');
          showToast('✅ تم إلغاء اليومية وإرجاع المخزون.', 'ok');
        }).catch(function(err) {
          state.busy = false;
          showToast('خطأ: ' + err.message, 'err');
        });
      });
    }

    // ===== تبويب التسوية (للفريق) أو الأجور (لمالك + عامل) =====
    function renderSettlementOrWagesTab(data) {
      var patMeta = getPatternMeta();
      var wi = getWorkersConfig();

      if (getWorkPattern() === 'owner_only') {
        return '<div class="card-dark text-center stack-2" style="padding:26px;">' +
          '<div style="font-size:28px;">👤</div>' +
          '<div class="c-gold" style="font-size:14px;font-weight:900;">وضع المالك وحده</div>' +
          '<div class="c-muted" style="font-size:12.5px;">لا توجد تسويات كاسة أو أجور عمال في هذا النمط.</div>' +
        '</div>';
      }

      // نمط مالك + عامل معاً: متابعة الأجور المرحّلة وتسليمها
      if (patMeta.isAssisted) {
        var cards = wi.list.map(function(w) {
          var aw = data.assistedBySlot[w.slot];
          return '<div class="card stack-2">' +
            '<div class="row-between">' +
              '<strong class="c-gold" style="font-size:14.5px;">👷 ' + escapeHtml(w.name) + '</strong>' +
              '<span class="pill pill-gold">أجر اليوم: ' + fmtMi(w.defaultWage) + '</span>' +
            '</div>' +
            '<div class="inner-box stack-2" style="font-size:12.5px;">' +
              '<div class="row-between"><span class="c-muted">أيام العمل / الغياب:</span><strong>' + fmt(aw.workDays) + ' عمل • ' + fmt(aw.absentDays) + ' غياب</strong></div>' +
              '<div class="row-between"><span class="c-muted">دُفع له نقداً يومياً:</span><strong class="c-green">' + fmtMi(aw.paidCashSum) + '</strong></div>' +
              '<div class="row-between"><span class="c-muted">مجموع الأجر المرحّل:</span><strong class="c-amber">' + fmtMi(aw.deferredSum) + '</strong></div>' +
              '<div class="row-between"><span class="c-muted">تم تسليمه من المرحّل:</span><strong class="c-sky">' + fmtMi(aw.paidOut) + '</strong></div>' +
              '<div class="row-between" style="border-top:1px dashed #d4af37;padding-top:8px;font-size:14px;">' +
                '<strong class="c-gold">المتبقي له حالياً:</strong>' +
                '<strong class="' + (aw.owed > 0 ? 'c-amber' : 'c-green') + '">' + fmtMi(aw.owed) + '</strong>' +
              '</div>' +
            '</div>' +
            '<button type="button" onclick="openWagePayoutModal(\'' + w.slot + '\',' + aw.owed + ')" class="btn btn-gold btn-full">💵 تسليم أجر / تسبقة لـ ' + escapeHtml(w.name) + '</button>' +
          '</div>';
        }).join('');

        var hist = data.payouts.length
          ? '<div class="card-dark stack-2"><div class="c-gold" style="font-size:12.5px;font-weight:800;">📜 سجل تسليم الأجور (' + fmt(data.payouts.length) + ')</div>' +
              data.payouts.map(function(p) {
                return '<div class="row-between inner-box" style="font-size:12px;">' +
                  '<div><strong>' + escapeHtml(p.workerName) + '</strong><div class="c-dim" style="font-size:10.5px;">' + safeLtr(p.date) + (p.note ? (' • ' + escapeHtml(p.note)) : '') + '</div></div>' +
                  '<div class="row"><strong class="c-green">' + fmtMi(p.amount) + '</strong>' +
                  (!isReadOnly() ? '<button type="button" onclick="undoWagePayout(\'' + escapeAttr(p.id) + '\')" class="btn btn-red-soft btn-sm">✕</button>' : '') +
                  '</div>' +
                '</div>';
              }).join('') +
            '</div>'
          : '';
        return '<div class="stack-3">' + cards + hist + '</div>';
      }

      // أنماط الفريق (عامل وحده / عامل صباح + مالك مساء / عاملان صباح + عشية)
      var slot = (patMeta.twoWorkers && state.settleSlot === 'w2') ? 'w2' : 'w1';
      var wObj = slot === 'w2' ? wi.w2 : wi.w1;
      var b = data.settleBySlot[slot];

      var slotSwitcher = patMeta.twoWorkers
        ? '<div class="grid-2">' +
            '<button type="button" onclick="setSettleSlot(\'w1\')" class="opt-btn' + (slot === 'w1' ? ' active' : '') + '">☀️ ' + escapeHtml(wi.w1.name) + ' (' + fmt(data.settleBySlot.w1.finalNet) + ')</button>' +
            '<button type="button" onclick="setSettleSlot(\'w2\')" class="opt-btn' + (slot === 'w2' ? ' active' : '') + '">🌙 ' + escapeHtml(wi.w2.name) + ' (' + fmt(data.settleBySlot.w2.finalNet) + ')</button>' +
          '</div>'
        : '';

      var canSettle = (b.daysCount > 0 || b.prevCarryover !== 0 || b.workerPaidTotal > 0);
      var mainCard =
        '<div class="card stack-3" style="border-color:rgba(212,175,55,0.55);">' +
          '<div class="row-between">' +
            '<h3 class="c-gold" style="font-size:14.5px;font-weight:900;">🤝 تسوية ' + escapeHtml(wObj.name) + '</h3>' +
            '<button type="button" onclick="openCarryoverModal(\'' + slot + '\',' + b.prevCarryover + ')" class="btn btn-dark btn-sm">✏️ تعديل الباقي</button>' +
          '</div>' +
          '<div class="inner-box stack-2" style="font-size:12.5px;">' +
            '<div class="row-between"><span class="c-muted">الورديات المعتمدة غير المحاسبة:</span><strong>' + fmt(b.daysCount) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">مجموع مبيعات الفترة:</span><strong class="c-green">' + fmtMi(b.periodRev) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">مصاريف الكاسة + الأجور:</span><strong class="c-amber">' + fmtMi(-(b.periodExp + b.periodWages)) + '</strong></div>' +
            '<div class="row-between" style="border-top:1px solid #35261c;padding-top:6px;"><span>صافي ورديات الفترة:</span><strong class="c-green">' + fmtMi(b.periodNet) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">باقي مرحّل من التسوية السابقة:</span><strong class="' + (b.prevCarryover >= 0 ? 'c-amber' : 'c-red') + '">' + fmtMi(b.prevCarryover) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">فواتير ومشتريات دفعها العامل:</span><strong class="c-red">' + fmtMi(-b.workerPaidTotal) + '</strong></div>' +
            '<div class="row-between" style="border-top:1px dashed #d4af37;padding-top:8px;font-size:15px;">' +
              '<strong class="c-gold">' + (b.finalNet < 0 ? ('المستحق لـ ' + escapeHtml(wObj.name) + ':') : 'المستحق للإدارة:') + '</strong>' +
              '<strong class="' + (b.finalNet >= 0 ? 'c-green' : 'c-red') + '">' + fmtMi(b.finalNet) + '</strong>' +
            '</div>' +
          '</div>' +
          (canSettle
            ? '<button type="button" onclick="openSettleModal(\'' + slot + '\')" class="btn btn-gold btn-full">🤝 تسجيل تسوية الآن</button>'
            : '<div class="inner-box text-center c-green" style="font-size:12.5px;font-weight:800;">✅ حساب ' + escapeHtml(wObj.name) + ' مصفّى بالكامل حالياً.</div>') +
        '</div>';

      var histHtml = '';
      if (b.history.length) {
        histHtml = '<div class="stack-2">' +

    function updateSettlementPreview(finalNet) {
      var el = document.getElementById('stlAmtInput');

      var left = Math.round(finalNet - parseSignedNum(el.value));

    function submitSettlement(slot) {
      if (state.busy || isReadOnly()) return;
      var data = computeMonthData();
      var b = data.settleBySlot[slot];
      var wi = getWorkersConfig();
      var wName = slot === 'w2' ? wi.w2.name : wi.w1.name;
      var amtTaken = parseSignedNum((document.getElementById('stlAmtInput') || {}).value);
      var note = String((document.getElementById('stlNoteInput') || {}).value || '').trim();
      var left = Math.round(b.finalNet - amtTaken);

      state.busy = true;
      var now = Date.now();
      var stlId = 'STL_' + slot + '_' + now;
      var patch = {};
      var dayIds = [], invIds = [], purIds = [];

      b.unsettledDays.forEach(function(d) {
        dayIds.push(d.id);
        patch['day_decisions/' + d.id + '/settled'] = true;
        patch['day_decisions/' + d.id + '/settledAt'] = now;
        patch['day_decisions/' + d.id + '/settlementId'] = stlId;
      });
      b.unsettledInvs.forEach(function(inv) {
        invIds.push(inv.id);
        patch['invoice_decisions/' + inv.id + '/settled'] = true;
        patch['invoice_decisions/' + inv.id + '/settledAt'] = now;
        patch['invoice_decisions/' + inv.id + '/settlementId'] = stlId;
      });
      b.unsettledPurs.forEach(function(p) {
        purIds.push(p.id);
        patch['purchases/' + p.id + '/settled'] = true;
        patch['purchases/' + p.id + '/settlementId'] = stlId;
      });
      b.history.forEach(function(old) {
        if (!old.carryoverSettled) patch['settlements/' + old.id + '/carryoverSettled'] = true;
      });

      patch['settlements/' + stlId] = {
        id: stlId, date: getTodayDateStr(now), time: getCurrentTimeHHMM(now), timestamp: now,
        workerSlot: slot, workerName: wName, daysCount: b.daysCount,
        periodNet: b.periodNet, prevCarryover: b.prevCarryover, workerPaidTotal: b.workerPaidTotal,
        finalNet: b.finalNet, amountTaken: amtTaken, leftWithWorker: left,
        carryoverSettled: false, settledDayIds: dayIds, settledInvIds: invIds, settledPurIds: purIds, note: note
      };

      db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth).update(patch).then(function() {
        state.busy = false;
        closeModalById('cc-settle-modal');
        showToast('✅ تم تسجيل تسوية ' + wName + ' بنجاح.', 'ok');
      }).catch(function(err) {
        state.busy = false;
        showToast('فشل الحفظ: ' + err.message, 'err');
      });
    }

    function undoLastSettlement(slot) {
      if (isReadOnly()) return;
      var data = computeMonthData();
      var hist = data.settleBySlot[slot].history;
      if (!hist.length) return;
      var target = hist[0];
      showConfirm('↩️ التراجع عن آخر تسوية', 'هل تريد إلغاء تسوية ' + safeLtr(target.date) + ' وإعادة فتح وردياتها وفواتيرها؟', 'نعم، تراجع', function() {
        var patch = {};
        patch['settlements/' + target.id + '/undone'] = true;
        (target.settledDayIds || []).forEach(function(id) { patch['day_decisions/' + id + '/settled'] = false; });
        (target.settledInvIds || []).forEach(function(id) { patch['invoice_decisions/' + id + '/settled'] = false; });
        (target.settledPurIds || []).forEach(function(id) { patch['purchases/' + id + '/settled'] = false; });
        if (hist.length > 1) patch['settlements/' + hist[1].id + '/carryoverSettled'] = false;
        db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth).update(patch).then(function() {
          showToast('✅ تم التراجع عن التسوية بنجاح.', 'ok');

    function confirmDeletePurchase(pid) {
      var p = state.purchases[pid];
      if (!p || p.settled) return;
      showConfirm('🗑️ حذف المصروف', 'حذف «' + escapeHtml(p.name) + '» بقيمة ' + fmtMi(p.amount) + '؟', 'نعم، حذف', function() {
        var revert = (p.type === 'stock' && p.itemId && Number(p.qty) > 0) ? (function() { var d = {}; d[p.itemId] = -Number(p.qty); return d; })() : null;
        (revert ? applyStockDeltasAtomic(revert) : Promise.resolve()).then(function() {
          return db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/purchases/' + pid).update({ deleted: true, deletedAt: Date.now() });
        }).then(function() { showToast('✅ تم الحذف بنجاح.', 'ok'); });

        return true;
      });
      var fBar =
        '<div class="grid-3">' +
          '<button type="button" onclick="setInvFilter(\'all\')" class="opt-btn' + (state.invFilter === 'all' ? ' active' : '') + '">الكل (' + fmt(data.invoices.length) + ')</button>' +
          '<button type="button" onclick="setInvFilter(\'pending\')" class="opt-btn' + (state.invFilter === 'pending' ? ' active' : '') + '">معلّقة (' + fmt(data.pendingInvCnt) + ')</button>' +
          '<button type="button" onclick="setInvFilter(\'approved\')" class="opt-btn' + (state.invFilter === 'approved' ? ' active' : '') + '">معتمدة</button>' +

        return '<div class="stack-2">' + fBar + '<div class="card-dark text-center c-dim" style="padding:24px;font-size:12.5px;">لا توجد فواتير مخزن في هذا التصنيف.</div></div>';

        return '<div class="card-dark stack-2" style="' + (inv.status === 'pending' ? 'border:2px solid #f59e0b;' : '') + '">' +
          '<div class="row-between">' +
            '<div class="row-wrap"><strong class="c-gold">فاتورة #' + safeLtr(inv.invoiceNumber) + '</strong>' + stPill +
            '<span class="pill pill-dim">' + escapeHtml(inv.workerName) + '</span></div>' +
            '<strong class="c-white" style="font-size:14.5px;">' + fmtMi(inv.totalAmount) + '</strong>' +

          '<div class="c-muted" style="font-size:11.5px;">' + preview + '</div>' +
          '<div class="row-between">' +

    function openInvoiceModal(invId) {
      var data = computeMonthData();
      var inv = data.invoices.find(function(x) { return x.id === invId; });
      if (!inv) return;

      var rows = inv.items.map(function(it) {
        var bought = it.packQty ? (fmt(it.packQty) + ' ' + escapeHtml(it.packUnit || '')) : '—';
        return '<tr><td><strong>' + formatMixed(it.name) + '</strong></td><td class="text-center c-amber">' + bought + '</td><td class="text-left c-green"><strong>+' + formatStockQty(it.qty, it.unit) + '</strong></td></tr>';
      }).join('');

      var actions = '';
      if (inv.status === 'pending' && !isReadOnly()) {
        actions = '<div class="grid-2"><button type="button" onclick="approveInvoice(\'' + escapeAttr(inv.id) + '\')" class="btn btn-green btn-full">✅ اعتماد وإضافة للمخزون</button><button type="button" onclick="rejectInvoice(\'' + escapeAttr(inv.id) + '\')" class="btn btn-red-soft btn-full">❌ رفض</button></div>';
      } else if (inv.status === 'approved' && !inv.settled && !isReadOnly()) {
        actions = '<button type="button" onclick="cancelApprovedInvoice(\'' + escapeAttr(inv.id) + '\')" class="btn btn-red-soft btn-full">↩️ إلغاء الفاتورة وخصمها من المخزون</button>';
      }

      var html =
        '<div class="modal-box stack-3 text-right">' +
          '<div class="row-between"><h3 class="c-gold" style="font-size:15px;font-weight:900;">🧾 فاتورة #' + safeLtr(inv.invoiceNumber) + '</h3><button type="button" onclick="closeModalById(\'cc-inv-modal\')" class="modal-close">✕</button></div>' +
          '<div class="grid-2 inner-box" style="font-size:12px;">' +
            '<div><span class="c-dim">المبلغ:</span><div class="c-green" style="font-size:15px;font-weight:900;">' + fmtMi(inv.totalAmount) + '</div></div>' +
            '<div><span class="c-dim">المُرسل / المصدر:</span><div><strong>' + escapeHtml(inv.workerName) + '</strong> (' + (inv.paymentSource === 'worker_cash' ? 'الكاسة' : 'المالك') + ')</div></div>' +
          '</div>' +
          '<div class="inner-box"><table class="tbl"><thead><tr><th class="text-right">المادة</th><th class="text-center">الشراء</th><th class="text-left">للمخزون</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          actions +
          '<button type="button" onclick="closeModalById(\'cc-inv-modal\')" class="btn btn-dark btn-full">إغلاق</button>' +
        '</div>';
      openModalHtml('cc-inv-modal', html);
    }

    function approveInvoice(invId) {
      if (state.busy || isReadOnly()) return;
      var raw = state.subInvoices[invId];
      if (!raw) return;
      state.busy = true;
      var deltas = {};
      (Array.isArray(raw.items) ? raw.items : []).forEach(function(it) {
        if (it && it.itemId && Number(it.qty) > 0) deltas[it.itemId] = (deltas[it.itemId] || 0) + Number(it.qty);
      });
      applyStockDeltasAtomic(deltas).then(function() {
        return db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/invoice_decisions/' + invId).set({
          status: 'approved', settled: false, stockApplied: true, approvedAt: Date.now(), approvedBy: state.user.uid
        });
      }).then(function() {
        state.busy = false;
        closeModalById('cc-inv-modal');
        showToast('✅ تم اعتماد الفاتورة وإضافة الكميات للمخزون.', 'ok');
      }).catch(function(err) { state.busy = false; showToast('خطأ: ' + err.message, 'err'); });
    }

    function rejectInvoice(invId) {
      if (isReadOnly()) return;
      showConfirm('❌ رفض الفاتورة', 'سيتم رفض الفاتورة دون إضافة للمخزون.', 'تأكيد الرفض', function() {
        db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/invoice_decisions/' + invId).set({
          status: 'rejected', settled: false, stockApplied: false, rejectedAt: Date.now()
        }).then(function() { closeModalById('cc-inv-modal'); showToast('تم رفض الفاتورة.', 'warn'); });
      });
    }

    function cancelApprovedInvoice(invId) {
      if (state.busy || isReadOnly()) return;
      var raw = state.subInvoices[invId];
      var dec = state.invDecs[invId];
      if (!raw || !dec || dec.settled) return;
      showConfirm('↩️ إلغاء الفاتورة المعتمدة', 'سيتم إلغاء الفاتورة وخصم كمياتها المضافة من المخزون.', 'نعم، إلغاء', function() {
        state.busy = true;
        var deltas = {};
        if (dec.stockApplied) {
          (Array.isArray(raw.items) ? raw.items : []).forEach(function(it) {
            if (it && it.itemId && Number(it.qty) > 0) deltas[it.itemId] = (deltas[it.itemId] || 0) - Number(it.qty);
          });
        }
        applyStockDeltasAtomic(deltas).then(function() {
          return db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/invoice_decisions/' + invId).set({
            status: 'rejected', settled: false, stockApplied: false, cancelledAt: Date.now()
          });
        }).then(function() {
          state.busy = false;
          closeModalById('cc-inv-modal');
          showToast('✅ تم إلغاء الفاتورة وضبط المخزون.', 'ok');
        }).catch(function(err) { state.busy = false; showToast('خطأ: ' + err.message, 'err'); });
      });
    }

    function getPosStockUsedMap() {
      var prods = getProductsList();
      var used = {};
      state.posSales.forEach(function(s) {
        var p = prods.find(function(x) { return x.id === s.id; });
        if (p && isProductStockLinked(p)) used[p.stockItemId] = (used[p.stockItemId] || 0) + (parseNum(s.qty) * Number(p.stockDeduct));
      });
      return used;
    }

    function renderPosScreen() {
      var prods = getProductsList();
      var usedMap = getPosStockUsedMap();
      var salesMap = {}, rev = 0, exp = 0;
      state.posSales.forEach(function(s) { salesMap[s.id] = s; rev += parseNum(s.amount); });
      state.posExpenses.forEach(function(e) { exp += parseNum(e.amount); });
      var net = rev - exp;

      var cards = prods.length
        ? prods.map(function(p) {
            var sold = salesMap[p.id];
            var u = escapeHtml(getProductSaleUnit(p));
            var mid = sold
              ? '<div class="prod-sold-badge">✓ مسجل: ' + fmt(sold.qty) + ' ' + u + '</div>'
              : '<div class="prod-price">' + fmtMi(p.price) + ' / ' + u + '</div>';
            var footer = '<div class="prod-footer" style="background:rgba(13,10,26,0.7);">تحضير مباشر</div>';
            if (isProductStockLinked(p)) {
              var st = state.stockObj[p.stockItemId];
              var avail = Math.max(0, Math.round((Number(st.qty) || 0) - (usedMap[p.stockItemId] || 0)));
              var lim = st.unit === 'g' ? getLowWeightLimit() : getLowUnitLimit();
              var pCls = avail <= 0 ? 'stock-pill-zero' : (avail <= lim ? 'stock-pill-low' : 'stock-pill-ok');
              footer = '<div class="prod-footer" style="background:rgba(13,10,26,0.7);"><span>المخزون:</span><span class="' + pCls + '">' + fmt(avail) + '</span></div>';
            }
            return '<button type="button" onclick="openPosSaleModal(\'' + escapeAttr(p.id) + '\')" class="prod-card cat-' + escapeHtml(p.category || 'hot') + (sold ? ' prod-registered' : '') + '">' +
              '<div class="prod-title">' + formatMixed(p.name) + '</div>' + mid + footer +

          }).join('')

          '<div class="pos-sum-box" style="border-color:#f59e0b;"><div class="c-amber" style="font-size:11.5px;font-weight:800;">الصافي</div><div class="' + (net >= 0 ? 'c-amber' : 'c-red') + '" style="font-size:13.5px;font-weight:900;margin-top:3px;">' + fmtMi(net) + '</div></div>' +
        '</div>' +
        '<div class="card stack-2">' +
          '<div class="row-between"><strong class="c-gold" style="font-size:13px;">☕ اضغط على السلعة لتسجيل البيع</strong><span class="pill pill-dim">' + safeLtr(state.posDate) + '</span></div>' +

        '<div class="modal-box stack-3 text-right">' +
          '<div class="row-between"><h3 class="c-gold" style="font-size:16px;font-weight:900;">☕ ' + formatMixed(p.name) + '</h3><button type="button" onclick="closeModalById(\'cc-pos-sale\')" class="modal-close">✕</button></div>' +
          '<div class="text-center c-muted" style="font-size:12.5px;">سعر الوحدة: <strong class="c-amber">' + fmtMi(p.price) + '</strong> / ' + escapeHtml(u) + '</div>' +
          (ex ? '<div class="inner-box text-center c-amber" style="font-size:12px;">المسجّل حالياً: <strong>' + fmt(ex.qty) + ' ' + escapeHtml(u) + '</strong> (اكتب العدد الجديد لتعويضه)</div>' : '') +
          '<div><label class="field-label">' + lbl + '</label><input id="posQtyInp" type="tel" inputmode="numeric" placeholder="0" oninput="formatInputWithSpaces(this);document.getElementById(\'posTotPrev\').innerHTML=fmtMi(parseNum(this.value)*' + p.price + ');" class="input input-big num-input-ltr" /></div>' +
          '<div class="row-between inner-box" style="font-size:13px;"><span>المبلغ الجملي:</span><strong id="posTotPrev" class="c-green">' + fmtMi(ex ? ex.amount : 0) + '</strong></div>' +
          '<div class="grid-2"><button type="button" onclick="confirmPosSale(\'' + escapeAttr(p.id) + '\')" class="btn btn-gold btn-full">✓ ' + (ex ? 'تحديث' : 'إضافة') + '</button><button type="button" onclick="closeModalById(\'cc-pos-sale\')" class="btn btn-dark btn-full">إلغاء</button></div>' +
        '</div>';
      openModalHtml('cc-pos-sale', html);
    }
    function confirmPosSale(pid) {
      var p = getProductsList().find(function(x) { return x.id === pid; });
      var q = parseNum((document.getElementById('posQtyInp') || {}).value);
      if (!p || q <= 0) return showToast('أدخل كمية صحيحة.', 'warn');
      var u = getProductSaleUnit(p);
      var amt = q * parseNum(p.price);
      var ex = state.posSales.find(function(s) { return s.id === pid; });
      if (ex) { ex.qty = q; ex.amount = amt; ex.unit = u; }
      else { state.posSales.push({ id: p.id, name: p.name, category: p.category, qty: q, unit: u, unitPrice: p.price, amount: amt }); }
      savePosLocal();
      closeModalById('cc-pos-sale');
      render();
    }
    function deletePosSale(idx) { state.posSales.splice(idx, 1); savePosLocal(); render(); }

    function openPosDailyExpModal() {

        '<div class="modal-box stack-3 text-right">' +

          '<div class="grid-2">' + btns + '</div>' +
          '<div><label class="field-label">الثمن بالمليم (' + escapeHtml(state.posDailySelected) + '):</label><input id="posDailyAmt" type="tel" inputmode="numeric" placeholder="0" oninput="formatInputWithSpaces(this)" class="input input-big num-input-ltr" /></div>' +
          '<div class="grid-2"><button type="button" onclick="addPosDailyExp()" class="btn btn-gold btn-full">➕ إضافة</button><button type="button" onclick="closeModalById(\'cc-pos-exp\')" class="btn btn-dark btn-full">إغلاق</button></div>' +

    function addPosDailyExp() {
