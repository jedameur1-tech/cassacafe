    // إغلاق وردية المالك (اعتماد فوري + خصم المخزون + خيار أجر العامل في نمط مالك+عامل)
    function setPosShift(sh) { state.posShift = sh; openCloseOwnerShiftModal(); }
    function setPosWageStatus(slot, st) { state.posWageStatus[slot] = st; openCloseOwnerShiftModal(); }

    function openCloseOwnerShiftModal() {
      if (isReadOnly()) return showToast('الاشتراك منتهٍ حالياً.', 'err');
      if (!state.posSales.length && !state.posExpenses.length) return showToast('سجّل المبيعات أو المصاريف أولاً.', 'warn');

      var pat = getWorkPattern();
      var patMeta = getPatternMeta();
      if (!state.posShift) state.posShift = (pat === 'worker_owner') ? 'evening' : 'full';
      var wi = getWorkersConfig();

      var rev = 0, exp = 0;
      state.posSales.forEach(function(s) { rev += parseNum(s.amount); });
      state.posExpenses.forEach(function(e) { exp += parseNum(e.amount); });

      var wageSection = '';
      var totalWagesToday = 0;
      if (patMeta.isAssisted) {
        wageSection = '<div class="stack-2"><div class="c-gold" style="font-size:12px;font-weight:800;">👷 حالة أجر العمال اليوم:</div>' +
          wi.list.map(function(w) {
            var cur = state.posWageStatus[w.slot] || 'paid_cash';
            state.posWageStatus[w.slot] = cur;
            if (cur === 'paid_cash' || cur === 'deferred') totalWagesToday += w.defaultWage;
            return '<div class="inner-box stack-2">' +
              '<div class="row-between" style="font-size:12px;"><strong>' + escapeHtml(w.name) + '</strong><span class="c-amber">' + fmtMi(w.defaultWage) + '</span></div>' +
              '<div class="grid-3">' +
                '<button type="button" onclick="setPosWageStatus(\'' + w.slot + '\',\'paid_cash\')" class="opt-btn' + (cur === 'paid_cash' ? ' active-green' : '') + '">💵 دُفع نقداً</button>' +
                '<button type="button" onclick="setPosWageStatus(\'' + w.slot + '\',\'deferred\')" class="opt-btn' + (cur === 'deferred' ? ' active' : '') + '">⏳ مُرحّل</button>' +
                '<button type="button" onclick="setPosWageStatus(\'' + w.slot + '\',\'absent\')" class="opt-btn' + (cur === 'absent' ? ' active-red' : '') + '">🚫 غائب</button>' +
              '</div>' +
            '</div>';
          }).join('') + '</div>';
      }

      var html =
        '<div class="modal-box stack-3 text-right">' +
          '<div class="row-between"><h3 class="c-gold" style="font-size:15px;font-weight:900;">✅ إغلاق وردية المالك</h3><button type="button" onclick="closeModalById(\'cc-pos-close\')" class="modal-close">✕</button></div>' +
          '<div><label class="field-label">تاريخ الوردية:</label><input id="posCloseDate" type="date" dir="ltr" value="' + escapeAttr(state.posDate) + '" onchange="state.posDate=this.value;savePosLocal();" class="input num-input-ltr" /></div>' +
          '<div><label class="field-label">نوع الوردية:</label>' +
            '<div class="grid-3">' +
              '<button type="button" onclick="setPosShift(\'morning\')" class="opt-btn' + (state.posShift === 'morning' ? ' active' : '') + '">☀️ صباح</button>' +
              '<button type="button" onclick="setPosShift(\'evening\')" class="opt-btn' + (state.posShift === 'evening' ? ' active' : '') + '">🌙 عشية</button>' +
              '<button type="button" onclick="setPosShift(\'full\')" class="opt-btn' + (state.posShift === 'full' ? ' active' : '') + '">📅 يوم كامل</button>' +
            '</div>' +
          '</div>' +
          wageSection +
          '<div class="inner-box stack-2" style="font-size:12.5px;">' +
            '<div class="row-between"><span class="c-muted">المبيعات:</span><strong class="c-green">' + fmtMi(rev) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">مصاريف الكاسة:</span><strong class="c-red">' + fmtMi(-exp) + '</strong></div>' +
            (totalWagesToday > 0 ? '<div class="row-between"><span class="c-muted">أجور العمال:</span><strong class="c-amber">' + fmtMi(-totalWagesToday) + '</strong></div>' : '') +
            '<div class="row-between" style="border-top:1px dashed #d4af37;padding-top:6px;font-size:14px;"><strong class="c-gold">الصافي:</strong><strong class="c-green">' + fmtMi(rev - exp - totalWagesToday) + '</strong></div>' +
          '</div>' +
          '<div class="grid-2"><button type="button" onclick="executeCloseOwnerShift()" class="btn btn-gold btn-full">✅ تثبيت واعتماد</button><button type="button" onclick="closeModalById(\'cc-pos-close\')" class="btn btn-dark btn-full">إلغاء</button></div>' +
        '</div>';
      openModalHtml('cc-pos-close', html);
    }

    function executeCloseOwnerShift() {
      if (state.busy || isReadOnly()) return;
      state.busy = true;
      var dt = (document.getElementById('posCloseDate') || {}).value || state.posDate || getTodayDateStr();
      var mk = dt.slice(0, 7);
      var rev = 0, exp = 0;
      var itemsSold = state.posSales.map(function(s) {
        rev += parseNum(s.amount);
        return { productId: s.id, name: s.name, category: s.category, qty: parseNum(s.qty), unit: s.unit, unitPrice: parseNum(s.unitPrice), lineTotal: parseNum(s.amount) };
      });
      state.posExpenses.forEach(function(e) { exp += parseNum(e.amount); });

      var usedMap = getPosStockUsedMap();
      var stockUsage = [], deltas = {};
      Object.keys(usedMap).forEach(function(sid) {
        var st = state.stockObj[sid];
        if (st && usedMap[sid] > 0) {
          stockUsage.push({ itemId: sid, name: st.name, unit: st.unit, qty: Number(usedMap[sid].toFixed(3)) });
          deltas[sid] = -usedMap[sid];
        }
      });

      var workerWages = {};
      if (getPatternMeta().isAssisted) {
        getWorkersConfig().list.forEach(function(w) {
          var st = state.posWageStatus[w.slot] || 'paid_cash';
          workerWages[w.slot] = { name: w.name, status: st, amount: st === 'absent' ? 0 : w.defaultWage };
        });
      }

      var now = Date.now();
      var entryId = db.ref().push().key;
      var base = 'tenants/' + state.cafeId;
      var updates = {};
      updates[base + '/submissions/' + mk + '/days/' + entryId] = {
        date: dt, shift: state.posShift || 'full', workerSlot: 'owner', workerName: getOwnerName(),
        sales: rev, itemsSold: itemsSold, expenses: state.posExpenses, expensesTotal: exp,
        stockUsage: stockUsage, workerWages: workerWages, ownerShift: true,
        submittedBy: state.user.uid, submittedByRole: 'owner', createdAt: now
      };
      updates[base + '/admin/' + mk + '/day_decisions/' + entryId] = {
        status: 'approved', dailyWage: 0, settled: true, stockApplied: true, approvedAt: now, approvedBy: state.user.uid
      };

      applyStockDeltasAtomic(deltas).then(function() {
        return db.ref().update(updates);
      }).then(function() {
        state.busy = false;
        state.posSales = [];
        state.posExpenses = [];
        state.posDate = getTodayDateStr();
        savePosLocal();
        closeModalById('cc-pos-close');
        showToast('✅ تم تثبيت الوردية وخصم المخزون بنجاح.', 'ok');
        state.screen = 'accounting';
        state.accTab = 'days';
        render();
      }).catch(function(err) {
        state.busy = false;
        showToast('فشل الحفظ: ' + err.message, 'err');
      });
    }

    // ===== 3. شاشة المخزون والجرد الفعلي =====
    function renderStockScreen() {
      var list = getStockList();
      var lowW = getLowWeightLimit(), lowU = getLowUnitLimit();

      var topBtns =
        '<div class="grid-2">' +
          '<button type="button" onclick="openDirectStockBuyModal()" class="btn btn-gold btn-full">➕ شراء مباشر للمخزون</button>' +
          '<button type="button" onclick="openStockAuditModal()" class="btn btn-dark btn-full" style="border-color:#38bdf8;color:#bae6fd;">🔍 جرد فعلي</button>' +
        '</div>';

      if (!list.length) {
        return '<div class="stack-3">' + topBtns + '<div class="card-dark text-center c-dim" style="padding:26px;font-size:13px;">لم تُضف مواد مخزن بعد لهذا المقهى من لوحة المشرف العام.</div></div>';
      }

      var cards = list.map(function(st) {
        var lim = st.unit === 'g' ? lowW : lowU;
        var pillCls = st.qty <= 0 ? 'pill-red' : (st.qty <= lim ? 'pill-amber' : 'pill-green');
        var stTxt = st.qty <= 0 ? 'نفد' : (st.qty <= lim ? 'منخفض' : 'جيد');
        return '<div class="card-dark row-between">' +
          '<div><strong style="font-size:14.5px;">' + formatMixed(st.name) + '</strong>' +
          '<div class="c-dim" style="font-size:11px;margin-top:2px;">الجرد: ' + (st.unit === 'g' ? 'بالغرام' : 'بالوحدة') + ' • الشراء: ' + escapeHtml(st.packLabel || 'وحدة') + ' (×' + fmt(st.packSize) + ')</div></div>' +
          '<div class="text-left"><div style="font-size:15px;font-weight:900;">' + formatStockQty(st.qty, st.unit) + '</div><span class="pill ' + pillCls + '">' + stTxt + '</span></div>' +
        '</div>';
      }).join('');

      return '<div class="stack-3">' + topBtns + '<div class="stack-2">' + cards + '</div></div>';
    }

    function selectDirectBuyItem(id) {
      state.stockBuyItemId = id;
      var st = state.stockObj[id];
      state.stockBuyMult = st ? (Number(st.packSize) || (st.unit === 'g' ? 1000 : 1)) : 1;
      openDirectStockBuyModal();
    }

    function openDirectStockBuyModal() {
      if (isReadOnly()) return showToast('الاشتراك منتهٍ حالياً.', 'err');
      var list = getStockList();
      if (!list.length) return showToast('لا توجد مواد مخزن بعد.', 'warn');
      if (!state.stockBuyItemId || !state.stockObj[state.stockBuyItemId]) {
        state.stockBuyItemId = list[0].id;
        state.stockBuyMult = list[0].packSize || 1;
      }
      var cur = state.stockObj[state.stockBuyItemId];
      var btns = list.map(function(st) {
        return '<button type="button" onclick="selectDirectBuyItem(\'' + escapeAttr(st.id) + '\')" class="opt-btn' + (st.id === state.stockBuyItemId ? ' active' : '') + '">' + formatMixed(st.name) + '</button>';
      }).join('');

      var html =
        '<div class="modal-box stack-3 text-right">' +
          '<div class="row-between"><h3 class="c-gold" style="font-size:15px;font-weight:900;">📦 شراء مباشر للمخزون</h3><button type="button" onclick="closeModalById(\'cc-sbuy-modal\')" class="modal-close">✕</button></div>' +
          '<div class="grid-2">' + btns + '</div>' +
          '<div><label class="field-label">الكمية (' + escapeHtml(cur.packLabel || (cur.unit === 'g' ? 'كغ' : 'وحدة')) + ' ×' + fmt(state.stockBuyMult) + '):</label>' +
          '<input id="sBuyQty" type="tel" inputmode="numeric" value="1" oninput="formatInputWithSpaces(this);document.getElementById(\'sBuyPrev\').innerHTML=\'يُضاف للمخزون: \'+formatStockQty(parseNum(this.value)*' + state.stockBuyMult + ',\'' + cur.unit + '\');" class="input num-input-ltr" />' +
          '<div id="sBuyPrev" class="c-green text-center" style="font-size:11.5px;margin-top:4px;">يُضاف للمخزون: ' + formatStockQty(state.stockBuyMult, cur.unit) + '</div></div>' +
          '<div><label class="field-label">الثمن الجملي بالمليم:</label><input id="sBuyCost" type="tel" inputmode="numeric" placeholder="0" oninput="formatInputWithSpaces(this)" class="input input-big num-input-ltr" /></div>' +
          '<div class="grid-2"><button type="button" onclick="submitDirectStockBuy()" class="btn btn-gold btn-full">✓ حفظ وإضافة</button><button type="button" onclick="closeModalById(\'cc-sbuy-modal\')" class="btn btn-dark btn-full">إلغاء</button></div>' +
        '</div>';
      openModalHtml('cc-sbuy-modal', html);
    }

    function submitDirectStockBuy() {
      var st = state.stockObj[state.stockBuyItemId];
      var q = parseNum((document.getElementById('sBuyQty') || {}).value);
      var cost = parseNum((document.getElementById('sBuyCost') || {}).value);
      if (!st || q <= 0 || cost <= 0) return showToast('أدخل الكمية والثمن بالمليم.', 'warn');
      var baseQty = q * state.stockBuyMult;
      var deltas = {};
      deltas[state.stockBuyItemId] = baseQty;
      var now = Date.now();
      var pid = 'PUR_' + now;

      applyStockDeltasAtomic(deltas).then(function() {
        return db.ref('tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/purchases/' + pid).set({
          id: pid, ts: now, date: getTodayDateStr(now), time: getCurrentTimeHHMM(now),
          type: 'stock', payer: 'admin', name: st.name, itemId: state.stockBuyItemId,
          qty: baseQty, unit: st.unit, amount: cost, settled: false
        });
      }).then(function() {
        closeModalById('cc-sbuy-modal');
        showToast('✅ تم شراء ' + st.name + ' وإضافتها للمخزون.', 'ok');
      }).catch(function(err) { showToast('خطأ: ' + err.message, 'err'); });
    }

    function openStockAuditModal() {
      if (isReadOnly()) return showToast('الاشتراك منتهٍ حالياً.', 'err');
      var list = getStockList();
      if (!list.length) return showToast('لا توجد مواد للجرد.', 'warn');

      var rows = list.map(function(st) {
        return '<div class="inner-box stack-2">' +
          '<div class="row-between" style="font-size:12.5px;"><strong>' + formatMixed(st.name) + '</strong><span class="c-muted">المسجّل: ' + formatStockQty(st.qty, st.unit) + '</span></div>' +
          '<input data-audit-id="' + escapeAttr(st.id) + '" type="tel" inputmode="numeric" value="' + escapeAttr(fmtInputVal(st.qty)) + '" oninput="formatInputWithSpaces(this)" class="input num-input-ltr" />' +
        '</div>';
      }).join('');

      var html =
        '<div class="modal-box stack-3 text-right">' +
          '<div class="row-between"><h3 class="c-sky" style="font-size:15px;font-weight:900;">🔍 الجرد الفعلي للمخزون</h3><button type="button" onclick="closeModalById(\'cc-audit-modal\')" class="modal-close">✕</button></div>' +
          '<div class="c-muted" style="font-size:12px;">أدخل الكمية الحقيقية الموجودة حالياً (' + escapeHtml('بالغرام للموزون أو بالوحدة') + ') لضبط الرصيد وحساب الفارق.</div>' +
          '<div class="stack-2">' + rows + '</div>' +
          '<div class="grid-2"><button type="button" onclick="submitStockAudit()" class="btn btn-gold btn-full">💾 اعتماد الجرد</button><button type="button" onclick="closeModalById(\'cc-audit-modal\')" class="btn btn-dark btn-full">إلغاء</button></div>' +
        '</div>';
      openModalHtml('cc-audit-modal', html);
    }

    function submitStockAudit() {
      var inputs = document.querySelectorAll('[data-audit-id]');
      var now = Date.now();
      var auditItems = [];
      var updates = {};
      for (var i = 0; i < inputs.length; i++) {
        var id = inputs[i].getAttribute('data-audit-id');
        var st = state.stockObj[id];
        if (!st) continue;
        var actual = parseNum(inputs[i].value);
        var exp = Math.round(Number(st.qty) || 0);
        auditItems.push({ itemId: id, name: st.name, unit: st.unit, expected: exp, actual: actual, diff: actual - exp });
        updates['tenants/' + state.cafeId + '/live/stock_state/stock/' + id + '/qty'] = actual;
      }
      updates['tenants/' + state.cafeId + '/live/stock_state/updatedAt'] = now;
      updates['tenants/' + state.cafeId + '/admin/' + state.activeMonth + '/stock_audits/AUD_' + now] = {
        date: getTodayDateStr(now), time: getCurrentTimeHHMM(now), timestamp: now, items: auditItems
      };

      db.ref().update(updates).then(function() {
        closeModalById('cc-audit-modal');
        showToast('✅ تم اعتماد الجرد الفعلي وضبط أرصدة المخزون.', 'ok');
      }).catch(function(err) { showToast('خطأ: ' + err.message, 'err'); });
    }

      var workerCard = '';
      if (patMeta.hasTeam) {

        workerCard =
          '<div class="card-dark stack-2">' +
            '<div class="c-gold" style="font-size:13px;font-weight:900;">👷 حالة تطبيق العمال</div>' +
            '<div class="inner-box stack-2" style="font-size:12px;">' +
              '<div>رمز دخول المقهى: <strong class="c-gold">' + safeLtr((state.meta && state.meta.code) || '—') + '</strong></div>' +
              '<div>آخر ظهور: <strong>' + (ws.lastSeen ? (escapeHtml(ws.workerName || 'العامل') + ' — ' + safeLtr(getTodayDateStr(ws.lastSeen) + ' ' + getCurrentTimeHHMM(ws.lastSeen))) : 'بانتظار أول اتصال') + '</strong></div>' +
            '</div>' +
            '<button type="button" onclick="sendClearWorkerCache()" class="btn btn-dark btn-sm btn-full">🧹 إرسال أمر تحديث / مسح كاش للعامل</button>' +
          '</div>';
      }

      var bst = getBeinStatus();
      var beinCard =
        '<div class="card-dark stack-2">' +
          '<div class="row-between">' +
            '<strong class="c-purple" style="font-size:13px;">⚽ تذكير اشتراك بين سبورت</strong>' +
            '<button type="button" onclick="openFixedModal(true)" class="btn btn-purple btn-sm">' + (bst.hasRecord ? 'تعديل / تجديد' : 'ضبط الآن') + '</button>' +
          '</div>' +
          '<div class="c-muted" style="font-size:12px;">' + (bst.hasRecord ? ('الانتهاء: <strong>' + safeLtr(bst.rem.expiryDate) + '</strong> (' + formatMixed(bst.daysText) + ')') : 'غير مضبوط حالياً — اضغط «ضبط الآن» لتحديد تاريخ الانتهاء.') + '</div>' +
        '</div>';

      return '<div class="stack-3">' +
        '<div class="card stack-2">' +
          '<div class="c-gold" style="font-size:13px;font-weight:900;">📆 تصفّح الأشهر</div>' +
          '<div class="grid-3">' +
            '<button type="button" onclick="changeActiveMonth(-1)" class="btn btn-dark btn-sm">◀ السابق</button>' +
            '<div class="inner-box text-center" style="font-size:12.5px;font-weight:900;">' + formatMixed(formatArabicMonth(state.activeMonth)) + '</div>' +
            '<button type="button" onclick="changeActiveMonth(1)" class="btn btn-dark btn-sm">التالي ▶</button>' +
          '</div>' +
          (state.activeMonth !== state.cloudActiveMonth
            ? '<button type="button" onclick="setCloudActiveMonth()" class="btn btn-gold btn-sm btn-full">تثبيت ' + safeLtr(state.activeMonth) + ' كشهر العمل النشط</button>'
            : '<div class="text-center c-green" style="font-size:11.5px;font-weight:800;">✓ هذا هو الشهر النشط حالياً</div>') +
        '</div>' +
        beinCard +
        workerCard +
        '<div class="card-dark stack-2" style="font-size:12.5px;">' +
          '<div class="c-gold" style="font-size:13px;font-weight:900;">ℹ️ معلومات المقهى والاشتراك</div>' +
          '<div class="inner-box stack-2">' +
            '<div class="row-between"><span class="c-muted">اسم المقهى:</span><strong>' + escapeHtml(getCafeName()) + '</strong></div>' +
            '<div class="row-between"><span class="c-muted">نمط التشغيل:</span><strong>' + escapeHtml(patMeta.label) + '</strong></div>' +
            (wi.list.length ? '<div class="row-between"><span class="c-muted">العمال:</span><strong>' + wi.list.map(function(w) { return escapeHtml(w.name); }).join(' • ') + '</strong></div>' : '') +
            '<div class="row-between"><span class="c-muted">الاشتراك سارٍ حتى:</span><strong class="' + (daysLeft <= 7 ? 'c-red' : 'c-green') + '">' + safeLtr(getTodayDateStr(state.meta && state.meta.subscriptionUntil)) + ' (' + fmt(Math.max(0, daysLeft)) + ' يوم)</strong></div>' +
          '</div>' +
        '</div>' +
        '<button type="button" onclick="logoutOwner()" class="btn btn-red-soft btn-full">🚪 تسجيل الخروج</button>' +
      '</div>';
    }

    function sendClearWorkerCache() {
      if (isReadOnly()) return showToast('الاشتراك منتهٍ حالياً.', 'err');
      db.ref('tenants/' + state.cafeId + '/live/worker_commands/clear_cache').set(Date.now()).then(function() {
        showToast('✅ تم إرسال أمر التحديث لهاتف العامل.', 'ok');
      });
    }

    // ===== الرسم الرئيسي =====
    function render() {
      if (!state.cafeId || !state.meta) return;
      var root = document.getElementById('app-root');
      var data = computeMonthData();
      var body = '';
      if (state.screen === 'pos') body = renderPosScreen();
      else if (state.screen === 'stock') body = renderStockScreen();
      else if (state.screen === 'settings') body = renderSettingsScreen();
      else body = renderAccountingScreen(data);

      root.innerHTML = renderHeader(data) + '<main class="container">' + body + '</main>';
    }
  </script>
</body>
</html>
