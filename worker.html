    // ============ التسوية الحالية (معزولة لهذا العامل فقط) ============
    function isMySubmission(obj) {
      if (!obj) return false;
      if (obj.submittedBy && state.user && obj.submittedBy === state.user.uid) return true;
      if (obj.workerSlot) return obj.workerSlot === state.workerSlot;
      return (state.workerSlot === 'w1' && obj.submittedByRole === 'worker');
    }

    function openSettlementModal() {
      blurActiveInput();
      state.showSettlementModal = true;
      if (!navigator.onLine) {
        state.settlementLoading = false;
        state.settlementNote = 'آخر رصيد محفوظ (بدون إنترنت)';
        renderModalsOnly();
        return;
      }

      var mySeq = ++_settlementFetchSeq;
      state.settlementLoading = true;
      state.settlementNote = '';
      state.settlementPendingDays = 0;
      renderModalsOnly();

      var base = 'tenants/' + state.cafeId;
      var mk = state.activeMonthKey || getMonthKeyFromDate(state.date);

      Promise.all([
        db.ref(base + '/submissions/' + mk).once('value'),
        db.ref(base + '/admin/' + mk + '/day_decisions').once('value'),
        db.ref(base + '/admin/' + mk + '/invoice_decisions').once('value')
      ]).then(function(snaps) {
        if (mySeq !== _settlementFetchSeq) return;
        var sub = snaps[0].val() || {};
        var dayDecs = snaps[1].val() || {};
        var invDecs = snaps[2].val() || {};

        var daysObj = sub.days || {};
        var invsObj = sub.invoices || {};
        var defWage = getDailyWage();
        var daysNet = 0;
        var workerPaidInvs = 0;
        var pendingCnt = 0;

        Object.keys(daysObj).forEach(function(id) {
          var entry = daysObj[id];
          if (!entry || (entry.submittedByRole === 'owner' && entry.ownerShift)) return;
          if (!isMySubmission(entry)) return;
          var dec = dayDecs[id] || null;
          if (!dec || dec.status === 'pending') {
            pendingCnt++;
            return;
          }
          if (dec.status !== 'approved' || dec.settled) return;
          var sales = parseNum(entry.sales);
          var exp = parseNum(entry.expensesTotal);
          var w = (dec.dailyWage !== undefined && dec.dailyWage !== null) ? parseNum(dec.dailyWage) : defWage;
          daysNet += (sales - exp - w);
        });

        Object.keys(invsObj).forEach(function(id) {
          var inv = invsObj[id];
          var dec = invDecs[id] || null;
          if (!inv || !isMySubmission(inv)) return;
          if (!dec || dec.status !== 'approved' || dec.settled) return;
          if (inv.paymentSource === 'worker_cash') {
            workerPaidInvs += parseNum(inv.totalAmount);
          }
        });

        state.settlementLoading = false;
        state.settlementPendingDays = pendingCnt;
        state.ownerSettlementNet = Math.round(daysNet - workerPaidInvs);
        state.settlementNote = '✓ محدّث الآن لشهر ' + mk;
        safeSetStorage(sKey('settlement_net'), String(state.ownerSettlementNet));
        renderModalsOnly();
      }).catch(function() {
        if (mySeq !== _settlementFetchSeq) return;
        state.settlementLoading = false;
        state.settlementNote = '⚠️ تعذّر التحديث — المعروض آخر رصيد محفوظ';
        renderModalsOnly();
      });
    }

    function closeSettlementModal() {
      _settlementFetchSeq++;
      state.showSettlementModal = false;
      state.settlementLoading = false;
      state.settlementNote = '';
      renderModalsOnly();
    }

    function renderSettlementModal() {
      if (!state.showSettlementModal) return '';
      var currentSettlement = parseSignedNum(state.ownerSettlementNet);
      var amtColor = currentSettlement < 0 ? 'text-red-400' : 'text-amber-300';
      var pendingNote = state.settlementPendingDays > 0
        ? '<div class="text-[11px] font-bold text-amber-200 text-center">⏳ لديك ' + fmt(state.settlementPendingDays) + ' يومية بانتظار اعتماد الإدارة</div>'
        : '';
      var bodyBox = state.settlementLoading
        ? '<div class="bg-[#1f1610] border-2 border-[#d4af37] rounded-xl p-3.5 text-center"><span class="text-[13px] font-extrabold text-teal-300">⏳ جاري حساب تسويتك من السحابة...</span></div>'
        : '<div class="bg-[#1f1610] border-2 border-[#d4af37] rounded-xl p-3.5 flex justify-between items-center gap-2">' +
            '<span class="text-[13px] font-extrabold text-amber-200">المستحق لـ ' + escapeHtmlLocal(getOwnerName()) + ':</span>' +
            '<b class="text-[16px] font-mono font-extrabold whitespace-nowrap ' + amtColor + '">' + fmt(currentSettlement) + ' مي</b>' +
          '</div>' +
          pendingNote +
          (state.settlementNote ? '<div class="text-[11px] font-bold text-stone-300 text-center">' + formatMixedRtlText(state.settlementNote) + '</div>' : '');

      return '<div class="karawan-modal-overlay">' +
        '<div class="karawan-modal-box text-right space-y-3">' +
          '<h3 class="text-[15px] font-extrabold text-[#d4af37] text-center">💰 تسوية ' + escapeHtmlLocal(getWorkerName()) + '</h3>' +
          bodyBox +
          '<button type="button" onclick="closeSettlementModal()" class="btn-tap w-full py-2.5 bg-stone-800 border border-stone-600 text-stone-200 font-extrabold rounded-xl text-[14px]">إغلاق</button>' +
        '</div>' +
      '</div>';
    }

    // ============ إرسال اليومية (مع اختيار الوردية) ============
    function selectCloseDayShift(shiftKey) {
      state.selectedShift = shiftKey;
      renderModalsOnly();
    }

    function openCloseDayModal() {
      blurActiveInput();
      var unInp = document.getElementById('unclassifiedExpInput');
      if (unInp && parseNum(unInp.value) > 0) {
        return showToast('⚠️ كتبت مبلغاً (' + fmtPlain(parseNum(unInp.value)) + ' مي) في خانة «مبلغ غير مصنف» ولم تضغط على «إضافة»!\nاضغط على «إضافة» أولاً أو امسحه قبل الإرسال.', 'error', 'مصروف لم يُضَف بعد');
      }
      if (state.todaySales.length === 0 && state.todayExpenses.length === 0) {
        return showToast('يرجى تسجيل المبيعات أو المصاريف أولاً قبل إرسال اليومية!', 'error');
      }
      state.selectedShift = getDefaultShiftForWorker();
      state.showCloseDayModal = true;
      renderModalsOnly();
    }
    function closeCloseDayModal() { if (state.isSendingToOwner) return; state.showCloseDayModal = false; renderModalsOnly(); }

    function executeCloseDay() {
      if (state.todaySales.length === 0 && state.todayExpenses.length === 0) return;
      if (state.isSendingToOwner || isDoubleTapBlocked()) return;
      if (isReadOnly()) return showToast('🔒 اشتراك المقهى منتهٍ حالياً — لا يمكن الإرسال حتى يتم التجديد.', 'error', 'الاشتراك منتهٍ');
      if (!navigator.onLine) return showToast('⚠️ الهاتف غير متصل بالإنترنت حالياً!\nمعطيات اليوم محفوظة على الهاتف، يرجى تشغيل الإنترنت أولاً.', 'error', 'لا يوجد اتصال');

      var closedDate = isValidDateStr(state.date) ? state.date : getLocalTodayDateStr();
      var monthKey = getMonthKeyFromDate(closedDate);
      var shiftToSend = state.selectedShift || getDefaultShiftForWorker();
      var salesSnapshot = state.todaySales.slice();
      var rev = 0;
      var itemsSold = [];
      for (var i = 0; i < salesSnapshot.length; i++) {
        var s = salesSnapshot[i];
        if (!s) continue;
        var amt = parseNum(s.amount);
        rev += amt;
        itemsSold.push({
          productId: s.id,
          name: s.name,
          category: s.category || 'hot',
          qty: parseNum(s.qty),
          unit: s.unit || '',
          unitPrice: parseNum(s.unitPrice),
          lineTotal: amt
        });
      }

      // فصل مصاريف اليومية عن فواتير المخزن (لمنع الاحتساب المزدوج عند المالك)
      var dailyExpensesPayload = [];
      var dailyExpSum = 0;
      var invoiceRefs = [];
      for (var j = 0; j < state.todayExpenses.length; j++) {
        var e = state.todayExpenses[j];
        if (!e) continue;
        var eAmt = getExpAmt(e);
        if (isStockInvoiceEntry(e)) {
          invoiceRefs.push({ invoiceId: e.invoiceId || '', invoiceNumber: parseNum(e.invoiceNumber), amount: eAmt });
        } else {
          dailyExpensesPayload.push({ label: getExpLabelPlain(e), amount: eAmt, time: e.time || '' });
          dailyExpSum += eAmt;
        }
      }

      var usedMap = getTodayStockUsedMap();
      var stockUsage = [];
      Object.keys(usedMap).forEach(function(sid) {
        var st = state.stockObj[sid];
        if (st && usedMap[sid] > 0) {
          stockUsage.push({ itemId: sid, name: st.name, unit: st.unit || 'unit', qty: Number(usedMap[sid].toFixed(3)) });
        }
      });

      state.showCloseDayModal = false;
      state.isSendingToOwner = true;
      state.sendingStepText = 'جاري تثبيت ' + getShiftLabel(shiftToSend) + ' وإرسالها إلى ' + escapeHtmlLocal(getOwnerName()) + '...';
      renderModalsOnly();

      var nowTs = Date.now();
      var entryId = db.ref().push().key;

      db.ref('tenants/' + state.cafeId + '/submissions/' + monthKey + '/days/' + entryId).set({
        date: closedDate,
        shift: shiftToSend,
        workerSlot: state.workerSlot,
        workerName: getWorkerName(),
        expectedWage: getDailyWage(),
        sales: rev,
        itemsSold: itemsSold,
        expenses: dailyExpensesPayload,
        expensesTotal: dailyExpSum,
        invoiceRefs: invoiceRefs,
        stockUsage: stockUsage,
        note: '',
        ownerShift: false,
        submittedBy: state.user.uid,
        submittedByRole: 'worker',
        createdAt: nowTs
      }).then(function() {
        db.ref('tenants/' + state.cafeId + '/live/signals/lastDayAt').set(nowTs).catch(function() {});

        stockUsage.forEach(function(u) {
          if (state.stockObj[u.itemId]) {
            state.stockObj[u.itemId].qty = Math.max(0, Number(((Number(state.stockObj[u.itemId].qty) || 0) - u.qty).toFixed(3)));
          }
        });

        var nextDate = addOneDayToDateStr(closedDate);
        var todayNow = getLocalTodayDateStr();
        if (nextDate < todayNow) nextDate = todayNow;

        state.date = nextDate;
        state.todaySales = [];
        state.todayExpenses = [];
        state.activeTab = 'daily';
        saveAccountingLocal();
        pingWorkerStatus();

        state.isSendingToOwner = false;
        state.sendingStepText = '';
        state.thankYouModal = { closedDate: closedDate, shiftLabel: getShiftLabel(shiftToSend), nextDate: state.date };
        lastRenderedMainHtml = '';
        render();
        window.scrollTo(0, 0);
      }).catch(function(err) {
        state.isSendingToOwner = false;
        state.sendingStepText = '';
        renderModalsOnly();
        showToast('⚠️ تعذّر الإرسال: ' + (err && err.message ? err.message : 'تحقق من الإنترنت') + '\nالمبيعات والمصاريف ما زالت محفوظة أمامك.', 'error', 'لم يكتمل الإرسال');
      });
    }

    function renderCloseDayModal() {
      if (!state.showCloseDayModal) return '';
      var rev = state.todaySales.reduce(function(s, x) { return s + parseNum(x.amount); }, 0);
      var dailyExpSum = 0, invExpSum = 0, invoiceItemsRows = [];
      state.todayExpenses.forEach(function(x) {
        var amt = getExpAmt(x);
        if (isStockInvoiceEntry(x)) {
          invExpSum += amt;
          invoiceItemsRows.push('<div class="flex justify-between text-teal-200"><span class="font-sans font-bold">فاتورة عدد ' + fmt(parseNum(x.invoiceNumber) || 1) + ':</span><b class="text-teal-300">' + fmt(-amt) + ' مي</b></div>');
        } else { dailyExpSum += amt; }
      });
      var wage = getDailyWage();
      var net = rev - (dailyExpSum + invExpSum + wage);
      var warningsHtml = (state.todaySales.length === 0 ? '<div class="bg-red-950 border border-red-600 rounded-xl p-2.5 text-[11px] text-red-200 font-extrabold text-right">⚠️ تنبيه: لم تسجّل أي مبيعات بعد (المداخيل ' + fmt(0) + ')! تأكّد قبل الإرسال.</div>' : '') +
        (state.stockInvDraftItems && state.stockInvDraftItems.length > 0 ? '<div class="bg-amber-950 border border-amber-500 rounded-xl p-2.5 text-[11px] text-amber-200 font-extrabold text-right">⚠️ لديك فاتورة مخزن لم تُرسلها بعد في تبويب «الفواتير» (' + fmt(state.stockInvDraftItems.length) + ' مواد).</div>' : '');

      var sh = state.selectedShift || getDefaultShiftForWorker();
      var shiftPickerHtml =
        '<div class="text-right">' +
          '<div class="text-[11px] font-extrabold text-amber-200 mb-1">الوردية:</div>' +
          '<div class="grid grid-cols-3 gap-2">' +
            '<button type="button" onclick="selectCloseDayShift(\'morning\')" class="slot-btn' + (sh === 'morning' ? ' slot-btn-active' : '') + '">☀️ صباح</button>' +
            '<button type="button" onclick="selectCloseDayShift(\'evening\')" class="slot-btn' + (sh === 'evening' ? ' slot-btn-active' : '') + '">🌙 عشية</button>' +
            '<button type="button" onclick="selectCloseDayShift(\'full\')" class="slot-btn' + (sh === 'full' ? ' slot-btn-active' : '') + '">📅 يوم كامل</button>' +
          '</div>' +
        '</div>';

      return '<div class="karawan-modal-overlay"><div class="karawan-modal-box text-center space-y-3">' +
        '<div class="w-12 h-12 rounded-2xl bg-[#1f1610] border border-[#a87434] flex items-center justify-center mx-auto text-xl">📤</div>' +
        '<div><h3 class="text-[15px] font-extrabold text-[#d4af37]" dir="rtl">إرسال يومية (' + safeLtr(state.date) + ') إلى ' + escapeHtmlLocal(getOwnerName()) + '</h3><p class="text-[11px] text-teal-300 font-bold mt-0.5">📤 مراجعة الحساب النهائي قبل الإرسال</p></div>' +
        shiftPickerHtml +
        warningsHtml +
        '<div class="bg-[#1f1610] p-3 rounded-xl text-[12px] space-y-2 text-right font-mono border border-stone-700">' +
          '<div class="flex justify-between text-stone-200"><span class="font-sans font-bold">مداخيل الوردية:</span><b class="text-green-400">' + fmt(rev) + ' مي</b></div>' +
          '<div class="flex justify-between text-stone-200"><span class="font-sans font-bold">مصاريف اليومية:</span><b class="text-red-400">' + fmt(-dailyExpSum) + ' مي</b></div>' +
          invoiceItemsRows.join('') +
          '<div class="flex justify-between text-stone-200"><span class="font-sans font-bold">أجر العامل:</span><b class="text-red-400">' + fmt(-wage) + ' مي</b></div>' +
          '<div class="flex justify-between border-t border-stone-700 pt-2 ' + (net < 0 ? 'text-red-400' : 'text-amber-300') + ' font-extrabold text-[13px]"><span class="font-sans">الصافي المودع:</span><b>' + fmt(net) + ' مي</b></div>' +
        '</div>' +
        '<div class="flex gap-2 pt-1"><button type="button" onclick="executeCloseDay()" class="btn-tap flex-1 py-3 bg-[#d4af37] text-stone-950 font-extrabold rounded-xl text-[14px]">📤 إرسال الآن</button><button type="button" onclick="closeCloseDayModal()" class="btn-tap px-4 py-3 bg-stone-800 border border-stone-600 text-stone-200 font-bold rounded-xl text-[14px]">إلغاء</button></div>' +
      '</div></div>';
    }

    // ============ نوافذ التنبيه والتأكيد والشكر ============
    function showToast(msg, type, title) {
      var t = type || 'success';
      state.customAlert = {
        title: title || (t === 'error' ? 'تنبيه' : (t === 'info' ? 'معلومة' : 'تمت العملية بنجاح')),
        msg: enforceLtrInMessage(msg),
        type: t,
        icon: t === 'error' ? '⚠️' : (t === 'info' ? '🔔' : '✅'),
        loading: false,
        btnText: '✓ حسناً'
      };
      renderModalsOnly();
    }
    function closeCustomAlert() { if (state.customAlert && state.customAlert.loading) return; state.customAlert = null; renderModalsOnly(); }
    function showConfirmModal(title, msg, onYes, icon) {
      state.customConfirm = { title: title || 'تأكيد العملية', msg: enforceLtrInMessage(msg), icon: icon || '❓', onYes: onYes };
      renderModalsOnly();
    }
    function executeCustomConfirm() {
      var fn = state.customConfirm ? state.customConfirm.onYes : null;
      state.customConfirm = null;
      if (typeof fn === 'function') fn(); else renderModalsOnly();
    }
    function closeCustomConfirm() { state.customConfirm = null; renderModalsOnly(); }
    function closeThankYouModal() { state.thankYouModal = null; renderModalsOnly(); }

    function renderThankYouModal() {
      if (!state.thankYouModal) return '';
      var info = state.thankYouModal;
      return '<div class="karawan-modal-overlay">' +
        '<div class="karawan-modal-box text-center space-y-3">' +
          '<div class="w-12 h-12 rounded-2xl bg-emerald-950 border-2 border-emerald-500 flex items-center justify-center mx-auto text-2xl">🌟</div>' +
          '<h2 class="text-[16px] font-extrabold text-[#d4af37] leading-snug">يعطيك الصحة يا ' + escapeHtmlLocal(getWorkerName()) + '!</h2>' +
          '<div class="bg-[#1f1610] border border-[#a87434] rounded-2xl p-3 space-y-1.5">' +
            '<p class="text-[13px] font-extrabold text-amber-200 leading-relaxed">شكراً جزيلاً على أمانتك ومجهودك الطيب اليوم في ' + escapeHtmlLocal(getCafeName()) + ' ☕🤝</p>' +
            '<p class="text-[11px] font-bold text-emerald-300 leading-relaxed">ربي يبارك في صحتك وفي رزقك.</p>' +
          '</div>' +
          '<div class="bg-emerald-950 border border-emerald-500 rounded-2xl py-2.5 px-3 text-[11px] space-y-1 font-bold">' +
            '<div class="text-emerald-200" dir="rtl">✓ وصلت ' + escapeHtmlLocal(info.shiftLabel) + ' ليوم (' + safeLtr(info.closedDate) + ') إلى ' + escapeHtmlLocal(getOwnerName()) + '</div>' +
            '<div class="text-amber-300" dir="rtl">✨ اليوم المفتوح الجديد: ' + safeLtr(info.nextDate) + '</div>' +
          '</div>' +
          '<button type="button" onclick="closeThankYouModal()" class="btn-tap w-full py-3 bg-[#d4af37] text-stone-950 font-extrabold rounded-xl text-[14px]">🌺 بارك الله فيكم — متابعة</button>' +
        '</div>' +
      '</div>';
    }

    function renderSendingModal() {
      if (!state.isSendingToOwner) return '';
      return '<div class="karawan-modal-overlay">' +
        '<div class="karawan-modal-box text-center space-y-3">' +
          '<div class="w-12 h-12 rounded-2xl bg-[#1f1610] border border-[#a87434] flex items-center justify-center mx-auto text-2xl">📤</div>' +
          '<h3 class="text-[16px] font-extrabold text-[#d4af37]">⏳ جاري الإرسال...</h3>' +
          '<p class="text-[13px] text-amber-200 font-bold leading-relaxed" dir="rtl">' + (state.sendingStepText || 'جاري الإرسال إلى الإدارة...') + '</p>' +
          '<div class="bg-[#1f1610] border border-emerald-500 py-2.5 px-3 rounded-xl text-[11px] text-emerald-300 font-bold">يرجى الانتظار لحظات حتى يكتمل الحفظ</div>' +
        '</div>' +
      '</div>';
    }

    function renderCustomAlertModal() {
      if (!state.customAlert) return '';
      var a = state.customAlert;
      var titleCol = a.type === 'error' ? 'text-red-400' : (a.type === 'info' ? 'text-teal-300' : 'text-emerald-300');
      var btnCol = a.loading
        ? 'bg-stone-800 border border-amber-500 text-amber-200'
        : (a.type === 'error' ? 'bg-red-950 border border-red-600 text-white' : (a.type === 'info' ? 'bg-teal-600 text-white' : 'bg-[#d4af37] text-stone-950'));
      return '<div class="karawan-modal-overlay"><div class="karawan-modal-box text-center space-y-3"><div class="w-12 h-12 rounded-2xl bg-[#1f1610] border border-stone-700 flex items-center justify-center mx-auto text-xl">' + escapeHtmlLocal(a.icon) + '</div><h3 class="text-[15px] font-extrabold ' + titleCol + '">' + formatMixedRtlText(a.title) + '</h3><p class="text-[13px] text-stone-200 leading-relaxed whitespace-pre-line font-bold" dir="rtl">' + a.msg + '</p><div class="pt-1"><button type="button"' + (a.loading ? ' disabled' : '') + ' onclick="closeCustomAlert()" class="btn-tap w-full py-2.5 ' + btnCol + ' font-extrabold rounded-xl text-[14px]">' + escapeHtmlLocal(a.loading ? '⏳ جاري جلب البيانات من السحابة...' : (a.btnText || '✓ حسناً')) + '</button></div></div></div>';
    }

    function renderCustomConfirmModal() {
      if (!state.customConfirm) return '';
      var c = state.customConfirm;
      return '<div class="karawan-modal-overlay"><div class="karawan-modal-box text-center space-y-3"><div class="w-12 h-12 rounded-2xl bg-[#1f1610] border border-[#a87434] flex items-center justify-center mx-auto text-xl">' + escapeHtmlLocal(c.icon) + '</div><h3 class="text-[15px] font-extrabold text-[#d4af37]">' + formatMixedRtlText(c.title) + '</h3><p class="text-[13px] text-stone-200 leading-relaxed whitespace-pre-line font-bold" dir="rtl">' + c.msg + '</p><div class="flex gap-2 pt-1"><button type="button" onclick="executeCustomConfirm()" class="btn-tap flex-1 py-2.5 bg-red-950 border border-red-600 text-white font-extrabold rounded-xl text-[14px]">✓ نعم، متأكد</button><button type="button" onclick="closeCustomConfirm()" class="btn-tap px-4 py-2.5 bg-stone-800 border border-stone-600 text-stone-200 font-bold rounded-xl text-[14px]">إلغاء</button></div></div></div>';
    }

    function renderModalsOnly() {
      var modalContainer = document.getElementById('modal-view');
      if (!modalContainer) return;
      var nextModalHtml =
        (state.activeProduct ? renderSaleModal() : '') +
        (state.showSettlementModal ? renderSettlementModal() : '') +
        (state.showDailyExpenseModal ? renderDailyExpenseModal() : '') +
        (state.showCloseDayModal ? renderCloseDayModal() : '') +
        (state.isSendingToOwner ? renderSendingModal() : '') +
        (state.thankYouModal ? renderThankYouModal() : '') +
        (state.customConfirm ? renderCustomConfirmModal() : '') +
        (state.customAlert ? renderCustomAlertModal() : '');
      if (nextModalHtml !== lastRenderedModalHtml) {
        lastRenderedModalHtml = nextModalHtml;
        modalContainer.innerHTML = nextModalHtml;
      }
    }

    // ============ رسم شاشة اليومية ============
    function renderDailyTabContent() {
      var salesMap = {}, totalRev = 0, expSum = 0, i;
      for (i = 0; i < state.todaySales.length; i++) {
        var s = state.todaySales[i];
        if (s) { salesMap[s.id] = s; totalRev += parseNum(s.amount); }
      }
      for (i = 0; i < state.todayExpenses.length; i++) {
        if (state.todayExpenses[i]) expSum += getExpAmt(state.todayExpenses[i]);
      }
      var totalOut = expSum + getDailyWage();
      var netToday = totalRev - totalOut;
      var usedMap = getTodayStockUsedMap();

      var productsGrid = state.products.length > 0
        ? state.products.map(function(p) {
            var soldItem = salesMap[p.id];
            return '<button id="prod-card-' + escapeAttr(toSafeKey(p.id)) + '" type="button" onclick="openSaleModal(\'' + escapeAttr(p.id) + '\')" class="prod-card ' + getCatClass(p.category) + (soldItem ? ' prod-registered' : '') + '">' + buildSingleProductCardInnerHtml(p, soldItem, usedMap) + '</button>';
          }).join('')
        : '<div class="col-span-2 bg-[#1f1610] border border-stone-700 rounded-xl p-4 text-center text-[13px] font-bold text-amber-200">لم تُجهّز السلع المباعة بعد.<br/>اضغط 🔄 بعد تجهيز القائمة من المشرف.</div>';

      var sampleCons = state.consumables.slice(0, 3).join('، ');
      var expiredNotice = (state.meta && isReadOnly())
        ? '<div class="bg-red-950 border border-red-600 rounded-2xl p-3 mb-3 text-[12px] text-red-200 font-extrabold text-center">🔒 اشتراك المقهى منتهٍ حالياً — لا يمكن الإرسال حتى يتم التجديد.</div>'
        : '';

      return expiredNotice +
        '<div class="grid grid-cols-3 gap-2 text-center mb-3">' +
          '<div class="summary-box bg-[#2b1f17] border-green-600"><div class="summary-label text-green-300">المبيعات</div><div id="sumRevVal" class="summary-val text-green-400 font-mono">' + fmt(totalRev) + ' مي</div></div>' +
          '<div class="summary-box bg-[#2b1f17] border-red-600"><div class="summary-label text-red-300">المصاريف+الأجر</div><div id="sumOutVal" class="summary-val text-red-400 font-mono">' + fmt(totalOut) + ' مي</div></div>' +
          '<div class="summary-box bg-[#2b1f17] border-amber-500"><div class="summary-label text-amber-300">الصافي</div><div id="sumNetVal" class="summary-val ' + (netToday < 0 ? 'text-red-400' : 'text-amber-400') + ' font-mono">' + fmt(netToday) + ' مي</div></div>' +
        '</div>' +
        '<div class="bg-[#2b1f17] border border-[#a87434]/50 rounded-2xl p-3 space-y-2.5 text-right">' +
          '<h2 class="text-[13px] font-extrabold text-[#d4af37] px-1">☕ اضغط على السلعة لتسجيل البيع</h2>' +
          '<div class="grid grid-cols-2 gap-2.5">' + productsGrid + '</div>' +
        '</div>' +
        '<div class="bg-[#2b1f17] border border-[#a87434]/50 rounded-2xl p-3 mt-3 space-y-2.5 text-right">' +
          '<button type="button" onclick="openDailyExpenseModal()" class="btn-tap w-full py-3 px-3 bg-[#1f1610] border border-[#d4af37] text-amber-200 rounded-xl text-[13px] font-extrabold flex items-center justify-center gap-2"><span>🧾 المواد اليومية (' + escapeHtmlLocal(sampleCons) + '...)</span></button>' +
          '<form novalidate onsubmit="event.preventDefault();addUnclassifiedExpenseInline();" class="flex gap-2 w-full">' +
            '<input id="unclassifiedExpInput" type="tel" inputmode="numeric" enterkeyhint="done" dir="ltr" maxlength="11" oninput="formatInputWithSpaces(this)" onkeydown="if(event.key===\'Enter\'||event.keyCode===13){event.preventDefault();addUnclassifiedExpenseInline();}" placeholder="مبلغ غير مصنف بالمليم..." class="num-input-ltr flex-1 bg-[#1f1610] border border-stone-600 rounded-xl p-2.5 text-amber-200 font-mono font-extrabold text-[13px] outline-none">' +
            '<button type="button" onclick="addUnclassifiedExpenseInline()" class="btn-tap px-5 py-2.5 bg-[#d4af37] text-stone-950 font-extrabold rounded-xl text-[13px] flex-shrink-0">إضافة</button>' +
          '</form>' +
          '<div id="expListBox">' + buildExpensesListInnerHtml() + '</div>' +
        '</div>' +
        '<div class="bg-[#2b1f17] border border-[#a87434]/50 rounded-2xl p-3 mt-3 space-y-2.5 text-right">' +
          '<div class="flex justify-between items-center"><h2 class="text-[13px] font-extrabold text-[#d4af37]">📋 مبيعات الوردية المسجلة (<span id="salesCountSpan">' + fmt(state.todaySales.length) + '</span>)</h2><span class="text-[10px] text-teal-300 font-extrabold">✓ جاهزة للإرسال</span></div>' +
          '<div id="salesListBox" class="space-y-2">' + buildSalesListInnerHtml() + '</div>' +
        '</div>' +
        '<button type="button" onclick="openCloseDayModal()" dir="rtl" class="btn-tap w-full py-3.5 mt-3.5 bg-[#d4af37] text-stone-950 font-extrabold rounded-xl text-[14px] block">📤 إرسال يومية (' + safeLtr(state.date) + ') إلى ' + escapeHtmlLocal(getOwnerName()) + '</button>';
    }

    function renderMainOnly() {
      var mainContainer = document.getElementById('main-view');
      if (!mainContainer || !state.cafeId) return;
      var savedScrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
      var valUnclassified = (document.getElementById('unclassifiedExpInput') || {}).value || '';
      var valInvQty = (document.getElementById('invQtyInput') || {}).value || '';
      var valInvCost = (document.getElementById('invCostInput') || {}).value || '';

      var statusBadge = state.isSyncingNow
        ? '<span id="workerStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-950 border border-amber-500 text-amber-200 font-extrabold whitespace-nowrap">⏳ تحديث</span>'
        : (state.isOnline
          ? '<span id="workerStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-green-950 border border-emerald-500 text-emerald-300 font-extrabold whitespace-nowrap">● متصل</span>'
          : '<span id="workerStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-950 border border-amber-500 text-amber-200 font-extrabold whitespace-nowrap">○ محلي</span>');

      var sentInvCount = (state.todayExpenses || []).filter(function(e) { return isStockInvoiceEntry(e); }).length;

      var header =
        '<header class="sticky top-0 z-20 bg-[#2b1f17] border-b border-[#a87434] px-3 py-2.5 text-right w-full">' +
          '<div class="flex items-center justify-between gap-2 max-w-lg mx-auto">' +
            '<div class="min-w-0">' +
              '<h1 class="text-[15px] font-extrabold text-[#d4af37] truncate">☕ ' + escapeHtmlLocal(getCafeName()) + ' — ' + escapeHtmlLocal(getWorkerName()) + '</h1>' +
              '<div class="text-[11px] text-stone-200 font-bold mt-0.5" dir="rtl"><b class="text-amber-300 text-[12px]">' + safeLtr(state.date) + '</b> • ' + getShiftLabel(getDefaultShiftForWorker()) + '</div>' +
            '</div>' +
            '<div class="flex items-center gap-1.5 flex-shrink-0">' +
              '<button type="button" onclick="manualRefreshWorkerCloud()" title="تحديث من السحابة" class="text-[11px] px-2 py-1 rounded-xl bg-[#1f1610] border border-stone-600 text-amber-200 font-extrabold whitespace-nowrap">🔄</button>' +
              '<button type="button" onclick="openSettlementModal()" class="text-[11px] px-2 py-1 rounded-xl bg-[#1f1610] border border-[#d4af37] text-[#d4af37] font-extrabold whitespace-nowrap">💰 التسوية</button>' +
              statusBadge +
              '<button type="button" onclick="logoutWorker()" title="خروج" class="text-[11px] px-2 py-1 rounded-xl bg-red-950 border border-red-600 text-red-200 font-extrabold whitespace-nowrap">خروج</button>' +
            '</div>' +
          '</div>' +
          '<div class="grid grid-cols-2 gap-2 max-w-lg mx-auto mt-2.5">' +
            '<button type="button" onclick="switchMainTab(\'daily\')" class="main-tab-btn ' + (state.activeTab === 'daily' ? 'tab-active-daily' : 'tab-inactive') + '"><span>☕ اليومية</span></button>' +
            '<button type="button" onclick="switchMainTab(\'invoices\')" class="main-tab-btn ' + (state.activeTab === 'invoices' ? 'tab-active-inv' : 'tab-inactive') + '"><span>📦 الفواتير' + (sentInvCount > 0 ? (' (' + fmt(sentInvCount) + ')') : '') + '</span></button>' +
          '</div>' +
        '</header>';

      var nextMainHtml = header + '<main class="p-2.5 max-w-lg mx-auto pb-8 text-right w-full">' +
        (state.activeTab === 'invoices' ? renderInvoicesTabContent() : renderDailyTabContent()) +
        '</main>';

      if (nextMainHtml !== lastRenderedMainHtml) {
        lastRenderedMainHtml = nextMainHtml;
        mainContainer.innerHTML = nextMainHtml;
        var newUnclassified = document.getElementById('unclassifiedExpInput');
        if (newUnclassified && valUnclassified) newUnclassified.value = valUnclassified;
        var newInvQty = document.getElementById('invQtyInput');
        if (newInvQty && valInvQty) { newInvQty.value = valInvQty; updateStockInvButtonsInPlace(true); }
        var newInvCost = document.getElementById('invCostInput');
        if (newInvCost && valInvCost) newInvCost.value = valInvCost;
        window.scrollTo(0, savedScrollY);
      }
    }

    function render() { renderMainOnly(); renderModalsOnly(); }
  </script>
</body>
</html>
