    function parseSignedNum(v) {

      var clean = String(v)
        .replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\u00A0]/g, '')
        .replace(/[٠-٩]/g, function(d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
        .replace(/[\u2212\u2013\u2014﹣－]/g, '-')

        .replace(/[^\d]/g, '');

      raw = raw.replace(/^0+(?=\d)/, '');

    function escapeHtmlLocal(s) {

    function _wrapTokensSafely(rawStr, tokenRegex) {

        out += '<span class="num-ltr" dir="ltr">' + escapeHtmlLocal(m[0]).replace(/\s+/g, '\u00A0') + '</span>';
        lastIndex = m.index + m[0].length;

      }
      var pf = parseNum(st.packSize) || 1;

    function buildWelcomeAlertMsg(statusLine) {
      var shiftBadge = getShiftLabel(getDefaultShiftForWorker());
      return '<span class="block bg-[#1f1610] border border-[#a87434] rounded-2xl p-3.5 text-[15px] text-amber-200 font-extrabold leading-relaxed">' +
        'مرحباً بك يا ' + escapeHtmlLocal(getWorkerName()) + ' في ' + escapeHtmlLocal(getCafeName()) + ' ☕🤝\n' +
        'ربي يعينك ويبارك في صحتك وفي رزقك، ويجعل يومك فاتحة خير وبركة وتوفيق.' +
        '<span class="block text-[13px] text-amber-300 mt-2.5 pt-2 border-t border-stone-700">📅 ' + safeLtr(state.date) + ' • ' + shiftBadge + '</span>' +
        (statusLine ? '<span class="block text-[12px] text-teal-200 mt-2 pt-2 border-t border-stone-700">' + statusLine + '</span>' : '') +
      '</span>';
    }

    function unlockWelcomeGate(btnText, statusLine) {
      if (startupHardTimerId) { clearTimeout(startupHardTimerId); startupHardTimerId = null; }
      if (state.customAlert && state.customAlert._isWelcome) {
        state.customAlert.title = '☕ نهارك زين يا ' + getWorkerName() + '!';
        state.customAlert.loading = false;
        state.customAlert.btnText = btnText || '✓ حسناً';
        state.customAlert.msg = buildWelcomeAlertMsg(statusLine || '');
        lastRenderedModalHtml = '';
        renderModalsOnly();
      }
    }

    function pingWorkerStatus() {
      if (!state.cafeId || !state.user || isReadOnly()) return;
      var nowMs = Date.now();
      var slot = state.workerSlot;
      var patch = {
        lastSeen: nowMs,
        openDate: state.date,
        uid: state.user.uid,
        slot: slot,
        workerName: getWorkerName()
      };
      patch['slots/' + slot] = {
        lastSeen: nowMs,
        openDate: state.date,
        uid: state.user.uid,
        name: getWorkerName()
      };
      db.ref('tenants/' + state.cafeId + '/live/worker_status').update(patch).catch(function() {});
    }

    // ===== الجلب الخفيف عند الفتح أو الضغط على 🔄 فقط (بدون مستمعات دائمة) =====
    function manualRefreshWorkerCloud() {
      if (state.isSendingToOwner) return;
      blurActiveInput();
      if (!navigator.onLine) return showToast('⚠️ الهاتف غير متصل بالإنترنت حالياً.', 'error', 'لا يوجد اتصال');
      pullLightStartupData(true);
    }

    function pullLightStartupData(isManual) {
      if (startupPullInFlight || state.isSendingToOwner || !state.cafeId) return;
      if (!navigator.onLine) {
        state.isSyncingNow = false;
        updateStatusBadgeDom();
        if (!isManual) unlockWelcomeGate('✓ متابعة بالوضع المحلي', '○ الهاتف بدون إنترنت — العمل على المسوّدة المحلية');
        return;
      }

      startupPullInFlight = true;
      state.isSyncingNow = true;
      if (isManual) updateStatusBadgeDom();

      if (!isManual) {
        if (startupHardTimerId) clearTimeout(startupHardTimerId);
        startupHardTimerId = setTimeout(function() {
          if (!startupPullInFlight) return;
          startupPullInFlight = false;
          state.isSyncingNow = false;
          updateStatusBadgeDom();
          lastRenderedMainHtml = '';
          renderMainOnly();
          unlockWelcomeGate('✓ متابعة بالوضع المحلي', '⚠️ الشبكة بطيئة حالياً — يمكنك العمل محلياً والإرسال لاحقاً');
        }, STARTUP_HARD_TIMEOUT_MS);
      }

      var base = 'tenants/' + state.cafeId;
      Promise.all([
        db.ref(base + '/meta').once('value'),
        db.ref(base + '/config').once('value'),
        db.ref(base + '/live/stock_state/stock').once('value'),
        db.ref(base + '/live/active_month').once('value'),
        db.ref(base + '/live/last_invoice_number').once('value'),
        db.ref(base + '/live/worker_commands').once('value')
      ]).then(function(snaps) {
        var meta = snaps[0].val();
        var cfg = snaps[1].val() || {};
        var stock = snaps[2].val() || {};
        var activeMk = snaps[3].val();
        var lastInvNum = snaps[4].val();
        var cmd = snaps[5].val();

        if (!meta || meta.active !== true) {
          startupPullInFlight = false;
          state.isSyncingNow = false;
          showBlockedScreen('حساب المقهى موقوف حالياً. تواصل مع صاحب المقهى.');
          return;
        }
        if (cfg.operationMode !== 'team') {
          startupPullInFlight = false;
          state.isSyncingNow = false;
          showBlockedScreen('هذا المقهى يعمل حالياً بدون تطبيق عامل (الكاسة عند المالك).');
          return;
        }

        state.meta = meta;
        state.config = cfg;

        if (!getMyWorkerConfig().active) {
          startupPullInFlight = false;
          state.isSyncingNow = false;
          showBlockedScreen('تم تعطيل وردية هذا العامل في إعدادات المقهى.');
          return;
        }

        if (cmd && cmd.clear_cache && parseNum(meta.subscriptionUntil) > Date.now()) {
          db.ref(base + '/live/worker_commands/clear_cache').remove().catch(function() {});
          db.ref(base + '/live/worker_commands/last_cleared').set(Date.now()).catch(function() {});
        }

        state.stockObj = stock;
        if (activeMk && isValidMonthKeyLocal(activeMk)) state.activeMonthKey = String(activeMk).trim();
        if (lastInvNum !== null && lastInvNum !== undefined) state.lastInvoiceNumber = parseNum(lastInvNum);
        state.selectedShift = getDefaultShiftForWorker();

        // تجهيز قائمة السلع المباعة
        var rawProds = cfg.products;
        var list = [];
        if (Array.isArray(rawProds)) {
          for (var i = 0; i < rawProds.length; i++) {
            var pa = rawProds[i];
            if (pa && pa.active !== false) list.push(pa);
          }
        } else if (rawProds && typeof rawProds === 'object') {
          Object.keys(rawProds).forEach(function(k) {
            var p = rawProds[k];
            if (p && p.active !== false) {
              list.push({
                id: p.id || k,
                name: p.name,
                category: p.category || 'hot',
                price: parseNum(p.price),
                unit: p.unit || '',
                stockItemId: p.stockItemId || '',
                stockDeduct: Number(p.stockDeduct) || 0,
                createdAt: p.createdAt || 0
              });
            }
          });
        }
        var catOrder = { hot: 1, cold: 2, food: 3, fun: 4 };
        list.sort(function(a, b) {
          return (catOrder[a.category] || 9) - (catOrder[b.category] || 9) || (a.createdAt || 0) - (b.createdAt || 0);
        });
        state.products = list;

        // قائمة السلع الاستهلاكية اليومية
        var cons = cfg.consumableQuickTags;
        state.consumables = (Array.isArray(cons) && cons.length > 0) ? cons.slice() : DEFAULT_CONSUMABLES.slice();
        if (state.consumables.indexOf(state.selectedDailyItem) === -1) {
          state.selectedDailyItem = state.consumables[0];
        }

        if (!isValidDateStr(state.date)) state.date = getLocalTodayDateStr();
        saveAccountingLocal();

        startupPullInFlight = false;
        state.isSyncingNow = false;
        if (startupHardTimerId) { clearTimeout(startupHardTimerId); startupHardTimerId = null; }

        lastRenderedMainHtml = '';
        renderMainOnly();
        updateStatusBadgeDom();
        pingWorkerStatus();

        if (isManual) {
          showToast('تم تحديث السلع والمخزون ورقم الفاتورة بنجاح ✅', 'success', 'تم التحديث');
        } else {
          unlockWelcomeGate('✓ حسناً', '✓ تم جلب وتحديث البيانات من السحابة');
        }
      }).catch(function() {
        startupPullInFlight = false;
        state.isSyncingNow = false;
        if (startupHardTimerId) { clearTimeout(startupHardTimerId); startupHardTimerId = null; }
        updateStatusBadgeDom();
        lastRenderedMainHtml = '';
        renderMainOnly();
        if (isManual) {
          showToast('⚠️ تعذّر الاتصال بالسحابة حالياً، تحقق من الإنترنت.', 'error', 'تعذّر التحديث');
        } else {
          unlockWelcomeGate('✓ متابعة بالوضع المحلي', '⚠️ تعذّر التحديث الآن — يمكنك العمل محلياً');
        }
      });
    }

    window.addEventListener('online', function() { state.isOnline = true; updateStatusBadgeDom(); });
    window.addEventListener('offline', function() { state.isOnline = false; updateStatusBadgeDom(); });

    // ===== التبويبان والتنقل =====
    function switchMainTab(targetTab) {
      if (state.activeTab === targetTab) return;
      blurActiveInput();
      if (state.activeTab === 'invoices') {
        if (state.stockInvStep === 'input') {
          saveCurrentStockQtyToDraft();
        } else if (state.stockInvStep === 'preview') {
          var costInp = document.getElementById('invCostInput');
          if (costInp) { state.stockInvTotalCost = parseNum(costInp.value); saveInvoiceDraftLocal(); }
        }
      }
      tabScrollPositions[state.activeTab] = window.scrollY || window.pageYOffset || 0;
      state.activeTab = targetTab;

      if (targetTab === 'invoices') {
        var stList = getStockItemsList();
        if (!state.stockInvItemId || !state.stockObj[state.stockInvItemId]) {
          state.stockInvItemId = stList.length > 0 ? stList[0].id : null;
        }
        renderMainOnly();
        window.scrollTo(0, 0);
      } else {
        renderMainOnly();
        window.scrollTo(0, tabScrollPositions.daily || 0);
      }
    }

    function requestCancelStockInvoice() {
      blurActiveInput();
      var qtyInp = document.getElementById('invQtyInput');
      var costInp = document.getElementById('invCostInput');
      var hasUnsent = (state.stockInvDraftItems && state.stockInvDraftItems.length > 0) ||
        (qtyInp && parseNum(qtyInp.value) > 0) ||
        (costInp && parseNum(costInp.value) > 0);
      if (hasUnsent) {
        showConfirmModal(
          'إلغاء مسوّدة الفاتورة 🗑️',
          'هل تريد إلغاء ومسح البضاعة المسجّلة في هذه الفاتورة والرجوع لليومية؟',
          function() {
            renderModalsOnly();
            cancelStockInvoiceAndGoDaily();
          },
          '🗑️'
        );
        return;
      }
      cancelStockInvoiceAndGoDaily();
    }

    function cancelStockInvoiceAndGoDaily() {
      blurActiveInput();
      clearInvoiceDraftLocal();
      tabScrollPositions.invoices = 0;
      state.activeTab = 'daily';
      lastRenderedMainHtml = '';
      renderMainOnly();
      window.scrollTo(0, tabScrollPositions.daily || 0);
    }

    // ===== التحديثات الجزئية السريعة =====
    function updateStatusBadgeDom() {
      var el = document.getElementById('workerStatusBadge');
      if (!el) return;
      if (state.isSyncingNow) {
        el.className = 'text-[10px] px-2 py-0.5 rounded-full bg-amber-950 border border-amber-500 text-amber-200 font-extrabold whitespace-nowrap';
        el.textContent = '⏳ تحديث';
      } else if (state.isOnline) {
        el.className = 'text-[10px] px-2 py-0.5 rounded-full bg-green-950 border border-emerald-500 text-emerald-300 font-extrabold whitespace-nowrap';
        el.textContent = '● متصل';
      } else {
        el.className = 'text-[10px] px-2 py-0.5 rounded-full bg-amber-950 border border-amber-500 text-amber-200 font-extrabold whitespace-nowrap';
        el.textContent = '○ محلي';
      }
    }

    function updateDailySummaryDom() {
      var revEl = document.getElementById('sumRevVal');
      var outEl = document.getElementById('sumOutVal');
      var netEl = document.getElementById('sumNetVal');
      if (!revEl || !outEl || !netEl) return false;
      var totalRev = 0, expSum = 0, i;
      for (i = 0; i < state.todaySales.length; i++) { if (state.todaySales[i]) totalRev += parseNum(state.todaySales[i].amount); }
      for (i = 0; i < state.todayExpenses.length; i++) { if (state.todayExpenses[i]) expSum += getExpAmt(state.todayExpenses[i]); }
      var totalOut = expSum + getDailyWage();
      var netToday = totalRev - totalOut;
      revEl.innerHTML = fmt(totalRev) + ' مي';
      outEl.innerHTML = fmt(totalOut) + ' مي';
      netEl.className = 'summary-val ' + (netToday < 0 ? 'text-red-400' : 'text-amber-400') + ' font-mono';
      netEl.innerHTML = fmt(netToday) + ' مي';
      return true;
    }

    function getCatClass(c) { return c === 'hot' ? 'cat-hot' : (c === 'cold' ? 'cat-cold' : (c === 'food' ? 'cat-food' : 'cat-fun')); }

    function getStockStatusFooter(p, usedMap) {
      if (!isProductStockLinked(p)) {
        return '<div class="prod-footer bg-black/60 text-stone-200">تحضير مباشر</div>';
      }
      var st = state.stockObj[p.stockItemId];
      var used = (usedMap && usedMap[p.stockItemId]) ? usedMap[p.stockItemId] : 0;
      var avail = Math.max(0, Math.round((Number(st.qty) || 0) - used));
      var limit = st.unit === 'g' ? getLowWeightLimit() : getLowUnitLimit();
      var unitTxt = st.unit === 'g' ? 'غرام' : 'وحدة';
      if (avail <= 0) {
        return '<div class="prod-footer bg-red-950 border border-red-600 text-red-200"><span>⚠️ نفد</span> <span class="stock-num-pill-zero font-mono">' + fmt(0) + '</span></div>';
      }
      if (avail <= limit) {
        return '<div class="prod-footer bg-amber-950 border border-amber-500 text-amber-200"><span>⚠️ منخفض:</span> <span class="stock-num-pill-low font-mono">' + fmt(avail) + '</span></div>';
      }
      return '<div class="prod-footer bg-black/60 text-stone-200"><span>المخزون:</span> <span class="stock-num-pill font-mono">' + fmt(avail) + '</span> <span>' + unitTxt + '</span></div>';
    }

    function buildSingleProductCardInnerHtml(p, soldItem, usedMap) {
      var unitSafe = escapeHtmlLocal(getProductSaleUnit(p));
      var middleBadge = soldItem
        ? '<div class="prod-sold-badge font-mono">✓ مسجل: ' + fmt(soldItem.qty) + ' ' + unitSafe + '</div>'
        : '<div class="prod-price font-mono">' + fmt(p.price) + ' مي / ' + unitSafe + '</div>';
      return '<div class="prod-title">' + formatMixedRtlText(p.name) + '</div>' + middleBadge + getStockStatusFooter(p, usedMap);
    }

    function updateAffectedProductCardsDom(prodId) {
      var p = state.products.find(function(x) { return x.id === prodId; });
      if (!p) return false;
      var usedMap = getTodayStockUsedMap();
      var targetIds = [prodId];
      if (p.stockItemId) {
        for (var i = 0; i < state.products.length; i++) {
          if (state.products[i].stockItemId === p.stockItemId && targetIds.indexOf(state.products[i].id) === -1) {
            targetIds.push(state.products[i].id);
          }
        }
      }
      for (var j = 0; j < targetIds.length; j++) {
        var pid = targetIds[j];
        var prodObj = state.products.find(function(x) { return x.id === pid; });
        var btn = document.getElementById('prod-card-' + toSafeKey(pid));
        if (!btn || !prodObj) return false;
        var soldItem = state.todaySales.find(function(s) { return s && s.id === pid; });
        btn.className = 'prod-card ' + getCatClass(prodObj.category) + (soldItem ? ' prod-registered' : '');
        btn.innerHTML = buildSingleProductCardInnerHtml(prodObj, soldItem, usedMap);
      }
      return true;
    }

    function buildSalesListInnerHtml() {
      if (!state.todaySales || state.todaySales.length === 0) {
        return '<p class="text-[11px] text-stone-300 text-center py-1 font-bold">لم يتم تسجيل مبيعات بعد</p>';
      }
      return state.todaySales.map(function(s, idx) {
        return '<div class="flex justify-between items-center bg-[#1f1610] p-2.5 rounded-xl border border-stone-700 text-[12px] gap-2" dir="rtl">' +
          '<div class="truncate"><span class="font-extrabold text-amber-200 text-[13px]">' + formatMixedRtlText(s.name) + '</span> <span class="text-stone-200 font-mono font-extrabold text-[11px]">(' + fmt(s.qty) + ' ' + escapeHtmlLocal(s.unit || '') + ')</span></div>' +
          '<div class="flex items-center gap-2 font-mono flex-shrink-0">' +
            '<span class="text-green-400 font-extrabold text-[13px]">' + fmt(s.amount) + ' مي</span>' +
            '<button type="button" onclick="deleteSaleItem(' + idx + ')" class="text-red-200 bg-red-950 border border-red-600 px-3 py-1 rounded-lg text-[11px] font-sans font-extrabold">حذف</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    function updateSalesListDom() {
      var box = document.getElementById('salesListBox');
      var cnt = document.getElementById('salesCountSpan');
      if (!box) return false;
      box.innerHTML = buildSalesListInnerHtml();
      if (cnt) cnt.innerHTML = fmt(state.todaySales.length);
      return true;
    }

    function buildExpensesListInnerHtml() {
      var rows = [];
      for (var j = 0; j < state.todayExpenses.length; j++) {
        var e = state.todayExpenses[j];
        if (!e) continue;
        var val = getExpAmt(e);
        if (isStockInvoiceEntry(e)) {
          rows.push(
            '<div class="flex justify-between items-center bg-[#1f1610] p-2.5 rounded-xl border border-teal-500 text-[12px] gap-2" dir="rtl">' +
              '<div class="text-right font-extrabold text-amber-200 text-[13px] truncate">فاتورة عدد ' + fmt(parseNum(e.invoiceNumber) || 1) + '</div>' +
              '<div class="flex items-center gap-2 flex-shrink-0"><span class="font-mono text-red-400 font-extrabold text-[13px]">' + fmt(val) + ' مي</span></div>' +
            '</div>'
          );
        } else {
          rows.push(
            '<div class="flex justify-between items-center bg-[#1f1610] p-2.5 rounded-xl border border-stone-700 text-[12px] gap-2" dir="rtl">' +
              '<div class="text-right font-extrabold text-amber-200 text-[13px] truncate">' + getExpLabelHtml(e) + '</div>' +
              '<div class="flex items-center gap-2 flex-shrink-0">' +
                '<span class="font-mono text-red-400 font-extrabold text-[13px]">' + fmt(val) + ' مي</span>' +
                '<button type="button" onclick="deleteExpense(' + j + ')" class="text-red-200 bg-red-950 border border-red-600 px-3 py-1 rounded-lg text-[11px] font-extrabold">حذف</button>' +
              '</div>' +
            '</div>'
          );
        }
      }
      return rows.length === 0
        ? '<p class="text-[11px] text-stone-300 text-center py-1 font-bold">لا توجد مصاريف يومية مسجلة اليوم</p>'
        : '<div class="space-y-2 pt-0.5">' + rows.join('') + '</div>';
    }
    function updateExpensesListDom() {
      var box = document.getElementById('expListBox');
      if (!box) return false;
      box.innerHTML = buildExpensesListInnerHtml();
      return true;
    }

    // ============ نافذة المبيعات ============
    function openSaleModal(id) {
      blurActiveInput();
      state.activeProduct = state.products.find(function(x) { return x.id === id; }) || null;
      renderModalsOnly();
    }
    function closeSaleModal() {
      blurActiveInput();
      state.activeProduct = null;
      renderModalsOnly();
    }
    function onSaleQtyInput(el) {
      formatInputWithSpaces(el);
      var p = state.activeProduct, preview = document.getElementById('saleTotalPreview');
      if (p && preview) preview.innerHTML = fmt(parseNum(el ? el.value : 0) * parseNum(p.price)) + ' مي';
    }
    function confirmSale() {
      var p = state.activeProduct;
      if (!p) return;
      var inp = document.getElementById('saleQtyInput');
      var newQty = parseNum(inp ? inp.value : 0);
      if (newQty <= 0) return showToast('يرجى إدخال الكمية أو الوزن الصحيح', 'error');
      if (isDoubleTapBlocked()) return;

      blurActiveInput();
      var unitName = getProductSaleUnit(p);
      var existing = state.todaySales.find(function(s) { return s.id === p.id; });
      var amt = newQty * parseNum(p.price);
      if (existing) {
        existing.qty = newQty;
        existing.amount = amt;
        existing.unit = unitName;
      } else {
        state.todaySales.push({ id: p.id, name: p.name, category: p.category || 'hot', qty: newQty, unit: unitName, unitPrice: parseNum(p.price), amount: amt });
      }

      var prodId = p.id;
      state.activeProduct = null;
      saveSalesLocalOnly();
      renderModalsOnly();
      if (!updateAffectedProductCardsDom(prodId) || !updateDailySummaryDom() || !updateSalesListDom()) {
        lastRenderedMainHtml = '';
        renderMainOnly();
      }
    }
    function deleteSaleItem(idx) {
      var s = state.todaySales[idx];
      if (!s) return;
      var prodId = s.id;
      showConfirmModal('حذف من مبيعات اليوم 🗑️', 'هل تريد حذف (' + s.name + ' - ' + fmtPlain(s.qty) + ' ' + (s.unit || '') + ') من قائمة اليوم؟', function() {
        state.todaySales.splice(idx, 1);
        saveSalesLocalOnly();
        renderModalsOnly();
        if (!updateAffectedProductCardsDom(prodId) || !updateDailySummaryDom() || !updateSalesListDom()) {
          lastRenderedMainHtml = '';
          renderMainOnly();
        }
      }, '🗑️');
    }
    function renderSaleModal() {
      var p = state.activeProduct;
      if (!p) return '';
      var existing = state.todaySales.find(function(s) { return s.id === p.id; });
      var unitSafe = escapeHtmlLocal(getProductSaleUnit(p));
      var replaceNotice = existing
        ? '<div class="bg-amber-950 border border-amber-500 rounded-xl p-2.5 text-[11px] text-amber-200 font-bold">المسجل حالياً: <span class="font-mono text-amber-300 text-[12px] font-extrabold">' + fmt(existing.qty) + ' ' + unitSafe + '</span><br><span class="text-[10px] text-stone-200">اكتب الكمية الجديدة لتعويضها</span></div>'
        : '';
      var label = isProductSoldByWeight(p)
        ? ('أدخل الوزن بالغرام (مثلاً ' + fmt(500) + '):')
        : ('أدخل العدد المباع (' + unitSafe + '):');

      return '<div class="karawan-modal-overlay"><div class="karawan-modal-box text-center space-y-3">' +
        '<h3 class="text-[16px] font-extrabold text-[#d4af37]">☕ ' + formatMixedRtlText(p.name) + '</h3>' +
        '<div class="text-[12px] text-stone-200 font-bold">سعر الوحدة: <b class="text-amber-300 font-mono text-[13px]">' + fmt(p.price) + ' مي</b> لكل ' + unitSafe + '</div>' +
        replaceNotice +
        '<form novalidate onsubmit="event.preventDefault();confirmSale();" class="space-y-3 text-right">' +
          '<div><label class="text-[12px] text-amber-200 block mb-1 font-extrabold">' + label + '</label>' +
          '<input id="saleQtyInput" type="tel" inputmode="numeric" enterkeyhint="done" dir="ltr" maxlength="11" value="" oninput="onSaleQtyInput(this)" onkeydown="if(event.key===\'Enter\'||event.keyCode===13){event.preventDefault();confirmSale();}" placeholder="0" class="num-input-ltr modal-big-input font-mono font-extrabold bg-[#1f1610] border-2 border-[#d4af37] rounded-xl p-2.5 text-amber-200 outline-none"></div>' +
          '<div class="bg-[#1f1610] border border-stone-700 rounded-xl py-2.5 px-3 flex justify-between items-center text-[12px]"><span class="text-stone-200 font-bold">المبلغ الجملي:</span><b id="saleTotalPreview" class="text-green-400 font-mono text-[14px] font-extrabold">' + fmt(existing ? existing.amount : 0) + ' مي</b></div>' +
          '<div class="flex gap-2 pt-1"><button type="button" onclick="confirmSale()" class="btn-tap flex-1 py-3 bg-[#d4af37] text-stone-950 font-extrabold rounded-xl text-[14px]">✓ ' + (existing ? 'تحديث' : 'إضافة') + '</button><button type="button" onclick="closeSaleModal()" class="btn-tap px-4 py-3 bg-stone-800 border border-stone-600 text-stone-200 font-bold rounded-xl text-[14px]">إلغاء</button></div>' +
        '</form></div></div>';

    // ============ نافذة المواد اليومية (أزرار داكنة — بدون نوافذ بيضاء) ============
    function getRecordedDailyNamedExpenses() {
      return (state.todayExpenses || []).filter(function(e) {
        return e && !isStockInvoiceEntry(e) && state.consumables.indexOf(getExpLabelPlain(e)) !== -1;
      });
    }
    function hasAnyDailyNamedExpense() { return getRecordedDailyNamedExpenses().length > 0; }
    function hasDailyItemsOrTypedAmt() {
      if (hasAnyDailyNamedExpense()) return true;
      var amtInp = document.getElementById('dailyExpCostInput');
      return !!(amtInp && parseNum(amtInp.value) > 0);
    }
    function buildDailyExpenseButtonsHtml() {
      var activeItem = state.selectedDailyItem || state.consumables[0];
      return state.consumables.map(function(item, idx) {
        var isSel = (item === activeItem);
        var isLastOdd = (state.consumables.length % 2 === 1) && (idx === state.consumables.length - 1);
        var existingEntry = state.todayExpenses.find(function(e) { return e && !isStockInvoiceEntry(e) && getExpLabelPlain(e) === item; });
        var recordedAmt = existingEntry ? getExpAmt(existingEntry) : 0;
        var badge = recordedAmt > 0
          ? '<div class="text-[10px] font-mono mt-0.5 ' + (isSel ? 'text-stone-950 font-extrabold' : 'text-emerald-300') + '">✓ ' + fmt(recordedAmt) + '</div>'
          : '';
        var cls = (isSel
          ? 'p-2.5 rounded-xl border-2 border-[#d4af37] bg-[#d4af37] text-stone-950 font-extrabold text-[13px] text-center'
          : 'p-2.5 rounded-xl border border-stone-700 bg-[#1f1610] text-amber-200 font-bold text-[13px] text-center') + (isLastOdd ? ' col-span-2' : '');
        return '<button type="button" onclick="selectDailyExpenseButton(\'' + escapeAttr(item) + '\')" class="' + cls + '">' + escapeHtmlLocal(item) + badge + '</button>';
      }).join('');
    }
    function buildDailyModalSummaryHtml() {
      var fbHtml = state.dailyModalFeedback
        ? '<div class="bg-emerald-950 border border-emerald-500 text-emerald-200 text-[11px] font-extrabold py-2 px-2.5 rounded-xl text-center">' + state.dailyModalFeedback + '</div>'
        : '';
      var recordedList = getRecordedDailyNamedExpenses();
      if (recordedList.length === 0) return fbHtml;
      var rowsHtml = recordedList.map(function(e) {
        var lbl = getExpLabelPlain(e);
        return '<div class="flex justify-between items-center bg-[#1f1610] px-2.5 py-2 rounded-xl border border-teal-500 text-[12px] gap-2">' +
          '<div class="truncate"><span class="font-extrabold text-amber-200">' + formatMixedRtlText(lbl) + ':</span> <b class="text-teal-300 font-mono">' + fmt(getExpAmt(e)) + ' مي</b></div>' +
          '<button type="button" onclick="removeDailyExpenseFromModal(\'' + escapeAttr(lbl) + '\')" class="text-red-200 bg-red-950 border border-red-600 px-2.5 py-1 rounded-lg text-[11px] font-extrabold flex-shrink-0">حذف</button>' +
        '</div>';
      }).join('');
      return '<div class="space-y-2">' + fbHtml + '<div class="space-y-1.5"><div class="text-[11px] font-extrabold text-teal-300">🧾 المواد المضافة (' + fmt(recordedList.length) + '):</div>' + rowsHtml + '</div></div>';
    }
    function getDailyCloseButtonClass(isActive) {
      return isActive
        ? 'btn-tap flex-1 py-3 bg-teal-600 border border-teal-500 text-white font-extrabold rounded-xl text-[13px]'
        : 'btn-tap flex-1 py-3 bg-stone-800 border border-stone-600 text-stone-200 font-bold rounded-xl text-[13px]';
    }
    function updateDailyCloseButtonInPlace(force) {
      var isActive = hasDailyItemsOrTypedAmt();
      if (!force && _lastDailyCloseBtnActive === isActive) return;
      _lastDailyCloseBtnActive = isActive;
      var closeBtn = document.getElementById('dailyExpCloseBtn');
      if (closeBtn) { closeBtn.textContent = isActive ? '✓ اضغط للمتابعة' : 'إلغاء'; closeBtn.className = getDailyCloseButtonClass(isActive); }
    }
    function onDailyExpCostInput(el) { formatInputWithSpaces(el); updateDailyCloseButtonInPlace(false); }

    function saveCurrentDailyExpenseInputIfTyped() {
      var amtInp = document.getElementById('dailyExpCostInput');
      if (!amtInp || amtInp.value.trim() === '') return false;
      var v = parseNum(amtInp.value);
      var itemLabel = state.selectedDailyItem || state.consumables[0];
      if (v <= 0) { amtInp.value = ''; return false; }

      var nowTs = Date.now(), nowHHMM = getCurrentTimeHHMM(nowTs), existingIndices = [];
      state.todayExpenses.forEach(function(e, idx) {
        if (e && !isStockInvoiceEntry(e) && getExpLabelPlain(e) === itemLabel) existingIndices.push(idx);
      });
      if (existingIndices.length > 0) {
        var firstIdx = existingIndices[0];
        state.todayExpenses[firstIdx].label = itemLabel;
        state.todayExpenses[firstIdx].amount = v;
        state.todayExpenses[firstIdx].time = nowHHMM;
        for (var i = existingIndices.length - 1; i >= 1; i--) state.todayExpenses.splice(existingIndices[i], 1);
      } else {
        state.todayExpenses.push({
          id: 'exp_' + nowTs + '_' + Math.floor(Math.random() * 1000),
          label: itemLabel,
          time: nowHHMM,
          amount: v,
          isStockInvoice: false,
          lockedSent: false
        });
      }
      amtInp.value = '';
      saveExpensesLocalOnly();
      _dailyExpensesChanged = true;
      return true;
    }

    function removeDailyExpenseFromModal(itemName) {
      blurActiveInput();
      state.todayExpenses = (state.todayExpenses || []).filter(function(e) {
        return !(e && !isStockInvoiceEntry(e) && getExpLabelPlain(e) === itemName);
      });
      state.dailyModalFeedback = '🗑️ تم حذف (' + escapeHtmlLocal(itemName) + ')';
      saveExpensesLocalOnly();
      _dailyExpensesChanged = true;
      updateDailyModalInPlace();
    }
    function updateDailyModalInPlace() {
      var gridEl = document.getElementById('dailyExpButtonsGrid');
      var labelEl = document.getElementById('dailyExpInputLabel');
      var fbEl = document.getElementById('dailyExpFeedbackBox');
      var amtInp = document.getElementById('dailyExpCostInput');
      var activeItem = state.selectedDailyItem || state.consumables[0];
      if (amtInp) amtInp.value = '';
      if (gridEl) gridEl.innerHTML = buildDailyExpenseButtonsHtml();
      if (labelEl) labelEl.innerHTML = 'الثمن بالمليم (' + escapeHtmlLocal(activeItem) + '):';
      if (fbEl) fbEl.innerHTML = buildDailyModalSummaryHtml();
      updateDailyCloseButtonInPlace(true);
    }
    function openDailyExpenseModal() {
      blurActiveInput();
      state.selectedDailyItem = state.consumables[0];
      state.dailyModalFeedback = '';
      state.showDailyExpenseModal = true;
      _dailyExpensesChanged = false;
      _lastDailyCloseBtnActive = null;
      renderModalsOnly();
    }
    function syncDailyExpensesToMainDomIfChanged() {
      if (!_dailyExpensesChanged) return;
      _dailyExpensesChanged = false;
      if (!updateDailySummaryDom() || !updateExpensesListDom()) { lastRenderedMainHtml = ''; renderMainOnly(); }
    }
    function cancelDailyExpenseModal() {
      blurActiveInput();
      state.showDailyExpenseModal = false;
      state.dailyModalFeedback = '';
      _lastDailyCloseBtnActive = null;
      renderModalsOnly();
      syncDailyExpensesToMainDomIfChanged();
    }
    function onDailySecondButtonClick() {
      blurActiveInput();
      saveCurrentDailyExpenseInputIfTyped();
      state.showDailyExpenseModal = false;
      state.dailyModalFeedback = '';
      _lastDailyCloseBtnActive = null;
      renderModalsOnly();
      syncDailyExpensesToMainDomIfChanged();
    }
    function selectDailyExpenseButton(itemName) {
      blurActiveInput();
      var autoSaved = saveCurrentDailyExpenseInputIfTyped();
      state.selectedDailyItem = itemName;
      state.dailyModalFeedback = autoSaved ? '✓ تم حفظ المبلغ تلقائياً' : '';
      if (document.getElementById('dailyExpCostInput')) updateDailyModalInPlace(); else renderModalsOnly();
    }
    function submitDailyExpenseItem() {
      blurActiveInput();
      var itemLabel = state.selectedDailyItem || state.consumables[0];
      var wasExisting = state.todayExpenses.some(function(e) { return e && !isStockInvoiceEntry(e) && getExpLabelPlain(e) === itemLabel; });
      if (!saveCurrentDailyExpenseInputIfTyped()) {
        state.dailyModalFeedback = '⚠️ يرجى كتابة ثمن (' + escapeHtmlLocal(itemLabel) + ') أولاً';
        updateDailyModalInPlace();
        return;
      }
      var updatedEntry = state.todayExpenses.find(function(e) { return e && !isStockInvoiceEntry(e) && getExpLabelPlain(e) === itemLabel; });
      var v = updatedEntry ? getExpAmt(updatedEntry) : 0;
      state.dailyModalFeedback = wasExisting
        ? ('✓ تم تعويض ثمن ' + escapeHtmlLocal(itemLabel) + ' بـ (' + fmt(v) + ' مي)')
        : ('✓ تمت إضافة ' + escapeHtmlLocal(itemLabel) + ' (' + fmt(v) + ' مي)');
      updateDailyModalInPlace();
    }
    function renderDailyExpenseModal() {
      if (!state.showDailyExpenseModal) return '';
      var activeItem = state.selectedDailyItem || state.consumables[0];
      var isCloseActive = hasAnyDailyNamedExpense();
      _lastDailyCloseBtnActive = isCloseActive;
      return '<div class="karawan-modal-overlay"><div class="karawan-modal-box text-right space-y-3">' +
        '<div class="modal-header-row"><h3 class="text-[15px] font-extrabold text-[#d4af37] text-center">🧾 المواد اليومية</h3><button type="button" onclick="cancelDailyExpenseModal()" class="modal-close-x-btn">✕</button></div>' +
        '<form novalidate onsubmit="event.preventDefault();submitDailyExpenseItem();" class="space-y-3">' +
          '<div id="dailyExpButtonsGrid" class="grid grid-cols-2 gap-2">' + buildDailyExpenseButtonsHtml() + '</div>' +
          '<div id="dailyExpFeedbackBox">' + buildDailyModalSummaryHtml() + '</div>' +
          '<div><label id="dailyExpInputLabel" class="text-[12px] text-amber-200 block mb-1 font-extrabold">الثمن بالمليم (' + escapeHtmlLocal(activeItem) + '):</label>' +
          '<input id="dailyExpCostInput" type="tel" inputmode="numeric" enterkeyhint="done" dir="ltr" maxlength="11" value="" oninput="onDailyExpCostInput(this)" onkeydown="if(event.key===\'Enter\'||event.keyCode===13){event.preventDefault();submitDailyExpenseItem();}" placeholder="0" class="num-input-ltr modal-big-input bg-[#1f1610] border-2 border-[#d4af37] rounded-xl p-2.5 text-green-400 font-mono font-extrabold outline-none"></div>' +
          '<div class="flex gap-2 pt-1"><button type="button" onclick="submitDailyExpenseItem()" class="btn-tap flex-1 py-3 bg-[#d4af37] text-stone-950 font-extrabold rounded-xl text-[14px]">➕ إضافة</button><button id="dailyExpCloseBtn" type="button" onclick="onDailySecondButtonClick()" class="' + getDailyCloseButtonClass(isCloseActive) + '">' + (isCloseActive ? '✓ اضغط للمتابعة' : 'إلغاء') + '</button></div>' +
        '</form></div></div>';
    }

    // ============ المبلغ غير المصنف ============
    function addUnclassifiedExpenseInline() {
      var inp = document.getElementById('unclassifiedExpInput');
      var v = parseNum(inp ? inp.value : 0);
      if (v <= 0) return showToast('يرجى إدخال المبلغ غير المصنف بالمليم أولاً', 'error');
      if (isDoubleTapBlocked()) return;
      blurActiveInput();
      var nowTs = Date.now();
      state.todayExpenses.push({
        id: 'exp_' + nowTs + '_' + Math.floor(Math.random() * 1000),
        label: 'مصروف غير مصنف',
        time: getCurrentTimeHHMM(nowTs),
        amount: v,
        isStockInvoice: false,
        lockedSent: false
      });
      if (inp) inp.value = '';
      saveExpensesLocalOnly();
      if (!updateDailySummaryDom() || !updateExpensesListDom()) { lastRenderedMainHtml = ''; renderMainOnly(); }
    }
    function deleteExpense(idx) {
      var e = state.todayExpenses[idx];
      if (!e) return;
      if (e.lockedSent || isStockInvoiceEntry(e)) {
        return showToast('🔒 هذه الفاتورة أُرسلت إلى ' + getOwnerName() + '، ولا يمكن محوها إلا من الإدارة.', 'error', 'فاتورة محمية');
      }
      showConfirmModal('حذف المصروف 🗑️', 'هل تريد حذف (' + getExpLabelPlain(e) + ' - ' + fmtPlain(getExpAmt(e)) + ' مي)؟', function() {
        state.todayExpenses.splice(idx, 1);
        saveExpensesLocalOnly();
        renderModalsOnly();
        if (!updateDailySummaryDom() || !updateExpensesListDom()) { lastRenderedMainHtml = ''; renderMainOnly(); }
      }, '🗑️');
    }

    // ============ تبويب الفواتير (مرحلتان بأزرار مواد المخزن — بدون select) ============
    function getStockItemsList() {
      var obj = state.stockObj || {};
      return Object.keys(obj).map(function(id) {
        var st = obj[id];
        return {
          id: id,
          name: st.name,
          unit: st.unit || 'unit',
          packSize: Number(st.packSize) || (st.unit === 'g' ? 1000 : 1),
          packLabel: st.packLabel || '',
          qty: Number(st.qty) || 0,
          createdAt: st.createdAt || 0
        };
      }).sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    }
    function getCurrentStockInvItem() {
      var list = getStockItemsList();
      if (list.length === 0) return null;
      if (!state.stockInvItemId || !state.stockObj[state.stockInvItemId]) state.stockInvItemId = list[0].id;
      return list.find(function(x) { return x.id === state.stockInvItemId; }) || list[0];
    }
    function buildStockInvProdButtonsHtml() {
      var list = getStockItemsList(), currentSt = getCurrentStockInvItem();
      return list.map(function(st) {
        var isSel = (currentSt && st.id === currentSt.id);
        var draftIt = state.stockInvDraftItems.find(function(it) { return it.itemId === st.id; });
        var badge = draftIt
          ? '<div class="text-[10px] font-mono mt-0.5 ' + (isSel ? 'text-stone-950 font-extrabold' : 'text-teal-300') + '">✓ ' + fmt(draftIt.packQty) + '</div>'
          : '';
        var cls = isSel
          ? 'p-2.5 rounded-xl border-2 border-[#d4af37] bg-[#d4af37] text-stone-950 font-extrabold text-[13px] text-center'
          : 'p-2.5 rounded-xl border border-stone-700 bg-[#1f1610] text-amber-200 font-bold text-[13px] text-center';
        return '<button type="button" onclick="selectStockInvItem(\'' + escapeAttr(st.id) + '\')" class="' + cls + '">' + formatMixedRtlText(st.name) + badge + '</button>';
      }).join('');
    }
    function hasStockInvItemsOrTypedQty() {
      if (state.stockInvDraftItems.length > 0) return true;
      var qtyInp = document.getElementById('invQtyInput');
      return !!(qtyInp && parseNum(qtyInp.value) > 0);
    }
    function getStockInvSecondBtnClass(hasItems) {
      return hasItems
        ? 'btn-tap w-full py-3 bg-teal-600 border border-teal-500 text-white font-extrabold rounded-xl text-[13px]'
        : 'btn-tap w-full py-3 bg-stone-800 border border-stone-600 text-stone-200 font-bold rounded-xl text-[13px]';
    }
    function updateStockInvConversionPreview() {
      var box = document.getElementById('stockInvConvPreview'), qtyInp = document.getElementById('invQtyInput'), st = getCurrentStockInvItem();
      if (!box || !st) return;
      var q = qtyInp ? parseNum(qtyInp.value) : 0;
      if (q <= 0) { box.innerHTML = ''; return; }
      var rule = getStockPurchaseRule(st);
      var totalUnits = (st.unit === 'g' && rule.factor === 1000 && q > COFFEE_DIRECT_GRAMS_THRESHOLD) ? q : (q * rule.factor);
      var unitTxt = st.unit === 'g' ? 'غرام' : 'وحدة';
      box.innerHTML = '📦 سيُضاف للمخزون: ' + fmt(totalUnits) + ' ' + unitTxt;
    }
    function updateStockInvButtonsInPlace(force) {
      var hasItems = hasStockInvItemsOrTypedQty();
      if (force || _lastInvSecondBtnActive !== hasItems) {
        _lastInvSecondBtnActive = hasItems;
        var secondBtn = document.getElementById('stockInvSecondBtn');
        if (secondBtn) { secondBtn.className = getStockInvSecondBtnClass(hasItems); secondBtn.textContent = hasItems ? '✓ اضغط للمتابعة' : 'إلغاء'; }
      }
      updateStockInvConversionPreview();
    }
    function onInvQtyInput(el) { formatInputWithSpaces(el); updateStockInvButtonsInPlace(false); }
    function onStockInvSecondButtonClick() {
      blurActiveInput();
      var qtyInp = document.getElementById('invQtyInput');
      if (qtyInp && qtyInp.value.trim() !== '') saveCurrentStockQtyToDraft();
      if (state.stockInvDraftItems.length > 0) proceedToStockInvoiceStep2();
      else cancelStockInvoiceAndGoDaily();
    }
    function removeStockInvDraftItem(itemId) {
      blurActiveInput();
      var idx = state.stockInvDraftItems.findIndex(function(it) { return it.itemId === itemId; });
      if (idx === -1) return;
      var removedName = state.stockInvDraftItems[idx].name;
      state.stockInvDraftItems.splice(idx, 1);
      saveInvoiceDraftLocal();

      if (state.stockInvStep === 'preview') {
        if (state.stockInvDraftItems.length === 0) {
          state.stockInvStep = 'input';
          state.stockInvFeedback = 'تم حذف (' + formatMixedRtlText(removedName) + ') — الفاتورة فارغة الآن';
          saveInvoiceDraftLocal();
          renderMainOnly();
        } else {
          var costInp = document.getElementById('invCostInput');
          if (costInp) state.stockInvTotalCost = parseNum(costInp.value);
          saveInvoiceDraftLocal();
          lastRenderedMainHtml = '';
          renderMainOnly();
        }
      } else {
        state.stockInvFeedback = '🗑️ تم حذف (' + formatMixedRtlText(removedName) + ') من الفاتورة';
        if (document.getElementById('invQtyInput')) updateStockInvStep1InPlace(); else renderMainOnly();
      }
    }
    function buildStockInvDraftSummaryHtml() {
      var fbHtml = state.stockInvFeedback
        ? '<div class="bg-emerald-950 border border-emerald-500 text-emerald-200 text-[11px] font-extrabold py-2 px-2.5 rounded-xl text-center">' + state.stockInvFeedback + '</div>'
        : '';
      if (state.stockInvDraftItems.length === 0) return fbHtml;
      var itemsListHtml = state.stockInvDraftItems.map(function(it) {
        var descHtml = it.packDescriptionHtml || (fmt(it.packQty) + ' ' + formatMixedRtlText(it.packUnit));
        return '<div class="flex justify-between items-center bg-[#1f1610] px-2.5 py-2 rounded-xl border border-teal-500 text-[12px] gap-2">' +
          '<div class="truncate"><span class="font-extrabold text-amber-200">' + formatMixedRtlText(it.name) + ':</span> <b class="text-teal-300 font-mono">' + descHtml + '</b></div>' +
          '<button type="button" onclick="removeStockInvDraftItem(\'' + escapeAttr(it.itemId) + '\')" class="text-red-200 bg-red-950 border border-red-600 px-2.5 py-1 rounded-lg text-[11px] font-extrabold flex-shrink-0">حذف</button>' +
        '</div>';
      }).join('');
      return '<div class="space-y-2">' + fbHtml + '<div class="space-y-1.5"><div class="text-[11px] font-extrabold text-teal-300">📦 البضاعة المضافة للفاتورة (' + fmt(state.stockInvDraftItems.length) + '):</div>' + itemsListHtml + '</div></div>';
    }
    function updateStockInvStep1InPlace() {
      var gridEl = document.getElementById('stockInvProdGrid'), labelEl = document.getElementById('stockInvQtyLabel');
      var sumEl = document.getElementById('stockInvDraftSummaryBox'), qtyInp = document.getElementById('invQtyInput');
      var currentSt = getCurrentStockInvItem(), rule = getStockPurchaseRule(currentSt);
      if (qtyInp) qtyInp.value = '';
      if (gridEl) gridEl.innerHTML = buildStockInvProdButtonsHtml();
      if (labelEl && currentSt) labelEl.innerHTML = 'الكمية (' + formatMixedRtlText(currentSt.name) + ' - ' + rule.buyUnitHtml + '):';
      if (sumEl) sumEl.innerHTML = buildStockInvDraftSummaryHtml();
      updateStockInvButtonsInPlace(true);
    }
    function saveCurrentStockQtyToDraft() {
      var st = getCurrentStockInvItem(), qtyInp = document.getElementById('invQtyInput');
      if (!st || !qtyInp || qtyInp.value.trim() === '') return false;
      var enteredPackQty = parseNum(qtyInp.value), rule = getStockPurchaseRule(st);
      var existingIdx = state.stockInvDraftItems.findIndex(function(it) { return it.itemId === st.id; });
      if (enteredPackQty <= 0) {
        if (existingIdx !== -1) state.stockInvDraftItems.splice(existingIdx, 1);
        qtyInp.value = ''; saveInvoiceDraftLocal(); return false;
      }
      var isDirectGrams = (st.unit === 'g' && rule.factor === 1000 && enteredPackQty > COFFEE_DIRECT_GRAMS_THRESHOLD);
      var convertedQty = isDirectGrams ? enteredPackQty : (enteredPackQty * rule.factor);
      var usedPackUnit = isDirectGrams ? 'غرام' : rule.buyUnit;
      var usedPackUnitHtml = isDirectGrams ? 'غرام' : (st.unit === 'g' && rule.factor === 1000 ? 'كغ' : rule.buyUnitHtml);
      var itemObj = {
        itemId: st.id,
        name: st.name,
        unit: st.unit,
        packQty: enteredPackQty,
        packUnit: usedPackUnit,
        packDescription: fmtPlain(enteredPackQty) + ' ' + usedPackUnit,
        packDescriptionHtml: fmt(enteredPackQty) + ' ' + usedPackUnitHtml,
        qty: convertedQty
      };
      if (existingIdx !== -1) state.stockInvDraftItems[existingIdx] = itemObj;
      else state.stockInvDraftItems.push(itemObj);
      qtyInp.value = '';
      saveInvoiceDraftLocal();
      return true;
    }
    function selectStockInvItem(itemId) {
      blurActiveInput();
      var autoSaved = saveCurrentStockQtyToDraft();
      state.stockInvItemId = itemId;
      state.stockInvFeedback = autoSaved ? '✓ تم حفظ الكمية تلقائياً' : '';
      saveInvoiceDraftLocal();
      if (document.getElementById('invQtyInput')) updateStockInvStep1InPlace(); else renderMainOnly();
    }
    function addStockItemAndKeepDraft() {
      blurActiveInput();
      var st = getCurrentStockInvItem();
      var wasExisting = state.stockInvDraftItems.some(function(it) { return st && it.itemId === st.id; });
      if (!saveCurrentStockQtyToDraft()) {
        state.stockInvFeedback = '⚠️ اكتب الكمية أولاً ثم اضغط إضافة';
        if (document.getElementById('invQtyInput')) updateStockInvStep1InPlace();
        return;
      }
      var addedItem = state.stockInvDraftItems.find(function(it) { return st && it.itemId === st.id; });
      state.stockInvFeedback = addedItem
        ? (wasExisting
          ? ('✓ تم تعويض كمية ' + formatMixedRtlText(addedItem.name) + ' بـ (' + addedItem.packDescriptionHtml + ')')
          : ('✓ تمت إضافة ' + formatMixedRtlText(addedItem.name) + ' (' + addedItem.packDescriptionHtml + ')'))
        : '✓ تمت الإضافة للفاتورة';

      if (state.isSendingToOwner || isDoubleTapBlocked()) return;
      blurActiveInput();

      if (isReadOnly()) return showToast('🔒 اشتراك المقهى منتهٍ حالياً — لا يمكن الإرسال حتى يتم التجديد.', 'error', 'الاشتراك منتهٍ');
      var costInp = document.getElementById('invCostInput');
      if (costInp) { state.stockInvTotalCost = parseNum(costInp.value); saveInvoiceDraftLocal(); }
      if (state.stockInvDraftItems.length === 0) return showToast('يرجى اختيار السلعة والكمية أولاً', 'error');
      if (state.stockInvTotalCost <= 0) return showToast('يرجى كتابة المبلغ الجملي للفاتورة بالمليم', 'error');
      if (!navigator.onLine) return showToast('⚠️ الهاتف غير متصل بالإنترنت حالياً!\nمعطيات الفاتورة محفوظة أمامك.', 'error', 'لا يوجد اتصال');

      var finalCost = parseNum(state.stockInvTotalCost);
      var draftCopy = state.stockInvDraftItems.slice();
      var invDate = isValidDateStr(state.date) ? state.date : getLocalTodayDateStr();
      var invMonthKey = getMonthKeyFromDate(invDate);
      var nowTs = Date.now();
      var nowHHMM = getCurrentTimeHHMM(nowTs);

      state.isSendingToOwner = true;
      state.sendingStepText = 'جاري تثبيت الفاتورة وإرسالها إلى ' + escapeHtmlLocal(getOwnerName()) + '...';
      renderModalsOnly();

      var numRef = db.ref('tenants/' + state.cafeId + '/live/last_invoice_number');
      numRef.transaction(function(curr) {
        return (parseNum(curr) || 0) + 1;
      }).then(function(txRes) {
        var nextInvNum = parseNum(txRes && txRes.snapshot ? txRes.snapshot.val() : (state.lastInvoiceNumber + 1));
        var invId = db.ref().push().key;

        var itemsPayload = draftCopy.map(function(it, idx) {
          return {
            itemId: it.itemId,
            name: it.name,
            unit: it.unit,
            qty: Number(it.qty) || 0,
            packQty: parseNum(it.packQty),
            packUnit: it.packUnit,
            lineTotal: idx === 0 ? finalCost : 0
          };
        });

        var invoiceObj = {
          invoiceNumber: nextInvNum,
          date: invDate,
          supplier: 'فاتورة مخزن',
          paymentSource: 'worker_cash',
          workerSlot: state.workerSlot,
          workerName: getWorkerName(),
          items: itemsPayload,
          totalAmount: finalCost,
          note: 'فاتورة عدد ' + nextInvNum,
          submittedBy: state.user.uid,
          submittedByRole: 'worker',
          createdAt: nowTs
        };

        return db.ref('tenants/' + state.cafeId + '/submissions/' + invMonthKey + '/invoices/' + invId).set(invoiceObj).then(function() {
          db.ref('tenants/' + state.cafeId + '/live/signals/lastInvoiceAt').set(nowTs).catch(function() {});
          pingWorkerStatus();

          state.lastInvoiceNumber = nextInvNum;
          state.todayExpenses.push({
            id: 'exp_' + nowTs,
            invoiceId: invId,
            invoiceNumber: nextInvNum,
            label: 'فاتورة عدد ' + nextInvNum,
            time: nowHHMM,
            amount: finalCost,
            isStockInvoice: true,
            lockedSent: true
          });

          clearInvoiceDraftLocal();
          state.activeTab = 'daily';
          saveAccountingLocal();
          return nextInvNum;
        });
      }).then(function(invNum) {
        state.isSendingToOwner = false;
        state.sendingStepText = '';
        lastRenderedMainHtml = '';
        render();

        showToast('تم إرسال (فاتورة عدد ' + invNum + ') إلى ' + getOwnerName() + ' وتثبيتها بنجاح!\n• المبلغ: ' + fmtPlain(finalCost) + ' مي', 'success', 'وصلت الفاتورة ✅');
      }).catch(function(err) {
        state.isSendingToOwner = false;
        state.sendingStepText = '';
        renderModalsOnly();
        showToast('⚠️ تعذّر الإرسال: ' + (err && err.message ? err.message : 'تحقق من الإنترنت') + '\nبيانات الفاتورة ما زالت محفوظة أمامك.', 'error', 'لم يكتمل الإرسال');
